<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<script src="i18n.js?v=3"></script>
<title>СТТ — Маршрут</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F5F0EB; --card: #FFFFFF;
  --red: #8B1A1A; --yellow: #8B6914; --green: #2D5A1B;
  --green-bright: #22C55E; --yellow-bright: #F5A623; --red-bright: #EF4444;
  --blue-light: #E8F0FE; --blue: #1a56db;
  --text: #1a1a1a; --muted: #6b7280; --border: #e5e7eb;
  --nav-h: 64px;
}
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 14px; line-height: 1.5; min-height: 100vh;
  padding-bottom: var(--nav-h);
}

/* HEADER */
.header { background: var(--card); padding: 14px 16px 0; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
.header-top { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; }
.header-name { font-weight: 700; font-size: 16px; }
.header-date { font-size: 13px; color: var(--muted); }

/* TABS */
.tabs { display: flex; border-top: 1px solid var(--border); margin: 0 -16px; }
.tab {
  flex: 1; border: none; background: none; padding: 10px 4px 9px;
  font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer;
  border-bottom: 2px solid transparent;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  white-space: nowrap;
}
.tab.active-red    { border-bottom-color: var(--red);    color: var(--red);    font-weight: 700; }
.tab.active-yellow { border-bottom-color: var(--yellow); color: var(--yellow); font-weight: 700; }
.tab.active-green  { border-bottom-color: var(--green);  color: var(--green);  font-weight: 700; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; border-radius: 9px; font-size: 10px; font-weight: 700; padding: 0 4px; background: #f3f4f6; color: var(--text); }
.tab.active-red    .badge { background: #fee2e2; color: var(--red); }
.tab.active-yellow .badge { background: #fef3c7; color: var(--yellow); }
.tab.active-green  .badge { background: #d1fae5; color: var(--green); }

/* INTENTION */


/* CARDS */
.cards { padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--card); border-radius: 12px; padding: 12px 14px; border-left: 3px solid var(--border); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.card.level-red    { border-left-color: var(--red); }
.card.level-yellow { border-left-color: var(--yellow); }
.card.level-green  { border-left-color: var(--green); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card-addr { font-weight: 400; font-size: 12px; color: var(--muted); flex: 1; line-height: 1.3; margin-top: 2px; }
.card-client { font-size: 13px; font-weight: 700; font-style: normal; line-height: 1.3; }
.card-stt { font-weight: 900; font-size: 19px; flex-shrink: 0; line-height: 1.1; }
.card-stt-wrap { text-align: right; flex-shrink: 0; }
.card-stt-label { font-size: 9px; font-weight: 600; color: var(--muted, #8a8478); text-transform: uppercase; letter-spacing: .04em; margin-top: 1px; }
.level-red    .card-stt { color: var(--red); }
.level-yellow .card-stt { color: var(--yellow); }
.level-green  .card-stt { color: var(--green); }
.card-meta { font-size: 12px; color: var(--muted); margin-top: 5px; }
.off-route { color: #b35c5c; }

/* VISITS */
.visits { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.v { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.v-ok     { background: #d1fae5; color: #065f46; }
.v-miss   { background: #fee2e2; color: #991b1b; }
.v-future { background: #f3f4f6; color: #9ca3af; }
.v-sep    { color: #d1d5db; font-size: 16px; margin: 0 2px; }
.v-off    { background: #fee2e2; color: #991b1b; font-size: 11px; font-weight: 700; padding: 0 8px; height: 26px; display: flex; align-items: center; border-radius: 6px; margin-left: 4px; white-space: nowrap; }

/* VISITS (31.08.2026) — ряд визитов с датами, заказ есть/нет/вне маршрута
   вперемешку по хронологии, вместо голых значков + "+N вне" текстом */
.visits-cells { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.v-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 30px; }
.v-cell-icon { width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; }
.v-cell-day { font-size: 9px; color: var(--muted); }
.v-cell-future { background: #E4DCC8 !important; color: var(--muted) !important; font-size: 14px; }
.v-cell-today { box-shadow: inset 0 0 0 2px #A39C87; }
/* 16.11.2026: Маршрут одним списком — будущие визиты только рамкой, сегодня — чёрная рамка с точкой */
.rt .v-cell-future { background: transparent !important; box-shadow: inset 0 0 0 1.5px #C9BFA6; }
.rt .v-cell.today { width: auto; min-width: 30px; }
.rt .v-cell-today { background: #fff !important; box-shadow: inset 0 0 0 2.5px #1F1F1F; color: #1F1F1F !important; font-size: 11px; font-weight: 800; }
.rt .v-cell.today .v-cell-day { color: #1F1F1F; font-weight: 800; font-size: 9.5px; }
.rt .card.level-yellow { border-left-color: #E59A00; }
.rt .level-yellow .card-stt { color: #D98C00; }
.rt-chips { display: flex; gap: 5px; padding: 10px 0 10px; flex-wrap: nowrap; overflow-x: auto; }
.rt-chip { font-size: 12px; font-weight: 700; border-radius: 100px; padding: 4px 9px; cursor: pointer; border: 1px solid transparent; white-space: nowrap; font-family: inherit; }
.rt-chip.all { background: #fff; color: var(--text); border-color: var(--border); }
.rt-chip.red { background: #fee2e2; color: var(--red); } .rt-chip.yellow { background: #fef3c7; color: var(--yellow); } .rt-chip.green { background: #d1fae5; color: var(--green); }
.rt-chip.prob { background: #fff; color: #B42318; border-color: #F3B8B2; }
/* 23.11.2026 причины отсутствия заказа — по макету «Агент: золотая матрица» */
.nr-last { background: #FBE3E1; border-radius: 9px; padding: 6px 9px; font-size: 12px; color: #B42318; line-height: 1.35; font-weight: 600; margin-top: 8px; display: flex; gap: 8px; align-items: flex-start; }
.nr-last b { font-weight: 800; } .nr-last.none { background: #F1EEE8; color: var(--muted); }
.nr-last .nr-y { margin-left: auto; white-space: nowrap; font-weight: 800; color: #1F1F1F; cursor: pointer; border: none; background: none; font: inherit; font-weight: 800; padding: 0; }
.nr-ft { display: flex; justify-content: flex-end; border-top: 1px dashed var(--border); padding-top: 8px; margin-top: 9px; }
.nr-btn { background: transparent; border: 1.5px solid #1F1F1F; color: #1F1F1F; font-weight: 700; border-radius: 10px; padding: 6px 12px; font-size: 12.5px; font-family: inherit; cursor: pointer; text-align: left; }
.nr-btn.set { border-color: #B42318; color: #B42318; background: #FDF1F0; }
.nr-rs { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 8px; }
.nr-rs button { font: inherit; font-size: 12px; font-weight: 700; padding: 7px 10px; border-radius: 9px; background: #F1ECE4; border: none; color: #1F1F1F; cursor: pointer; text-align: left; }
.nr-rs button.on { background: #B42318; color: #fff; }
.nr-rs button.clr { background: transparent; border: 1.5px dashed #9ca3af; color: var(--muted); }
.nr-rs .nr-h { width: 100%; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.nr-card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); border-left: 3px solid #B42318; }
.nr-card summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; }
.nr-card summary::-webkit-details-marker { display: none; }
.nr-lr { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--border); font-size: 13px; align-items: center; }
.nr-lr:first-child { border-top: 0; } .nr-lr .nm { flex: 1; min-width: 0; } .nr-lr b { font-variant-numeric: tabular-nums; }
.nr-lr .bb { flex: none; width: 64px; height: 6px; background: #F1ECE4; border-radius: 3px; overflow: hidden; } .nr-lr .bb i { display: block; height: 100%; background: #D2534C; }
.nr-lr.na { color: var(--muted); } .nr-lr.na .bb i { background: #C9C3B8; }
/* 23.11.2026 «Золотой заказ» и «Приоритет» — макет «Агент: золотая матрица» */
body.gold-on .cat-card { display: none; }
.gm-prev { margin: 10px 16px 0; background: #FFF1CC; color: #8B6914; border-radius: 10px; padding: 8px 12px; font-size: 12.5px; font-weight: 700; line-height: 1.35; }
.gm-mx { margin: 10px 16px 0; background: var(--card); border-radius: 14px; padding: 10px 12px; border: 1.5px solid #4E8B2E; }
.gm-t b { display: block; font-size: 14px; font-weight: 800; } .gm-t span { display: block; font-size: 12.5px; margin-top: 1px; }
.gm-two { display: flex; gap: 10px; margin-top: 8px; align-items: flex-start; } .gm-two > div { flex: 1; min-width: 0; }
.gm-lbl { display: block; font-size: 10.5px; font-weight: 900; letter-spacing: .03em; white-space: nowrap; }
.gm-big { display: block; font-size: 26px; line-height: 1.1; margin-top: 2px; font-weight: 800; font-variant-numeric: tabular-nums; }
.gm-bar { height: 7px; background: #ECE5DC; border-radius: 4px; overflow: hidden; margin-top: 8px; } .gm-bar i { display: block; height: 100%; border-radius: 4px; }
.gm-tb { font: inherit; font-weight: 700; font-size: 12px; margin-top: 8px; padding: 5px 10px; border-radius: 9px; border: 1.5px solid #E4DCD3; background: transparent; cursor: pointer; }
.gm-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #E4DCD3; }
.gm-c { font-size: 12px; font-weight: 800; padding: 5px 9px; border-radius: 9px; background: #ECE5DC; }
.gm-c.ok { background: #E3EFD8; color: #3B6A1C; } .gm-c.no { background: #F8DCDA; color: #B3342C; } .gm-c.go::before { content: "★ "; }
.gm-h { width: 100%; font-size: 12px; color: var(--muted); }
.gm-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; letter-spacing: .06em; margin-top: 8px; }
.gm-row > b { font-weight: 900; } .gm-tot b { border: 1.5px solid #2B2B2B; border-radius: 9px; padding: 2px 9px; font-size: 14px; letter-spacing: 0; }
.gm-seg { display: flex; margin-top: 6px; } .gm-seg button { flex: 1; font: inherit; font-weight: 800; font-size: 13px; padding: 8px 10px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; display: flex; justify-content: space-between; background: #F8DCDA; color: #B3342C; }
.gm-nd { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
.gm-g { color: #4E8B2E; } .gm-a { color: #D9A03A; } .gm-r { color: #B3342C; }
.rt-chip.on { border-color: currentColor; }
.rt-cats { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
/* 17.11.2026: последняя плашка и «= среднее» неразрывны — среднее никогда не стоит одно в пустой строке */
.rt-last { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex: 1 0 auto; }
.rt-cat { font-size: 11.5px; font-weight: 600; border-radius: 7px; padding: 4px 7px; white-space: nowrap; }
.rt-cat b { font-weight: 800; }
.rt-cat.c-red { background: #FDE2E0; color: #B42318; } .rt-cat.c-yellow { background: #FFF1C9; color: #9A5B00; } .rt-cat.c-green { background: #E3F0DB; color: #2D5A1B; } .rt-cat.c-none { background: var(--bg); color: var(--muted); }
.rt-tot { flex-shrink: 0; display: flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.rt-tot b { font-size: 13px; font-weight: 800; color: #1F1F1F; border: 1.5px solid #1F1F1F; border-radius: 7px; padding: 2px 7px; background: #fff; }
.pb { display: flex; align-items: center; gap: 8px; margin-top: 9px; padding-top: 8px; border-top: 1px dashed var(--border); min-height: 30px; }
.pb-txt { flex: 1; font-size: 12.5px; font-weight: 700; color: #B42318; min-width: 0; }
.pb-txt.remind { color: #8a5300; font-weight: 600; font-size: 12px; }
.pb-btn { margin-left: auto; color: #B42318; border: 1px solid #F3B8B2; border-radius: 8px; padding: 4px 9px; background: #fff; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }
.pb-btn.none { color: var(--text); border-color: var(--border); margin-left: 0; }
.pb-day { margin: 0 16px 10px; background: #fff; border: 2px solid #1F1F1F; border-radius: 12px; padding: 9px 10px 9px 12px; display: flex; align-items: center; gap: 10px; }
.pb-day-l { flex: 1; min-width: 0; } .pb-day-q { font-size: 13.5px; font-weight: 800; color: #1F1F1F; } .pb-day-h { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.3; }
.pb-day-btn { flex-shrink: 0; border: none; background: #1F1F1F; color: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 13px; font-family: inherit; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.pb-day.done { background: #fff; border: 1.5px solid #BFE0C8; color: #2D5A1B; font-weight: 700; font-size: 13px; justify-content: space-between; padding: 9px 12px; }
.pb-day.done button { border: none; background: none; color: var(--muted); font-weight: 600; font-size: 12px; cursor: pointer; font-family: inherit; }
.pb-yb { margin: 10px 16px 0; background: #FFF4D6; border-radius: 10px; padding: 9px 11px; }
.pb-yb-t { font-size: 12.5px; font-weight: 700; color: #8a5300; }
.pb-yb-b { display: flex; gap: 6px; margin-top: 7px; } .pb-yb-b .pb-btn { margin-left: 0; }
.pb-sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 100; display: flex; align-items: flex-end; }
.pb-sheet { background: #fff; width: 100%; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 85vh; overflow-y: auto; }
.pb-sheet h4 { margin: 0 0 2px; font-size: 16px; }
.pb-sheet p { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
.pb-opt { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
.pb-opt.on { border-color: #ef4444; background: #fef2f2; } .pb-opt input { accent-color: #ef4444; width: 16px; height: 16px; }
.pb-was { margin-left: auto; font-size: 11px; font-weight: 700; color: #8a5300; background: #FFF4D6; border-radius: 6px; padding: 2px 6px; }
.pb-btns { display: flex; gap: 8px; margin-top: 10px; }
.pb-btns button { flex: 1; border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
.pb-btns .cancel { background: var(--bg); color: var(--text); } .pb-btns .go { background: #1F1F1F; color: #fff; }
.pb-toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: #1F1F1F; color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 10px; z-index: 110; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
.pb-toast.show { opacity: 1; }

/* HINT */
.hint { font-size: 12px; margin-top: 7px; font-weight: 600; }
.hint-need        { color: var(--blue); }
.hint-done        { color: var(--green); }
.hint-unreachable { color: var(--red); }

/* CATS (точки маршрута) */
.cats { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-top: 8px; }
.cat { background: var(--bg); border-radius: 8px; padding: 7px 8px; text-align: center; }
.cat-name { font-size: 10px; color: var(--muted); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-pct  { font-size: 15px; font-weight: 800; }
.cat-miss { font-size: 10px; margin-top: 2px; color: var(--muted); }
.cat-miss.bad { color: var(--red); font-weight: 700; }
.c-red    { color: var(--red); }
.c-yellow { color: var(--yellow); }
.c-green  { color: var(--green); }

/* STT SCREEN */
.stt-screen { padding: 16px; max-width: 720px; }
.stt-top-label { font-size: 13px; color: var(--muted); margin-bottom: 1rem; }

.stt-card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; border-left: 3px solid var(--border); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.stt-card.c-green  { border-left-color: var(--green); }
.stt-card.c-blue   { border-left-color: var(--blue); }
.stt-card.c-purple { border-left-color: #7c4fbf; }
.stt-card.c-teal { border-left-color: #0F6E56; }
.stt-card-head { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
.stt-card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.stt-card.c-green  .stt-card-title { color: var(--green); }
.stt-card.c-blue   .stt-card-title { color: var(--blue); }
.stt-card.c-purple .stt-card-title { color: #7c4fbf; }
.stt-card.c-teal .stt-card-title { color: #0F6E56; }

/* ПРОДАЖИ (01.09.2026) */
.sale-tiles { display: flex; gap: 8px; margin-top: 14px; }
.sale-tile { flex: 1; background: var(--bg); border-radius: 12px; padding: 14px; text-align: center; }
.sale-tile-lbl { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.sale-tile-pct { font-size: 26px; font-weight: 700; }
.sale-tile-sum { font-size: 11px; color: var(--muted); margin-top: 4px; }
.sale-tabs { display: flex; gap: 3px; background: var(--bg); border-radius: 11px; padding: 3px; margin: 16px 0 10px; }
.sale-tab { flex: 1; border: none; font-family: inherit; font-size: 12px; font-weight: 700; padding: 8px 0; border-radius: 8px; cursor: pointer; background: transparent; color: var(--muted); }
.sale-tab.active { background: var(--card); color: var(--text); }
.sale-item { padding: 12px 0; border-bottom: 0.5px solid var(--border); }
.sale-item:last-child { border-bottom: none; }
.sale-item-lbl { display: flex; align-items: center; font-size: 12.5px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.sale-compare-row { display: flex; align-items: center; gap: 6px; }
.sale-compare-col { flex: 1; text-align: center; background: var(--bg); border-radius: 10px; padding: 8px 6px; }
.sale-compare-lbl { font-size: 9.5px; color: var(--muted); margin-bottom: 2px; }
.sale-compare-pct { font-size: 18px; font-weight: 700; color: var(--text); }
.sale-diff { flex-shrink: 0; text-align: center; font-weight: 700; font-size: 12px; padding: 6px 8px; border-radius: 8px; }
.sale-diff-up { background: #E3F3E9; color: #1F4A31; }
.sale-diff-down { background: #FAE7E4; color: #7A2A22; }
.sale-diff-zero { background: var(--bg); color: var(--muted); }
.sale-item-sum { font-size: 10.5px; color: var(--muted); text-align: right; margin-top: 6px; }
.sale-compare-col-orders { background: #F6F1E6; }
.sale-compare-sub { font-size: 8.5px; color: var(--muted); margin-top: 2px; }

.pakb-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
.pakb-bar { display: flex; height: 8px; border-radius: 5px; overflow: hidden; margin-bottom: 10px; }
.pakb-list-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
.pakb-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pakb-list-row .n { font-weight: 700; }
.pakb-list-row .p { color: var(--muted); font-size: 12px; width: 34px; text-align: right; }

.stt-formula-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.stt-block { background: var(--bg); border-radius: 12px; padding: 0.8rem; text-align: center; }
.stt-block-label { font-size: 11px; color: var(--muted); margin: 0 0 4px; }
.stt-block-pct { font-size: 26px; font-weight: 500; line-height: 1; }
.stt-block-sub { font-size: 10.5px; color: #9c998f; margin: 4px 0 0; }
.stt-minus { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.stt-minus-sign { font-size: 16px; color: var(--red); font-weight: 500; }
.stt-minus-text { font-size: 10.5px; color: var(--red); text-align: center; line-height: 1.2; white-space: nowrap; }

.month-toggle { display: flex; gap: 6px; background: var(--bg); padding: 4px; border-radius: 12px; margin-bottom: 14px; }
.month-toggle-btn { flex: 1; text-align: center; padding: 8px 4px; border-radius: 9px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--muted); }

.sec-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0; }
.cats-header { display: flex; align-items: baseline; justify-content: space-between; margin: 16px 0 8px; }

/* HISTORY */
.hist-screen { padding: 16px; }
.goal-bar-wrap { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.goal-bar-track { flex:1; height:6px; background:#e5e7eb; border-radius:3px; overflow:visible; position:relative; }
.goal-bar-fill { height:100%; border-radius:3px; background:#2D5A1B; }
.goal-marker { position:absolute; right:0; top:-4px; width:2px; height:14px; background:#2D5A1B; border-radius:1px; }
.goal-label { font-size:11px; font-weight:700; color:#2D5A1B; white-space:nowrap; }
.trend-banner { background: var(--blue-light); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.trend-arrow { font-size: 16px; color: var(--blue); }
.trend-text  { font-size: 14px; font-weight: 700; color: #1e3a8a; }
.month-card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.month-row  { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.month-name { font-size: 15px; font-weight: 700; }
.month-pct  { font-size: 19px; font-weight: 900; line-height: 1; }
.month-pct-wrap { text-align: right; }
.month-clean { font-size: 11px; margin-top: 2px; }
.seg-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 1px; }
.seg { border-radius: 0; }
.month-leg { display: flex; gap: 10px; row-gap: 5px; margin-top: 7px; flex-wrap: wrap; }
.leg-item  { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.leg-item-muted { color: #9c998f; }
.leg-item-warn  { color: #b35c5c; }
.leg-dot   { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* NAV */
.nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: var(--card); border-top: 1px solid var(--border); display: flex; z-index: 20; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: none; background: none; cursor: pointer; font-size: 10px; color: var(--muted); font-weight: 500; }
.nav-btn.active { color: var(--blue); }
.nav-icon { font-size: 20px; }

/* FOCUS BLOCK */
.focus-block { margin: 10px 16px 4px; }
details.focus-details { background: #fff3cd; border: 1px solid #f59e0b; border-radius: 12px; overflow: hidden; }
details.focus-details summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; }
details.focus-details summary::-webkit-details-marker { display: none; }
#screen-stt .stt-card summary::-webkit-details-marker { display: none; }
.focus-sum-left { display: flex; align-items: center; gap: 8px; }
.focus-title { font-size: 13px; font-weight: 700; color: #7c4f00; }
.focus-count { font-size: 11px; color: #7c4f00; background: rgba(245,158,11,0.2); border-radius: 100px; padding: 2px 8px; font-weight: 700; }
.focus-chevron { font-size: 11px; color: #7c4f00; display: inline-block; transition: transform 0.2s; }
details.focus-details[open] .focus-chevron { transform: rotate(90deg); }
.focus-points { border-top: 1px solid #f0d090; }
.focus-point { display: flex; align-items: flex-start; justify-content: space-between; padding: 9px 14px; border-bottom: 1px solid #f0d090; gap: 8px; }
.focus-point:last-child { border-bottom: none; }
.focus-point-name { font-size: 12px; font-weight: 700; color: #2C2A26; line-height: 1.3; }
.focus-point-client { font-size: 10px; color: #8B6914; margin-top: 1px; font-style: normal; }
.focus-point-reason { font-size: 10px; color: #7c4f00; margin-top: 3px; }
.focus-point-stt { font-size: 13px; font-weight: 700; flex-shrink: 0; }

/* FOCUS CARDS */
.card.focus { border: 2px solid #f59e0b; border-left: 4px solid #f59e0b; }
.focus-badge { display: inline-block; background: #fff3cd; border: 1px solid #f59e0b; border-radius: 6px; font-size: 10px; font-weight: 700; color: #7c4f00; padding: 2px 6px; margin-top: 4px; }
.focus-reason { font-size: 11px; margin-top: 6px; color: #7c4f00; background: #fff3cd; border-radius: 6px; padding: 4px 8px; display: inline-block; }
.focus-banner { margin: 10px 16px 0; background: #fff3cd; border: 1px solid #f59e0b; border-radius: 10px; padding: 9px 12px; display: flex; align-items: center; gap: 8px; }
.focus-banner-text { font-size: 12px; font-weight: 600; color: #7c4f00; }

/* UTILS */
.loader { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 12px; color: var(--muted); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.screen { display: none; }
.screen.active { display: block; }
.demo-bar { position: fixed; top: 0; left: 0; right: 0; background: #f59e0b; color: #fff; text-align: center; font-size: 11px; font-weight: 700; padding: 4px; z-index: 100; letter-spacing: .03em; }
/* 15.10.2026: единый балл — части и формула */
.sp-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin: 6px 0 5px; }
  .sp-loadline { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 10.5px; font-weight: 600; color: var(--muted); background: rgba(240,234,220,.75); border-radius: 10px; padding: 7px 10px; margin: 0 0 6px; }
  .sp-loadline b { font-size: 13px; color: var(--text); white-space: nowrap; }
.sp-tile { background: var(--bg); border-radius: 9px; padding: 6px 3px; text-align: center; }
.sp-tile.off { opacity: .45; }
.sp-v { font-size: 13px; font-weight: 800; }
.sp-l { font-size: 9px; color: var(--muted); font-weight: 600; margin-top: 1px; }
.sp-formula { font-size: 10.5px; color: var(--muted); margin: 2px 0 7px; line-height: 1.4; }
.sp-formula b { color: var(--text); }
.sp-load { font-size: 11px; color: var(--muted); font-weight: 600; margin: -3px 0 4px; }
.sp-load b { color: var(--text); }
.sp-note { font-size: 10.5px; color: var(--muted); line-height: 1.4; margin-top: 6px; padding: 8px 10px; background: var(--bg); border-radius: 10px; }
/* 23.10.2026: рейтинг агента — вариант А (список с кольцами) */
.ra-hero{display:flex;gap:14px;align-items:center;border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ra-hero .l{font-size:11px;color:var(--muted);font-weight:600}
.ra-hero .pl{font-size:21px;font-weight:800;line-height:1.15}.ra-hero .pl small{font-size:13px;color:var(--muted);font-weight:700}
.ra-hero .gap{font-size:11.5px;font-weight:700;color:#D98A3D;margin-top:3px}
.ra-ring{position:relative;flex-shrink:0}.ra-ring svg{display:block;transform:rotate(-90deg)}
.ra-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800}
.ra-list{display:flex;flex-direction:column;gap:8px}
.ra-row{border:1.5px solid #3A3A3A;border-radius:14px;overflow:hidden;background:var(--card)}
.ra-row.me{border:2.5px solid #E39A3B;background:#FFFCF6}
.ra-rh{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.ra-rk{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;background:var(--bg);color:var(--muted)}
.ra-rk.g1{background:#F6D47A;color:#6B4A00}.ra-rk.g2{background:#DCDFE4;color:#4B5563}.ra-rk.g3{background:#EBC2A0;color:#7A3E12}
.ra-nm{font-size:13.5px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.ra-nm i{font-style:normal;font-size:10.5px;font-weight:700;color:#B7791F;background:#FBF1DF;padding:1px 6px;border-radius:5px;margin-left:4px}
.ra-sub{font-size:10.5px;color:var(--muted);font-weight:600}
.ra-strip{display:flex;gap:3px;margin-top:5px}.ra-strip span{flex:1;height:5px;border-radius:3px}
.ra-dl{font-size:10.5px;font-weight:700;margin-top:3px}
.ra-body{display:none;padding:2px 14px 14px;border-top:1px solid var(--border)}
.ra-row.open .ra-body{display:block}
.ra-bar{display:grid;grid-template-columns:86px minmax(0,1fr) 50px;gap:8px;align-items:center;margin-top:9px;font-size:12px}
.ra-bar .lb{color:var(--muted);font-weight:600}.ra-bar .tr{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.ra-bar .tr span{display:block;height:100%;border-radius:4px}.ra-bar .v{text-align:right;font-weight:800}
.ra-frm{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}
.ra-gaprow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:2px}
</style>
</head>
<body>
<div id="app">
  <div class="loader"><div class="spinner"></div><span>Загрузка...</span></div>
</div>

<script>
// 04.10.2026: шкала категорий (как на всех экранах): ≥90 зелёный · 80–89 жёлтый · <80 красный.
function catLevelA(v) { return v >= 90 ? 'green' : v >= 80 ? 'yellow' : 'red'; }
const _CAT_C = { green: 'var(--green-bright)', yellow: 'var(--yellow-bright)', red: 'var(--red-bright)' };
const _CAT_BG = { green: '#EAF3DE', yellow: '#FAEEDA', red: '#FCEBEB' };
// Плашки категорий в рейтинге: от большего % к меньшему (14.10.2026), в свёрнутом
// виде видны 3 самые слабые, остальные (выше) — «ещё N»;
// длинные названия до 16 знаков, полное — по нажатию.
// 15.10.2026: ЕДИНЫЙ БАЛЛ — тот же, что у СВ, ТМ и руководителя: среднее из
// Системной, Чистой, СТТ точек, Категорий (одно число — среднее) и Задач СВ.
function spColor(v, cat) {
  if (cat) return v >= 90 ? 'var(--green-bright)' : v >= 80 ? 'var(--yellow-bright)' : 'var(--red-bright)';
  return v >= 75 ? 'var(--green-bright)' : v >= 50 ? 'var(--yellow-bright)' : 'var(--red-bright)';
}
function scoreParts(p) {
  const f = v => (Math.round(v * 10) / 10).toFixed(1);
  const parts = [['Системная', p.sys, 0], ['Чистая', p.clean, 0], ['СТТ точек', p.stt, 0], ['Категории', p.cats, 1], ['Задачи СВ', p.tasks, 1]];
  const used = parts.filter(x => x[1] != null).map(x => f(x[1]));
  // 16.10.2026: нагрузка — строкой под плашками и подписанным слагаемым в формуле
  // 16.10.2026: в балл нагрузка — не больше 120 (полная цифра — в строке)
  const lf = p.loadRaw != null ? p.loadRaw : p.load;
  if (p.load != null) used.push(`<span style="color:var(--blue)">нагрузка ${f(p.load)}${lf != null && lf > 120 ? ` (${Math.round(lf)}%, засчитываем до 120)` : ''}</span>`);
  const span = parts.length === 5 ? i => i < 3 ? 2 : 3 : () => 2;
  const tiles = parts.map(([l, v, c], i) => `<div class="sp-tile" style="grid-column:span ${span(i)}"><div class="sp-v" style="color:${v == null ? 'var(--muted)' : spColor(v, c)}">${v == null ? '—' : f(v) + '%'}</div><div class="sp-l">${l}</div></div>`).join('');
  return `<div class="sp-grid">${tiles}</div>${p.load != null ? `<div class="sp-loadline"><span>Нагрузка визитов за месяц<small style="display:block;font-size:9.5px;opacity:.85">к типичному агенту компании</small></span><b>${p.loadRaw != null ? Math.round(p.loadRaw) : f(p.load)}%</b></div>` : ''}${used.length ? `<div class="sp-formula">Балл = (${used.join(' + ')}) ÷ ${used.length} = <b>${f(p.avg)}%</b></div>` : ''}`;
}
const SCORE_NOTE = '';
// 23.10.2026: рейтинг агента — вариант А: «Ваше место» с кольцом, строка на агента
// (место в кружке, кольцо балла, полоска из 6 частей), тап — части полосками.
function raRing(v, size, w, fs) {
  const r = (size - w) / 2, c = 2 * Math.PI * r, val = Number(v) || 0, o = c * (1 - Math.max(0, Math.min(val, 100)) / 100);
  return `<div class="ra-ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EFE9E1" stroke-width="${w}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${spColor(val, 0)}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}"/></svg><b style="font-size:${fs}px">${v == null ? '—' : (Math.round(val * 10) / 10).toFixed(1)}</b></div>`;
}
function raRank(n) { return `<div class="ra-rk ${n <= 3 ? 'g' + n : ''}">${n}</div>`; }
function raHero(label, place, total, score, gap) {
  return `<div class="ra-hero">${raRing(score, 70, 8, 18)}<div style="flex:1;min-width:0"><div class="ra-sub">${label}</div>
    <div class="ra-pl pl">${place}-е место <small>из ${total}</small></div>
    ${place > 1 ? `<div class="gap">${gap > 0 ? `до ${place - 1}-го места: +${gap}` : `вровень с ${place - 1}-м местом`}</div>` : '<div class="gap" style="color:var(--green-bright)">Вы первый!</div>'}</div></div>`;
}
function raParts(r) {
  return [['Системная', r.sys, 0], ['Чистая', r.net, 0], ['СТТ точек', r.stt_pct, 0], ['Категории', r.cats_pct, 1],
          ['Задачи СВ', r.focus_pct, 1], ['Нагрузка', r.load_score, 0]].filter(x => x[1] != null);
}
function raRow(r, isMe, open) {
  const parts = raParts(r), f = v => (Math.round(v * 10) / 10).toFixed(1);
  const strip = parts.map(([, v, c]) => `<span style="background:${spColor(v, c)}"></span>`).join('');
  const dl = r.delta != null ? `<div class="ra-dl" style="color:${r.delta >= 0 ? 'var(--green-bright)' : 'var(--red-bright)'}">${r.delta >= 0 ? '▲' : '▼'} ${Math.abs(r.delta)} к прошлому месяцу</div>` : '';
  const bars = parts.map(([l, v, c]) => `<div class="ra-bar"><span class="lb">${l}</span><span class="tr"><span style="width:${Math.max(0, Math.min(v, 100))}%;background:${spColor(v, c)}"></span></span><span class="v" style="color:${spColor(v, c)}">${l === 'Нагрузка' && r.load_pct != null ? Math.round(r.load_pct) + '%' : f(v)}</span></div>`).join('');
  const chips = catChipsBlockA(r.categories);
  return `<div class="ra-row ${isMe ? 'me' : ''} ${open ? 'open' : ''}"><div class="ra-rh" onclick="this.parentElement.classList.toggle('open')">${raRank(r.rank)}
      <div style="min-width:0"><div class="ra-nm">${r.agent}${isMe ? '<i>вы</i>' : ''}</div><div class="ra-strip">${strip}</div>${dl}</div>
      ${raRing(r.avg_score, 46, 5, 12.5)}</div>
    <div class="ra-body">${bars}
      <div class="ra-frm">Балл = среднее ${parts.length} частей = <b style="color:var(--text)">${f(r.avg_score)}%</b>.${r.load_pct != null ? ' Нагрузка — визитов за месяц к типичному агенту компании (в балл не больше 120).' : ''}</div>
      ${chips ? `<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;">${chips}</div>` : ''}</div></div>`;
}
function raTeamHtml(rating, myName) {
  if (!rating.length) return '';
  const i = rating.findIndex(r => r.agent === myName);
  const hero = i >= 0 ? raHero('Ваша команда', i + 1, rating.length, rating[i].avg_score,
    i > 0 ? Math.round((rating[i - 1].avg_score - rating[i].avg_score) * 10) / 10 : null) : '';
  return hero + `<div class="ra-list">${rating.map((r, j) => raRow(r, j === i, j === i)).join('')}</div>`;
}   // 16.10.2026: пояснение убрано — формула под плашками показывает, из чего балл
function catChipsBlockA(categories) {
  const items = Object.entries(categories || {}).sort((a, b) => b[1] - a[1]);
  const chip = ([name, v]) => {
    const l = catLevelA(v), short = name.length > 16 ? name.slice(0, 15).trim() + '…' : name;
    const tap = short !== name ? ` data-full="${name.replace(/"/g, '&quot;')} ${v}%" onclick="event.stopPropagation();this.textContent=this.dataset.full"` : '';
    return `<span${tap} style="font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:${_CAT_BG[l]};color:${_CAT_C[l]};white-space:nowrap;${tap ? 'cursor:pointer;' : ''}">${short} ${v}%</span>`;
  };
  const rest = items.slice(0, -3), head = items.slice(-3).map(chip).join('');
  return rest.length
    ? `<span style="display:none;">${rest.map(chip).join('')}</span><span style="display:contents;">${head}</span><span onclick="event.stopPropagation();this.previousElementSibling.previousElementSibling.style.display='contents';this.remove();" style="cursor:pointer;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--bg);color:var(--muted);">ещё ${rest.length}</span>`
    : head;
}

// 04.10.2026: «Рейтинг торговых» у агента подгружается, только когда карточку
// раскрыли (тот же рейтинг команды, что у СВ; сервер держит его 10 минут).
let _agentRatingMonth = null;
async function loadAgentRating(month, year) {
  const key = month + '.' + year;
  if (_agentRatingMonth === key) return;
  const box = document.getElementById('agent-rating-list');
  if (!box) return;
  try {
    const res = await fetch(`${API}/api/agent/${_telegramId}/rating?month=${month}&year=${year}`);
    const d = await res.json();
    _agentRatingMonth = key;
    const rating = d.rating || [];
    const top = document.getElementById('agent-rating-top');
    const mi = rating.findIndex(r => r.agent === d.my_name);
    if (top) top.textContent = mi >= 0 ? `${mi + 1} из ${rating.length}` : (rating.length ? rating[0].avg_score + '%' : '—');
    const topL = document.getElementById('agent-rating-top-l');
    if (topL) topL.textContent = mi >= 0 ? 'ваше место' : 'лучший';
    box.innerHTML = rating.length
      ? raTeamHtml(rating, d.my_name)
      : '<div style="font-size:12px;color:var(--muted);padding:6px 0;">Рейтинг команды пока недоступен</div>';
  } catch (e) {
    box.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:6px 0;">Не удалось загрузить рейтинг</div>';
  }
  loadRatingScopes(month, year);
}

// 23.10.2026: рейтинг не только в команде — «Торговый отдел» и «Компания» (текущий месяц,
// с 1-го по вчера). Вкладки и их состав задаются в «Должностях» компании. «Команда» —
// прежний подробный рейтинг; в отделе и компании — первый, 3 выше вас, вы и 1 ниже.
let _rateScopes = null, _rateClosed = false;
async function loadRatingScopes(month, year) {
  const seg = document.getElementById('agent-rating-seg');
  if (!seg) return;
  try {
    // 23.10.2026: и за закрытый месяц (из архива «Итоги месяца»), не только за текущий
    const now = new Date(), cur = month === now.getMonth() + 1 && year === now.getFullYear();
    const res = await fetch(`${API}/api/leader/${_telegramId}/agent-rating${cur ? '' : `?month=${month}&year=${year}`}`);
    if (!res.ok) return;
    const d = await res.json();
    if (d.pending) {
      seg.innerHTML = '<div style="font-size:11px;color:var(--muted);margin-bottom:10px;">Рейтинг по отделу и компании считается — загляните через минуту.</div>';
      return;
    }
    _rateScopes = d.scopes || []; _rateClosed = !!d.closed;

const MONTHS = ['','Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

function getTelegramId() {
  const p = new URLSearchParams(window.location.search);
  if (p.get('id')) return p.get('id');
  if (window.Telegram?.WebApp?.initDataUnsafe?.user?.id)
    return String(window.Telegram.WebApp.initDataUnsafe.user.id);
  return null;
}

function levelOf(pct) { return pct >= 75 ? 'green' : pct >= 50 ? 'yellow' : 'red'; }
function colorOf(l)   { return l==='green' ? '#2D5A1B' : l==='yellow' ? '#8B6914' : '#8B1A1A'; }
// 01.08.2026: для чипов "Команда сегодня" (Сист/Чист/категории/Средн)
// зелёный только выше 80% — специально ниже порога всего остального
// приложения (75%), это не опечатка.
function levelOf80(pct) { return pct > 80 ? 'green' : pct >= 50 ? 'yellow' : 'red'; }
function bgOf(l)        { return l==='green' ? '#E3F0DB' : l==='yellow' ? '#F7ECD0' : '#F3DEDE'; }
function barColor(l)  { return l==='green' ? '#4caf50' : l==='yellow' ? '#f59e0b' : '#ef4444'; }

function missLabel(n) {
  if (n === 0) return '0 пропусков';
  if (n === 1) return '1 пропуск';
  if (n >= 2 && n <= 4) return `${n} пропуска`;
  return `${n} пропусков`;
}

function formatDate() {
  const d = new Date();
  const days = ['вс','пн','вт','ср','чт','пт','сб'];
  return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')} · ${days[d.getDay()]}`;
}

function shortAddr(addr) {
  if (!addr) return '';
  const parts = addr.split(',').map(s => s.trim());
  const filtered = parts.filter(p => !/район|область/i.test(p));
  if (filtered.length >= 3) return filtered.slice(-3).join(', ');
  if (filtered.length >= 2) return filtered.slice(-2).join(', ');
  return addr;
}

function normalizePoint(pt) {
  pt.address = pt.tt_short || pt.tt || pt.address || '';
  pt.visits_done = pt.passed_planned !== undefined ? pt.passed_planned : (pt.visits_done || 0);
  pt.visits_total = pt.total_planned !== undefined ? pt.total_planned : (pt.visits_total || 0);
  pt.misses = pt.missed !== undefined ? pt.missed : (pt.misses || 0);

  if (pt.sequence) {
    pt.visits = [];
    for (const [day, has_order] of pt.sequence) {
      // 31.08.2026 (исправлено): day раньше вообще не сохранялся — из-за
      // этого нельзя было показать, В КАКОЙ день был визит/пропуск, только
      // голую последовательность значков. Дата уже приходит с бэкенда
      // (calc_point_stt.sequence), просто терялась здесь.
      pt.visits.push({ day, has_order, is_future: false });
    }
    for (let i = 0; i < (pt.remaining || 0); i++) {
      pt.visits.push({ has_order: false, is_future: true });
    }
  }

  // 31.08.2026: даты заказов вне маршрута (calc_point_stt.off_schedule_dates,
  // добавлено на бэкенде 31.08.2026) — раньше был только счётчик
  // (off_schedule_orders), теперь можно показать, В КАКОЙ день это было.
  pt.off_route_days = Array.isArray(pt.off_schedule_dates)
    ? pt.off_schedule_dates
    : (pt.off_schedule_dates ? Object.values(pt.off_schedule_dates) : []);

  if (!pt.hint) {
    const need75 = pt.need_75 !== undefined ? pt.need_75 : null;
    const remaining = pt.remaining !== undefined ? pt.remaining : null;
    if (pt.orders >= Math.ceil(pt.total_planned * 0.75)) {
      pt.hint = { type: 'achieved' };
    } else if (pt.need_75_possible === false) {
      pt.hint = { type: 'unreachable', need: need75, remaining: remaining };
    } else {
      pt.hint = { type: 'need', need: need75, remaining: remaining };
    }
  }

  if (pt.cat_stts) {
    pt.cats = Object.entries(pt.cat_stts).map(([name, pct]) => ({
      name,
      pct,
      misses: pct === null ? null : ((pt.cat_missed || {})[name] ?? 0)
    })).sort((x, y) => (y.pct ?? -1) - (x.pct ?? -1));   // 14.10.2026: по убыванию
  }

  return pt;
}

function renderVisits(pt) {
  const visits = pt.visits || [];
  const offRouteDays = pt.off_route_days || [];
  if (!visits.length && !offRouteDays.length) return '';

  // 31.08.2026 (переработано): раньше был просто ряд значков без дат и
  // отдельный текст "+N вне" — теперь один хронологический ряд (визит по
  // плану + заказ вне маршрута вперемешку, по датам), с днём недели под
  // каждой иконкой, тем же стилем, что и в "Анализ системности" у ТМ.
  const shortWd = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
  const now = new Date();
  function dayToWd(day) {
    return shortWd[new Date(now.getFullYear(), now.getMonth(), day).getDay()];
  }

  const past = visits.filter(v => !v.is_future && v.day != null);
  const future = visits.filter(v => v.is_future);

  const items = [
    ...past.map(v => ({ day: v.day, type: v.has_order ? 'ok' : 'miss' })),
    ...offRouteDays.map(day => ({ day, type: 'off' })),
  ].sort((a, b) => a.day - b.day);

  const STYLE = {
    ok:   { bg: '#639922', icon: '✓' },
    miss: { bg: '#E24B4A', icon: '✗' },
    off:  { bg: '#378ADD', icon: vgPin('#fff','13px') },
  };

  let html = '<div class="visits-cells">';
  html += items.map(it => {
    const s = STYLE[it.type];
    return `<div class="v-cell"><div class="v-cell-icon" style="background:${s.bg}">${s.icon}</div><span class="v-cell-day">${dayToWd(it.day)}</span></div>`;
  }).join('');
  // 13.10.2026: будущие плановые визиты — каждый своей серой клеткой с днём
  // недели (сколько визитов ещё впереди в этом месяце), вместо одной «ост.».
  // Сегодняшний визит — серая клетка с рамкой и подписью «сег.».
  const futureDays = Array.isArray(pt.remaining_days) ? pt.remaining_days : null;
  const today = now.getDate();
  if (futureDays && futureDays.length) {
    html += futureDays.map(day => {
      const isToday = day === today;
      return `<div class="v-cell${isToday ? ' today' : ''}"><div class="v-cell-icon v-cell-future${isToday ? ' v-cell-today' : ''}">${isToday ? '●' : ''}</div><span class="v-cell-day">${isToday ? 'сегодня' : dayToWd(day)}</span></div>`;
    }).join('');
  } else if (future.length) {
    html += future.map(() => `<div class="v-cell"><div class="v-cell-icon v-cell-future"></div><span class="v-cell-day">&nbsp;</span></div>`).join('');
  }
  return html + '</div>';
}

function renderHint(pt) {
  if (!pt.hint) return '';
  const h = pt.hint;
  if (h.type === 'achieved')    return `<div class="hint hint-done">✅ 75% достигнуто</div>`;
  if (h.type === 'unreachable') return `<div class="hint hint-unreachable">🚫 75% недостижимо — нужно ${h.need !== null ? h.need : '?'}, осталось ${h.remaining !== null ? h.remaining : '?'}</div>`;
  return `<div class="hint hint-need">🎯 нужно ${h.need !== null ? h.need : '?'} из ${h.remaining !== null ? h.remaining : '?'} для 75%</div>`;
}

function renderCats(cats) {
  if (!cats?.length) return '';
  return '<div class="cats">' + cats.map(c => {
    if (c.pct === null || c.pct === undefined) {
      return `<div class="cat">
        <div class="cat-name">${c.name}</div>
        <div class="cat-pct" style="color:var(--muted)">—</div>
      </div>`;
    }
    const lv = levelOf(c.pct);
    const bad = c.misses > 0;
    return `<div class="cat">
      <div class="cat-name">${c.name}</div>
      <div class="cat-pct c-${lv}">${c.pct}%</div>
      <div class="cat-miss${bad?' bad':''}">${missLabel(c.misses)}</div>
    </div>`;
  }).join('') + '</div>';
}

function calcMissedStreak(visits) {
  // Считаем пропуски подряд с конца прошедших визитов
  const past = (visits || []).filter(v => !v.is_future);
  let streak = 0;
  for (let i = past.length - 1; i >= 0; i--) {
    if (!past[i].has_order) streak++;
    else break;
  }
  return streak;
}

function bucketOf(pt) {
  const totalWorked = (pt.orders || 0) + (pt.off_schedule_orders || 0);
  if (totalWorked === 0) return 'red';
  return pt.stt >= 75 ? 'green' : 'yellow';
}

// 16.11.2026: карточка Маршрута одним списком. Убраны строка «прошло N из M ·
// пропуски» и подсказка 75% (пропуски видны по квадратам). Категории — плашками
// в одну строку, в конце «= среднее» в чёрной рамке. Внизу — строка «Проблема».
function renderRtCats(cats) {
  if (!cats?.length) return '';
  const vals = cats.filter(c => c.pct !== null && c.pct !== undefined).map(c => c.pct);
  const avg = vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
  const chip = c => { const has = c.pct !== null && c.pct !== undefined;
    return `<span class="rt-cat c-${has ? levelOf(c.pct) : 'none'}">${c.name} <b>${has ? c.pct + '%' : '—'}</b></span>`; };
  const tot = avg !== null ? `<span class="rt-tot">=<b>${avg}%</b></span>` : '';
  return '<div class="rt-cats">' + cats.slice(0, -1).map(chip).join('') +
    `<span class="rt-last">${chip(cats[cats.length - 1])}${tot}</span></div>`;
}

function renderCard(pt) {
  const lv = bucketOf(pt);
  const badgeLabel = lv === 'red' ? 'Не АКБ' : lv === 'yellow' ? 'АКБ' : 'СТТ';
  const sttBlock = lv === 'red'
    ? `<div class="card-stt" style="font-size:14px">Не АКБ</div>`
    : `<div class="card-stt">${pt.stt}%</div><div class="card-stt-label">${badgeLabel}</div>`;
  return `<div class="card level-${lv}">
    <div class="card-top">
      <div>
        ${pt.client ? `<div class="card-client">${pt.client}</div>` : ''}
        <div class="card-addr">${pt.address}</div>
      </div>
      <div class="card-stt-wrap">${sttBlock}</div>
    </div>
    ${renderVisits(pt)}
    ${nrPrev(pt)}
    ${goldOn() ? goldCard(pt) : renderRtCats(pt.cats)}
    ${nrRow(pt)}
  </div>`;
}

function buildRouteScreen(data) {
  const grouped = { red:[], yellow:[], green:[] };
  for (const pt of (data.points||[])) {
    normalizePoint(pt);
    grouped[bucketOf(pt)].push(pt);
  }

  // Сортируем: фокусные точки (2+ пропуска или вне) наверх
  function sortWithFocus(pts) {
    return [...pts].sort((a, b) => {
      const aFocus = calcMissedStreak(a.visits) >= 2 || (a.off_schedule_orders||0) > 0;
      const bFocus = calcMissedStreak(b.visits) >= 2 || (b.off_schedule_orders||0) > 0;
      return (bFocus ? 1 : 0) - (aFocus ? 1 : 0);
    });
  }

  // Считаем общее кол-во фокусных точек
  const allPoints = [...grouped.red, ...grouped.yellow, ...grouped.green];
  const focusCount = allPoints.filter(p =>
    calcMissedStreak(p.visits) >= 2 || (p.off_schedule_orders||0) > 0
  ).length;

  // 16.11.2026: одним списком (худшие сверху), фильтры вместо вкладок + «Проблемы»
  let tab = 'all', _rtRemembered = false;
  _rtRender = () => render();
  const agentName = data.agent || data.agent_name || '';
  const _badgeNameEl = document.getElementById('agentBadgeName');
  if (_badgeNameEl && agentName) _badgeNameEl.textContent = agentName;
  // 17.11.2026: направление команды перед «Агент» — «Універсали · Агент …»
  const _teamEl = document.getElementById('agentTeam');
  if (_teamEl) _teamEl.textContent = data.team ? data.team + ' · ' : '';

  // Строим блок фокуса СВ
  // Use cross-month focus points from /day endpoint
  const focusPoints = _dayFocusPoints.length > 0 ? _dayFocusPoints : allPoints.filter(p =>
    calcMissedStreak(p.visits) >= 2 || (p.off_schedule_orders||0) > 0
  );

  function getFocusReason(p) {
    if (p.missed_streak >= 3) return '3+ пропуска подряд';
    if (p.missed_streak >= 2) return '2 пропуска подряд';
    if (p.off_route > 0) return 'вне маршрута';
    const streak = calcMissedStreak(p.visits || []);
    if (streak >= 3) return '3+ пропуска подряд';
    if (streak >= 2) return '2 пропуска подряд';
    return 'вне маршрута';
  }

  const focusBlockHtml = focusPoints.length > 0 ? `
    <div class="focus-block">
      <details class="focus-details">
        <summary>
          <div class="focus-sum-left">
            <span style="font-size:16px">⚠️</span>
            <span class="focus-title">Фокус СВ</span>
            <span class="focus-count">${focusPoints.length} точек</span>
          </div>
          <span class="focus-chevron">▶</span>
        </summary>
        <div class="focus-points">
          ${focusPoints.map(p => `
            <div class="focus-point">
              <div>
                ${p.client ? `<div class="focus-point-name">${p.client}</div><div class="focus-point-client">${p.name || p.address || ''}</div>` : `<div class="focus-point-name">${p.name || p.address || ''}</div>`}
                <div class="focus-point-reason">${getFocusReason(p)}</div>
              </div>
            </div>`).join('')}
        </div>
      </details>
    </div>` : '';

  function render() {
    const ordered = [...sortWithFocus(grouped.red), ...sortWithFocus(grouped.yellow), ...sortWithFocus(grouped.green)];
    _rtPoints = ordered;
    if (!_rtRemembered) { _rtRemembered = true; pbRememberRoute(ordered); }
    // 23.11.2026: «Без заказа» — визит сегодня без заказа или прошлый визит без заказа
    const probList = ordered.filter(p => nrTodayOpen(p) || nrLastMiss(p))
      .sort((a, b) => (nrTodayOpen(b) ? 1 : 0) - (nrTodayOpen(a) ? 1 : 0));
    const shown = tab === 'all' ? ordered : tab === 'prob' ? probList : ordered.filter(p => bucketOf(p) === tab);
    document.getElementById('screen-route').innerHTML = `
      <div class="header">
        <div class="header-top">
          <div class="header-name">${agentName}</div>
          <div class="header-date">${formatDate()} <span onclick="refreshAll()" title="Обновить данные" style="cursor:pointer;margin-left:6px;font-size:15px;">↻</span></div>
        </div>
      </div>

      ${focusBlockHtml}
      ${goldTop()}
      <div class="rt" style="padding:0 16px">
        <div class="rt-chips" id="tabs">
          <button class="rt-chip all ${tab==='all'?'on':''}" data-t="all">Все ${allPoints.length}</button>
          <button class="rt-chip red ${tab==='red'?'on':''}" data-t="red">Не АКБ ${grouped.red.length}</button>
          <button class="rt-chip yellow ${tab==='yellow'?'on':''}" data-t="yellow">АКБ ${grouped.yellow.length}</button>
          <button class="rt-chip green ${tab==='green'?'on':''}" data-t="green">СТТ ${grouped.green.length}</button>
          <button class="rt-chip prob ${tab==='prob'?'on':''}" data-t="prob">Без заказа ${probList.length}</button>
        </div>
      </div>
      <div id="tab-content" class="rt">
        ${shown.length
          ? `<div class="cards" style="padding-top:0">${shown.map(renderCard).join('')}</div>`
          : `<div class="empty">${tab === 'prob' ? 'Визитов без заказа нет' : 'Точки отсутствуют'}</div>`}
      </div>`;

    document.getElementById('tabs').addEventListener('click', e => {
      const btn = e.target.closest('[data-t]');
      if (!btn) return;
      tab = btn.dataset.t;
      render();
    });
  }
  render();
}

// point_cards приходит готовым из архива (agent_stt, архивная ветка,
// только для "Прошлый месяц") — здесь только рендер, ничего не считаем.
function _pointAnalysisHtml(pointCards, monthNum, yearNum) {
  // 02.10.2026: новый вид (как у СВ): сводка сразу видна, фильтры, у точки —
  // строка расчёта по новой формуле «(по маршруту − вне) ÷ план».
  if (!pointCards.length) return '';
  const TYPE_NAME = ['ok', 'miss', 'off'];
  const ICON = { ok: '✓', miss: '✗', off: vgPin('#fff','13px') };
  const COLOR = { ok: '#22C55E', miss: '#EF4444', off: '#378ADD' };
  const LV = ['green', 'amber', 'red'];
  const lvColor = { green: '#2D6A45', amber: '#B7791F', red: '#A93B30' };
  const shortWd = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  const dayToWd = day => (!monthNum || !yearNum) ? '' : shortWd[new Date(yearNum, monthNum - 1, day).getDay()];
  function expandItems(compact) {
    if (Array.isArray(compact)) return compact;
    if (!compact) return [];
    const out = [];
    for (let i = 0; i < compact.length; i++) if (compact[i] !== '.') out.push([i + 1, Number(compact[i])]);
    return out;
  }
  // 03.10.2026: процент и уровень точки считаются ПРИ ПОКАЗЕ из истории дней
  // (✓ по маршруту, ✗ пропуск, 📍 вне) по формуле (по маршруту − вне) ÷ план —
  // не берутся готовыми из архива. Так экран верен у всех компаний, в т.ч. с
  // архивом в Google-таблице, без перезакрытия месяца.
  const _v2 = p => {
    if (p.l === 'ghost' || p.i == null) return p;
    const it = expandItems(p.i);
    const ok = it.filter(x => x[1] === 0).length, miss = it.filter(x => x[1] === 1).length, off = it.filter(x => x[1] === 2).length;
    // округление как на сервере (Python round: ровно .5 — к чётному), чтобы экран и бот не расходились на 1%
    const _r = x => { const f = Math.floor(x), d = x - f; return Math.abs(d - 0.5) < 1e-9 ? (f % 2 === 0 ? f : f + 1) : Math.round(x); };
    const plan = ok + miss, s = plan ? _r(Math.max(0, ok - off) / plan * 100) : 0;
    const l = (ok + off === 0) ? 'red' : (s >= 75 ? 'green' : 'amber');
    return Object.assign({}, p, { s, l });
  };
  pointCards = pointCards.map(_v2);
  const stats = p => { const it = expandItems(p.i); const ok = it.filter(x => x[1] === 0).length, miss = it.filter(x => x[1] === 1).length, off = it.filter(x => x[1] === 2).length; return { ok, miss, off, plan: ok + miss }; };
  const c = { green: 0, amber: 0, red: 0, ghost: 0 }, totals = { ok: 0, miss: 0, off: 0 };
  pointCards.forEach(p => { c[p.l in c ? p.l : 'red']++; expandItems(p.i).forEach(([, code]) => { totals[TYPE_NAME[code] || 'miss']++; }); });
  const pts = c.green + c.amber + c.red, pct = n => pts ? Math.round(n / pts * 100) : 0;
  const bar = `<div style="display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--bg);">${LV.map(l => c[l] ? `<div style="width:${c[l] / (pts || 1) * 100}%;background:${lvColor[l]}"></div>` : '').join('')}</div>`;
  const ic = (bg, t) => `<span style="width:20px;height:20px;border-radius:6px;background:${bg};color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px;vertical-align:middle;">${t}</span>`;
  const sorted = [...pointCards].sort((a, b) => (a.l === 'ghost') - (b.l === 'ghost') || (a.l === 'ghost' ? b.s - a.s : a.s - b.s));
  const cards = sorted.map(p => {
    const ghost = p.l === 'ghost', st = stats(p);
    const cells = expandItems(p.i).map(([day, code]) => { const t = TYPE_NAME[code] || 'miss';
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;width:28px;"><div style="width:24px;height:24px;border-radius:6px;background:${COLOR[t]};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;">${ICON[t]}</div><span style="font-size:9px;color:var(--muted);">${dayToWd(day)}</span></div>`; }).join('');
    const calc = ghost ? 'точки нет в вашем плане' : `план ${st.plan} · по маршруту ${st.ok}${st.off ? ` · вне ${st.off} → (${st.ok} − ${st.off}) ÷ ${st.plan}` : ''}`;
    return `<div data-att-lvl="${p.l}" data-att-off="${st.off > 0 ? 1 : 0}" data-att-offn="${st.off}" data-att-ghostn="${ghost ? (p.s || 0) : 0}" style="background:var(--bg);border-radius:10px;padding:10px 12px;">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline;"><div style="font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.n}</div>
      <div style="font-size:15px;font-weight:700;color:${ghost ? '#3D2E66' : (lvColor[p.l] || lvColor.red)};flex-shrink:0;">${ghost ? `${p.s} ${p.s === 1 ? 'заказ' : 'заказов'}` : `${p.s}%`}</div></div>
      <div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px;">${p.a || ''}</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;">${cells}</div>
      <div style="font-size:10.5px;color:var(--muted);margin-top:6px;">${calc}</div></div>`;
  }).join('');
  const filters = [['all','Все'],['red','Не АКБ'],['amber','АКБ'],['green','СТТ'],['off','Вне']].concat(c.ghost ? [['ghost','Призраки']] : []);
  const chips = filters.map(([k, n], idx) => `<button data-att-filter="${k}" onclick="_attFilterAgent('${k}')" style="border:1px solid var(--border);background:${idx === 0 ? 'var(--text)' : 'var(--card, #fff)'};color:${idx === 0 ? '#fff' : 'var(--text)'};font-family:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:16px;white-space:nowrap;cursor:pointer;">${n}</button>`).join('');
  return `<div class="stt-card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;"><span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);">Мои точки</span><span style="font-size:22px;font-weight:700;color:var(--text);">${pointCards.length}</span></div>
      <div style="margin:12px 0 6px;">${bar}</div>
      <div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;"><span style="color:${lvColor.green}">СТТ ${c.green} · ${pct(c.green)}%</span><span style="color:${lvColor.amber}">АКБ ${c.amber} · ${pct(c.amber)}%</span><span style="color:${lvColor.red}">Не АКБ ${c.red} · ${pct(c.red)}%</span></div>
      <div style="border-top:1px solid var(--border);margin:12px 0 8px;"></div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">Плановые визиты: ${totals.ok + totals.miss}</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text);align-items:center;"><span>${ic('#22C55E','✓')} ${totals.ok}</span><span>${ic('#EF4444','✗')} ${totals.miss}</span><span>${ic('#378ADD',vgPin('#fff','12px'))} ${totals.off}</span>${c.ghost ? `<span style="color:var(--muted)">👻 ${c.ghost} точек</span>` : ''}</div>
      <div style="font-size:10px;color:var(--muted);margin-top:8px;line-height:1.35;">✓ заказ в плановый день · ✗ планового заказа нет · ${vgPin()} заказ не в плановый день — вычитается из СТТ точки</div>
    </div>
    <div style="display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px;">${chips}</div>
    <div id="att-points-agent" style="display:flex;flex-direction:column;gap:8px;">${cards}<div data-att-empty style="display:none;font-size:12px;color:var(--muted);padding:6px 0;">Нет точек под этот фильтр</div></div>`;
}

// 03.10.2026: «Вне» — по числу заказов вне маршрута, «Призраки» — по числу
// заказов, от большего к меньшему; остальные фильтры — худший % сверху.
function _attReorder(box, f) {
  if (!box) return;
  const cards = [...box.querySelectorAll(':scope > [data-att-lvl]')];
  cards.forEach((c, i) => { if (c.dataset.attIdx == null) c.dataset.attIdx = i; });
  const key = f === 'off' ? 'attOffn' : f === 'ghost' ? 'attGhostn' : null;
  cards.sort((a, b) => key ? (Number(b.dataset[key]) - Number(a.dataset[key])) || (a.dataset.attIdx - b.dataset.attIdx)
                           : a.dataset.attIdx - b.dataset.attIdx);
  const empty = box.querySelector(':scope > [data-att-empty]');
  cards.forEach(c => box.insertBefore(c, empty));
}

function _attFilterAgent(f) {
  document.querySelectorAll('[data-att-filter]').forEach(b => { const on = b.dataset.attFilter === f; b.style.background = on ? 'var(--text)' : 'var(--card, #fff)'; b.style.color = on ? '#fff' : 'var(--text)'; });
  _attReorder(document.getElementById('att-points-agent'), f);
  let shown = 0;
  document.querySelectorAll('#att-points-agent [data-att-lvl]').forEach(card => {
    const ok = f === 'all' || (f === 'off' ? card.dataset.attOff === '1' : card.dataset.attLvl === f);
    card.style.display = ok ? '' : 'none'; if (ok) shown++;
  });
  const e = document.querySelector('#att-points-agent [data-att-empty]'); if (e) e.style.display = shown ? 'none' : '';
}

function _switchPointAnalysisTab(btn) {
  const level = btn.dataset.paLevel;
  const parent = btn.parentElement;
  parent.querySelectorAll('button').forEach(b => {
    const lvl = b.dataset.paLevel;
    const colors = { red: ['#FCEBEB','#791F1F'], amber: ['#FAEEDA','#633806'], green: ['#EAF3DE','#27500A'], ghost: ['#EDE9F7','#3D2E66'] };
    const tabColors = { red: ['#F7C1C1','#791F1F'], amber: ['#FAC775','#633806'], green: ['#C0DD97','#27500A'], ghost: ['#C9BEEB','#3D2E66'] };
    const isActive = b === btn;
    const [bg, text] = isActive ? tabColors[lvl] : colors[lvl];
    b.style.background = bg;
    b.style.color = text;
  });
  parent.parentElement.querySelectorAll('[data-pa-list]').forEach(el => {
    el.style.display = el.dataset.paList === level ? 'flex' : 'none';
  });
}

// ============================================================
// ПРОДАЖИ (01.09.2026) — карточка "Итоги месяца", "Прошлый месяц".
// 2 плитки сверху (в системе/вне системы) + 2 вкладки одинакового
// формата: "По уровням" (точек%/продаж% по АКБ/СТТ/Призрак — "Не АКБ"
// сознательно не показываем, там денег всегда 0; знаменатель — все
// точки агента) и "По категориям" (тот же формат, знаменатель тот же —
// все точки, вся сумма продаж, просто группировка по товарной
// категории вместо уровня точки). "По уровням" считается целиком из
// уже присланных point_cards, без новых полей с сервера.
// ============================================================
function _salesCardHtml(data, catsData) {
  const amountSystem = data.amount_system || 0;
  const amountNonSystem = data.amount_non_system || 0;
  const totalMoney = amountSystem + amountNonSystem;
  const pointCards = data.point_cards || [];
  const totalPoints = pointCards.length;
  if (!totalMoney && !totalPoints) return '';

  const fmt = n => Math.round(n).toLocaleString('ru-RU');
  const sysPct = totalMoney ? Math.round(amountSystem / totalMoney * 100) : 0;
  const nonSysPct = totalMoney ? 100 - sysPct : 0;

  function itemRow(label, pointsPct, salesPct, sum, dotColor, ordersInfo, pointsInfo) {
    const diff = Math.round(salesPct - pointsPct);
    const diffCls = diff > 0 ? 'sale-diff-up' : diff < 0 ? 'sale-diff-down' : 'sale-diff-zero';
    const diffText = diff > 0 ? `+${diff}` : `${diff}`;
    const dot = dotColor ? `<span style="width:8px;height:8px;border-radius:50%;background:${dotColor};display:inline-block;margin-right:8px;"></span>` : '';
    // 02.09.2026 (переработано): "заказов X%" — округлено до целого (было
    // с десятичными, напр. 94.7%, не в едином стиле с остальными).
    // "точек" тоже получила подпись "X из Y" под собой, для симметрии с
    // "заказов" (у уровней pointsInfo нет — там знаменатель и так виден
    // из соседних вкладок, не дублируем).
    const ordersCol = ordersInfo ? `<div class="sale-compare-col sale-compare-col-orders"><div class="sale-compare-lbl">заказов</div><div class="sale-compare-pct" style="font-size:15px;">${Math.round(ordersInfo.pct)}%</div><div class="sale-compare-sub">${ordersInfo.count} из ${ordersInfo.total}</div></div>` : '';
    const pointsSub = pointsInfo ? `<div class="sale-compare-sub">${pointsInfo.count} из ${pointsInfo.total}</div>` : '';
    return `<div class="sale-item">
      <div class="sale-item-lbl">${dot}${label}</div>
      <div class="sale-compare-row">
        <div class="sale-compare-col"><div class="sale-compare-lbl">точек</div><div class="sale-compare-pct">${pointsPct}%</div>${pointsSub}</div>
        ${ordersCol}
        <div class="sale-diff ${diffCls}">${diffText}</div>
        <div class="sale-compare-col"><div class="sale-compare-lbl">продаж</div><div class="sale-compare-pct">${salesPct}%</div></div>
      </div>
      <div class="sale-item-sum">${fmt(sum)}</div>
    </div>`;
  }

  const levelMeta = { red: {label:'Не АКБ', dot:'#DC5B4E'}, amber: {label:'АКБ', dot:'#E2A335'}, green: {label:'СТТ', dot:'#3FAE6A'}, ghost: {label:'👻 Призрак', dot:'#7A5C9E'} };
  const byLevel = { red: {pts:0,sum:0}, amber: {pts:0,sum:0}, green: {pts:0,sum:0}, ghost: {pts:0,sum:0} };
  pointCards.forEach(p => {
    const l = byLevel[p.l] ? p.l : 'red';
    byLevel[l].pts++;
    byLevel[l].sum += (p.amt || 0);
  });
  const levelRows = ['amber', 'green', 'ghost'].map(lvl => {
    const d = byLevel[lvl];
    if (!d.pts && !d.sum) return '';
    const ptsPct = totalPoints ? Math.round(d.pts / totalPoints * 100) : 0;
    const salesPct = totalMoney ? Math.round(d.sum / totalMoney * 100) : 0;
    return itemRow(levelMeta[lvl].label, ptsPct, salesPct, d.sum, levelMeta[lvl].dot);
  }).join('');

  const amountByCategory = data.amount_by_category || {};
  const categoryPoints = data.category_points || {};
  // 02.09.2026: cat_shares (pct/count заказов по категории — то, что
  // раньше показывал отдельный блок "Категории") ищем по имени, не по
  // порядку — списки денег и заказов не обязаны совпадать по составу
  // категорий 1-в-1 (например, если по категории были только заказы
  // без денег или наоборот).
  const ordersByCat = {};
  (catsData || []).forEach(c => { ordersByCat[c.name] = { count: c.count, pct: c.pct }; });
  const totalAllOrdersForCats = data.total_all_orders ?? 0;
  const categoryRows = Object.keys(amountByCategory)
    .filter(cat => cat)
    .sort((a, b) => amountByCategory[b] - amountByCategory[a])
    .map(cat => {
      const sum = amountByCategory[cat];
      const pts = categoryPoints[cat] || 0;
      const ptsPct = totalPoints ? Math.round(pts / totalPoints * 100) : 0;
      const salesPct = totalMoney ? Math.round(sum / totalMoney * 100) : 0;
      const oi = ordersByCat[cat] ? { count: ordersByCat[cat].count, total: totalAllOrdersForCats, pct: ordersByCat[cat].pct } : null;
      const pi = { count: pts, total: totalPoints };
      return itemRow(cat, ptsPct, salesPct, sum, null, oi, pi);
    }).join('');

  return `<div class="stt-card" style="border-left:3px solid #7A5C1E;">
    <details>
      <summary style="cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;">
        <span class="stt-card-head" style="margin:0"><span>💰</span><span class="stt-card-title" style="color:#7A5C1E;">Продажи</span></span>
        <span style="display:flex;align-items:center;gap:8px;">
          <span style="text-align:right;">
            <span style="display:block;font-size:20px;font-weight:700;color:#7A5C1E;line-height:1;">${sysPct}%</span>
            <span style="display:block;font-size:9px;color:var(--muted);margin-top:2px;">в системе</span>
          </span>
          <span style="font-size:13px;color:var(--muted);">▶</span>
        </span>
      </summary>

      <div class="sale-tiles">
        <div class="sale-tile">
          <div class="sale-tile-lbl">Продажи в системе</div>
          <div class="sale-tile-pct" style="color:#2D5A1B;">${sysPct}%</div>
          <div class="sale-tile-sum">${fmt(amountSystem)}</div>
        </div>
        <div class="sale-tile">
          <div class="sale-tile-lbl">Продажи вне системы</div>
          <div class="sale-tile-pct" style="color:#A32D2D;">${nonSysPct}%</div>
          <div class="sale-tile-sum">${fmt(amountNonSystem)}</div>
        </div>
      </div>

      <div class="sale-tabs">
        <button class="sale-tab active" data-sale-tab="lvl" onclick="_switchSalesTab(this)">По уровням</button>
        <button class="sale-tab" data-sale-tab="cat" onclick="_switchSalesTab(this)">По категориям</button>
      </div>

      <div data-sale-pane="lvl">${levelRows || '<div style="font-size:12px;color:var(--muted);padding:8px 0;">Нет данных</div>'}</div>
      <div data-sale-pane="cat" style="display:none;">${categoryRows || '<div style="font-size:12px;color:var(--muted);padding:8px 0;">Нет данных</div>'}</div>
    </details>
  </div>`;
}

function _switchSalesTab(btn) {
  const key = btn.dataset.saleTab;
  const parent = btn.parentElement;
  parent.querySelectorAll('.sale-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  parent.parentElement.querySelectorAll('[data-sale-pane]').forEach(el => {
    el.style.display = el.dataset.salePane === key ? 'block' : 'none';
  });
}

// ============================================================
// ЗАДАЧИ СВ (04.09.2026) — только "Прошлый месяц" (архив), для текущего
// не считается. Сколько раз точки попадали в фокус за месяц (2+
// пропуска подряд или заказ вне маршрута в этот день) и сколько из этих
// дней в тот же день пришёл заказ. У агента — без разбивки по агентам
// (это его же собственный отчёт).
// ============================================================
function _focusTasksCardHtml(data) {
  const total = data.focus_tasks_total || 0;
  const completed = data.focus_tasks_completed || 0;
  // 13.10.2026: задач нет, а плановые визиты были — точек с 2+ пропусками подряд
  // не возникло: «Задачи СВ» выполнены на 100%. Нет и визитов — карточку не показываем.
  if (!total) {
    if (!(data.planned_visits || data.passed_visits)) return '';
    return `<div class="stt-card" style="border-left:3px solid #B8862B;display:flex;align-items:center;justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:7px;"><span>🎯</span><span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#B8862B;">Задачи СВ</span></div>
      <div style="text-align:right;"><div style="font-size:20px;font-weight:700;color:#3FAE6A;">100%</div>
        <div style="font-size:9px;color:var(--muted);">точек с 2+ пропусками не было</div></div>
    </div>`;
  }
  const pct = Math.round(completed / total * 100);
  // 04.09.2026: цвет — ≥90 зелёный, 80-90 жёлтый, <80 красный.
  const color = pct >= 90 ? '#3FAE6A' : pct >= 80 ? '#E2A335' : '#DC5B4E';
  const colorBg = pct >= 90 ? '#EAF3DE' : pct >= 80 ? '#FAEEDA' : '#FCEBEB';
  return `<details class="stt-card" style="border-left:3px solid #B8862B;">
    <summary style="cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;">
      <span class="stt-card-head" style="margin:0"><span>🎯</span><span class="stt-card-title" style="color:#B8862B;">Задачи СВ</span></span>
      <span style="display:flex;align-items:center;gap:8px;">
        <span style="text-align:right;">
          <span style="display:block;font-size:20px;font-weight:700;color:${color};line-height:1;">${pct}%</span>
          <span style="display:block;font-size:9px;color:var(--muted);margin-top:2px;">выполнено</span>
        </span>
        <span style="font-size:13px;color:var(--muted);">▶</span>
      </span>
    </summary>
    <div style="padding-top:14px;">
    <div style="display:flex;gap:8px;margin-bottom:6px;">
      <div style="flex:1;background:var(--bg);border-radius:12px;padding:14px;text-align:center;">
        <div style="font-size:24px;font-weight:700;color:var(--text);">${total}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3;">точек в фокусе<br>(суммарно за месяц)</div>
      </div>
      <div style="flex:1;background:var(--bg);border-radius:12px;padding:14px;text-align:center;">
        <div style="font-size:24px;font-weight:700;color:#3B6D11;">${completed}</div>

function _dayChipsHtml() {
  const dow = ['вс','пн','вт','ср','чт','пт','сб'];
  const today = new Date();
  const periods = [
    { key: 'today',     label: 'Сегодня',      date: today },
    { key: 'yesterday', label: 'Прошлый день', date: (() => { const d = new Date(); d.setDate(d.getDate()-1); return d; })() },
    { key: 'weekago',   label: 'Неделя назад', date: (() => { const d = new Date(); d.setDate(d.getDate()-7); return d; })() },
  ];
  const active = periods.find(p =>
    p.date.getFullYear() === _dayDate.getFullYear() &&
    p.date.getMonth()    === _dayDate.getMonth()    &&
    p.date.getDate()     === _dayDate.getDate()
  );
  const activeKey = active ? active.key : null;

  return `<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;">${_fmtDayLabel(_dayDate)}</div>
    <div style="display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);">
      ${periods.map(p => `<div style="flex:1;text-align:center;padding:8px 4px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;${p.key===activeKey?'background:var(--text);color:#fff;':'color:var(--muted);'}" onclick="jumpToDay('${_localDateStr(p.date)}')">${p.label}</div>`).join('')}
    </div>`;
}

function buildDayScreen(data) {
  if (!data || !data.my) {

  }

  const my = data.my;
  const focusPts = data.focus_points || [];
  const team = data.team || [];
  const myCatShares = data.cat_shares_today || {};
  const myTotalOrdersToday = data.total_orders_today || 0;

  const tileStyle = 'background:var(--bg);border-radius:10px;padding:10px 12px;';
  // 19.10.2026: две строки по три — «плановых визитов · заказов по маршруту = системная»,
  // «вне маршрута · призраки = чистая»; вне и призраки нажимаются — список точек → карточка точки
  const myHtml = vgTiles({
    key: 'me', planned: my.planned, orders: my.orders, sys: my.sys_stt, clean: my.clean_stt,
    sysColor: colorOf(levelOf(my.sys_stt)), cleanColor: colorOf(levelOf(my.clean_stt)),
    off: my.off_sched != null ? my.off_sched : my.off, ghost: my.ghost || 0,
    offHtml: vgAgentList(data.agent, my.off_list, 'off'), ghostHtml: vgAgentList(data.agent, my.ghost_list, 'ghost'),
  });

  const myCatEntries = Object.entries(myCatShares).sort((a, b) => (b[1].pct ?? -1) - (a[1].pct ?? -1));   // 14.10.2026: по убыванию
  const myCatPcts = myCatEntries.map(([,v]) => v.pct);
  const myCatAvg = myCatPcts.length ? Math.round(myCatPcts.reduce((s,v)=>s+v,0) / myCatPcts.length) : null;
  const myCatAvgColor = myCatAvg == null ? 'var(--text)' : colorOf(levelOf(myCatAvg));
  const catsHtml = myCatEntries.length
    ? `<div style="display:flex;flex-wrap:wrap;gap:6px;">${myCatEntries.map(([name, v]) => `
        <div style="flex:1 1 30%;min-width:90px;${tileStyle}text-align:center;">

          <div style="font-size:16px;font-weight:700;">${v.pct}%</div>
        </div>`).join('')}</div>`
    : '<div style="font-size:12px;color:var(--muted);">Категории не заданы</div>';

  const focusDoneCount = focusPts.filter(p => p.had_order).length;
  const focusPct = focusPts.length ? Math.round(focusDoneCount / focusPts.length * 100) : null;
  const focusHtml = focusPts.length > 0
    ? focusPts.map((p, i) => {
        const res = p.had_order
          ? '<span style="color:#2D5A1B;font-weight:700;font-size:15px;flex-shrink:0">✓</span>'
          : '<span style="color:#8B1A1A;font-weight:700;font-size:15px;flex-shrink:0">✕</span>';
        const border = i < focusPts.length - 1 ? 'border-bottom:1px solid #f0d090;' : '';
        const ptLabel = p.client
          ? `<div style="font-size:12px;font-weight:700;line-height:1.3">${p.client}</div><div style="font-size:10px;color:#8B6914;margin-top:1px">${p.name || ''}</div>`
          : `<div style="font-size:12px;font-weight:600;line-height:1.3">${p.name || ''}</div>`;
        return `<div style="display:flex;align-items:flex-start;justify-content:space-between;padding:8px 0;${border}gap:8px">
          <div>${ptLabel}</div>${res}</div>`;
      }).join('')
    : '<div style="font-size:13px;color:#8B6914;padding:8px 0">Нет точек контроля от СВ</div>';

  function _fmtPct1(v) {
    return v.toFixed(1).replace('.', ',');
  }

  function dayCell(val, isTotal) {
    const lv = levelOf80(val);
    if (isTotal) {

    return `<div style="flex:1;background:${bgOf(lv)};border-radius:6px;padding:5px 2px;text-align:center;margin:0 2px;">

  // 01.08.2026: подписи колонок (Сист/Чист/категории/Итог) выводятся ОДИН

  }).join('') || '<div style="font-size:13px;color:var(--muted);padding:8px 0">Нет данных по команде</div>';

  const cardStyle = 'background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);';

  document.getElementById('screen-day').innerHTML = `

          <span style="font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em;">📊 Система</span>
          <div style="display:flex;align-items:center;gap:6px"><span style="font-size:18px;font-weight:700;color:${colorOf(levelOf(my.clean_stt))}">${my.clean_stt}%</span><span style="font-size:10px;color:var(--muted)">▶</span></div>
        </summary>

function _localDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function _fmtDayLabel(d) {
  const days = ['вс','пн','вт','ср','чт','пт','сб'];
  return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')} · ${days[d.getDay()]}`;
}

// 01.08.2026: тот же чип-переключатель на 7 дней, что уже сделан у СВ.
async function jumpToDay(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const next = new Date(y, m - 1, d);
  if (next > new Date()) return;
  _dayDate = next;
  const el = document.getElementById('screen-day');
  el.innerHTML = '<div class="loader"><div class="spinner"></div><span>Загрузка...</span></div>';
  try {
    buildDayScreen(await getJSON('day:' + dateStr, `${API}/api/agent/${_telegramId}/day?d=${dateStr}`));
  } catch (e) {
    el.innerHTML = '<div class="empty">⚠️ Ошибка загрузки итога дня</div>';
  }
}

function fetchAndBuildStt(offset) {

}

  return `<div class="vg-card${ghost ? ' ghost' : ''}">
    <div class="vg-pt">${vgEsc(d.name)}</div>
    <div class="vg-pts">${d.address && d.address !== d.name ? vgEsc(d.address) + ' · ' : ''}код ${vgEsc(d.tt_code)}<br>${vgEsc(d.agent)}</div>
    ${planLine}
    <div class="vg-leg2">${ghost ? '' : `<span><i class="vg-sw" style="background:${VG_OK};box-shadow:inset 0 0 0 2.5px #1f2937"></i>плановый день · заказ есть</span>
      <span><i class="vg-sw" style="background:${VG_MISS};box-shadow:inset 0 0 0 2.5px #1f2937"></i>плановый день · заказа нет</span>
      <span><i class="vg-sw" style="background:#fff;box-shadow:inset 0 0 0 2.5px #1f2937;outline:1px dashed #9ca3af;outline-offset:-5px"></i>плановый день · впереди</span>`}
      <span><i class="vg-sw" style="background:${ghost ? VG_GHOST : VG_BLUE}"></i>${ghost ? 'заказ, точки нет в плане' : 'заказ не в плановый день'}</span></div>
    ${months}
    <div class="vg-sum"><div><b style="color:${VG_OK}">${t.ok || 0}</b>по плану</div><div><b style="color:${ghost ? VG_GHOST : VG_BLUE}">${t.off || 0}</b>${ghost ? 'призрак' : 'вне'}</div><div><b style="color:${VG_MISS}">${t.miss || 0}</b>без заказа</div><div><b>${t.fut || 0}</b>впереди</div></div>
    ${verdict}
  </div>`;
}

</script>
</body>
</html>
