<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>СТТ — Маршрут</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F5F0EB; --card: #FFFFFF;
  --red: #8B1A1A; --yellow: #8B6914; --green: #2D5A1B;
  --green-bright: #22C55E; --yellow-bright: #F5A623; --red-bright: #EF4444;
  --blue-light: #E8F0FE; --blue: #1a56db;
  --text: #1a1a1a; --muted: #6b7280; --border: #e5e7eb;
  --nav-h: 64px;
}
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 14px; line-height: 1.5; min-height: 100vh;
  padding-bottom: var(--nav-h);
}

/* HEADER */
.header { background: var(--card); padding: 14px 16px 0; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
.header-top { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; }
.header-name { font-weight: 700; font-size: 16px; }
.header-date { font-size: 13px; color: var(--muted); }

/* TABS */
.tabs { display: flex; border-top: 1px solid var(--border); margin: 0 -16px; }
.tab {
  flex: 1; border: none; background: none; padding: 10px 4px 9px;
  font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer;
  border-bottom: 2px solid transparent;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  white-space: nowrap;
}
.tab.active-red    { border-bottom-color: var(--red);    color: var(--red);    font-weight: 700; }
.tab.active-yellow { border-bottom-color: var(--yellow); color: var(--yellow); font-weight: 700; }
.tab.active-green  { border-bottom-color: var(--green);  color: var(--green);  font-weight: 700; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; border-radius: 9px; font-size: 10px; font-weight: 700; padding: 0 4px; background: #f3f4f6; color: var(--text); }
.tab.active-red    .badge { background: #fee2e2; color: var(--red); }
.tab.active-yellow .badge { background: #fef3c7; color: var(--yellow); }
.tab.active-green  .badge { background: #d1fae5; color: var(--green); }

/* INTENTION */


/* CARDS */
.cards { padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--card); border-radius: 12px; padding: 12px 14px; border-left: 3px solid var(--border); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.card.level-red    { border-left-color: var(--red); }
.card.level-yellow { border-left-color: var(--yellow); }
.card.level-green  { border-left-color: var(--green); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card-addr { font-weight: 400; font-size: 12px; color: var(--muted); flex: 1; line-height: 1.3; margin-top: 2px; }
.card-client { font-size: 13px; font-weight: 700; font-style: normal; line-height: 1.3; }
.card-stt { font-weight: 900; font-size: 19px; flex-shrink: 0; line-height: 1.1; }
.card-stt-wrap { text-align: right; flex-shrink: 0; }
.card-stt-label { font-size: 9px; font-weight: 600; color: var(--muted, #8a8478); text-transform: uppercase; letter-spacing: .04em; margin-top: 1px; }
.level-red    .card-stt { color: var(--red); }
.level-yellow .card-stt { color: var(--yellow); }
.level-green  .card-stt { color: var(--green); }
.card-meta { font-size: 12px; color: var(--muted); margin-top: 5px; }
.off-route { color: #b35c5c; }

/* VISITS */
.visits { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.v { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.v-ok     { background: #d1fae5; color: #065f46; }
.v-miss   { background: #fee2e2; color: #991b1b; }
.v-future { background: #f3f4f6; color: #9ca3af; }
.v-sep    { color: #d1d5db; font-size: 16px; margin: 0 2px; }
.v-off    { background: #fee2e2; color: #991b1b; font-size: 11px; font-weight: 700; padding: 0 8px; height: 26px; display: flex; align-items: center; border-radius: 6px; margin-left: 4px; white-space: nowrap; }

/* VISITS (31.08.2026) — ряд визитов с датами, заказ есть/нет/вне маршрута
   вперемешку по хронологии, вместо голых значков + "+N вне" текстом */
.visits-cells { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.v-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 30px; }
.v-cell-icon { width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; }
.v-cell-day { font-size: 9px; color: var(--muted); }
.v-cell-future { background: #E4DCC8 !important; color: var(--muted) !important; font-size: 14px; }

/* HINT */
.hint { font-size: 12px; margin-top: 7px; font-weight: 600; }
.hint-need        { color: var(--blue); }
.hint-done        { color: var(--green); }
.hint-unreachable { color: var(--red); }

/* CATS (точки маршрута) */
.cats { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-top: 8px; }
.cat { background: var(--bg); border-radius: 8px; padding: 7px 8px; text-align: center; }
.cat-name { font-size: 10px; color: var(--muted); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-pct  { font-size: 15px; font-weight: 800; }
.cat-miss { font-size: 10px; margin-top: 2px; color: var(--muted); }
.cat-miss.bad { color: var(--red); font-weight: 700; }
.c-red    { color: var(--red); }
.c-yellow { color: var(--yellow); }
.c-green  { color: var(--green); }

/* STT SCREEN */
.stt-screen { padding: 16px; max-width: 720px; }
.stt-top-label { font-size: 13px; color: var(--muted); margin-bottom: 1rem; }

.stt-card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; border-left: 3px solid var(--border); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.stt-card.c-green  { border-left-color: var(--green); }
.stt-card.c-blue   { border-left-color: var(--blue); }
.stt-card.c-purple { border-left-color: #7c4fbf; }
.stt-card.c-teal { border-left-color: #0F6E56; }
.stt-card-head { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
.stt-card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.stt-card.c-green  .stt-card-title { color: var(--green); }
.stt-card.c-blue   .stt-card-title { color: var(--blue); }
.stt-card.c-purple .stt-card-title { color: #7c4fbf; }
.stt-card.c-teal .stt-card-title { color: #0F6E56; }

.pakb-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
.pakb-bar { display: flex; height: 8px; border-radius: 5px; overflow: hidden; margin-bottom: 10px; }
.pakb-list-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
.pakb-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pakb-list-row .n { font-weight: 700; }
.pakb-list-row .p { color: var(--muted); font-size: 12px; width: 34px; text-align: right; }

.stt-formula-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.stt-block { background: var(--bg); border-radius: 12px; padding: 0.8rem; text-align: center; }
.stt-block-label { font-size: 11px; color: var(--muted); margin: 0 0 4px; }
.stt-block-pct { font-size: 26px; font-weight: 500; line-height: 1; }
.stt-block-sub { font-size: 10.5px; color: #9c998f; margin: 4px 0 0; }
.stt-minus { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.stt-minus-sign { font-size: 16px; color: var(--red); font-weight: 500; }
.stt-minus-text { font-size: 10.5px; color: var(--red); text-align: center; line-height: 1.2; white-space: nowrap; }
.stt-month-note { font-size: 10.5px; color: var(--muted); margin-bottom: 10px; line-height: 1.3; }

.month-toggle { display: flex; gap: 6px; background: var(--bg); padding: 4px; border-radius: 12px; margin-bottom: 14px; }
.month-toggle-btn { flex: 1; text-align: center; padding: 8px 4px; border-radius: 9px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--muted); }
.month-toggle-btn.active { background: var(--text); color: #fff; }

.sec-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0; }
.cats-header { display: flex; align-items: baseline; justify-content: space-between; margin: 16px 0 8px; }
.cats-total { font-size: 11px; color: var(--muted); }
.cats-stt { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.cat-stt-card { background: #dde8fb; border-radius: 10px; padding: 12px 10px; text-align: center; }
.cat-stt-name { font-size: 12px; color: #1a4fa3; margin: 0 0 4px; }
.cat-stt-pct  { font-size: 22px; font-weight: 500; color: #1a4fa3; }
.cat-stt-count { font-size: 11px; color: #1a4fa3; opacity: .75; margin-top: 4px; }

/* HISTORY */
.hist-screen { padding: 16px; }
.goal-bar-wrap { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.goal-bar-track { flex:1; height:6px; background:#e5e7eb; border-radius:3px; overflow:visible; position:relative; }
.goal-bar-fill { height:100%; border-radius:3px; background:#2D5A1B; }
.goal-marker { position:absolute; right:0; top:-4px; width:2px; height:14px; background:#2D5A1B; border-radius:1px; }
.goal-label { font-size:11px; font-weight:700; color:#2D5A1B; white-space:nowrap; }
.trend-banner { background: var(--blue-light); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.trend-arrow { font-size: 16px; color: var(--blue); }
.trend-text  { font-size: 14px; font-weight: 700; color: #1e3a8a; }
.month-card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.month-row  { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.month-name { font-size: 15px; font-weight: 700; }
.month-pct  { font-size: 19px; font-weight: 900; line-height: 1; }
.month-pct-wrap { text-align: right; }
.month-clean { font-size: 11px; margin-top: 2px; }
.seg-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 1px; }
.seg { border-radius: 0; }
.month-leg { display: flex; gap: 10px; row-gap: 5px; margin-top: 7px; flex-wrap: wrap; }
.leg-item  { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.leg-item-muted { color: #9c998f; }
.leg-item-warn  { color: #b35c5c; }
.leg-dot   { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* NAV */
.nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: var(--card); border-top: 1px solid var(--border); display: flex; z-index: 20; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: none; background: none; cursor: pointer; font-size: 10px; color: var(--muted); font-weight: 500; }
.nav-btn.active { color: var(--blue); }
.nav-icon { font-size: 20px; }

/* FOCUS BLOCK */
.focus-block { margin: 10px 16px 4px; }
details.focus-details { background: #fff3cd; border: 1px solid #f59e0b; border-radius: 12px; overflow: hidden; }
details.focus-details summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; }
details.focus-details summary::-webkit-details-marker { display: none; }
.focus-sum-left { display: flex; align-items: center; gap: 8px; }
.focus-title { font-size: 13px; font-weight: 700; color: #7c4f00; }
.focus-count { font-size: 11px; color: #7c4f00; background: rgba(245,158,11,0.2); border-radius: 100px; padding: 2px 8px; font-weight: 700; }
.focus-chevron { font-size: 11px; color: #7c4f00; display: inline-block; transition: transform 0.2s; }
details.focus-details[open] .focus-chevron { transform: rotate(90deg); }
.focus-points { border-top: 1px solid #f0d090; }
.focus-point { display: flex; align-items: flex-start; justify-content: space-between; padding: 9px 14px; border-bottom: 1px solid #f0d090; gap: 8px; }
.focus-point:last-child { border-bottom: none; }
.focus-point-name { font-size: 12px; font-weight: 700; color: #2C2A26; line-height: 1.3; }
.focus-point-client { font-size: 10px; color: #8B6914; margin-top: 1px; font-style: normal; }
.focus-point-reason { font-size: 10px; color: #7c4f00; margin-top: 3px; }
.focus-point-stt { font-size: 13px; font-weight: 700; flex-shrink: 0; }

/* FOCUS CARDS */
.card.focus { border: 2px solid #f59e0b; border-left: 4px solid #f59e0b; }
.focus-badge { display: inline-block; background: #fff3cd; border: 1px solid #f59e0b; border-radius: 6px; font-size: 10px; font-weight: 700; color: #7c4f00; padding: 2px 6px; margin-top: 4px; }
.focus-reason { font-size: 11px; margin-top: 6px; color: #7c4f00; background: #fff3cd; border-radius: 6px; padding: 4px 8px; display: inline-block; }
.focus-banner { margin: 10px 16px 0; background: #fff3cd; border: 1px solid #f59e0b; border-radius: 10px; padding: 9px 12px; display: flex; align-items: center; gap: 8px; }
.focus-banner-text { font-size: 12px; font-weight: 600; color: #7c4f00; }

/* UTILS */
.loader { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 12px; color: var(--muted); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.screen { display: none; }
.screen.active { display: block; }
.demo-bar { position: fixed; top: 0; left: 0; right: 0; background: #f59e0b; color: #fff; text-align: center; font-size: 11px; font-weight: 700; padding: 4px; z-index: 100; letter-spacing: .03em; }
</style>
</head>
<body>
<div id="app">
  <div class="loader"><div class="spinner"></div><span>Загрузка...</span></div>
</div>

<script>
const API = 'https://develop-production-0a2d.up.railway.app';
const MONTHS = ['','Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

function getTelegramId() {
  const p = new URLSearchParams(window.location.search);
  if (p.get('id')) return p.get('id');
  if (window.Telegram?.WebApp?.initDataUnsafe?.user?.id)
    return String(window.Telegram.WebApp.initDataUnsafe.user.id);
  return null;
}

function levelOf(pct) { return pct >= 75 ? 'green' : pct >= 50 ? 'yellow' : 'red'; }
function colorOf(l)   { return l==='green' ? '#2D5A1B' : l==='yellow' ? '#8B6914' : '#8B1A1A'; }
// 01.08.2026: для чипов "Команда сегодня" (Сист/Чист/категории/Средн)
// зелёный только выше 80% — специально ниже порога всего остального
// приложения (75%), это не опечатка.
function levelOf80(pct) { return pct > 80 ? 'green' : pct >= 50 ? 'yellow' : 'red'; }
function bgOf(l)        { return l==='green' ? '#E3F0DB' : l==='yellow' ? '#F7ECD0' : '#F3DEDE'; }
function barColor(l)  { return l==='green' ? '#4caf50' : l==='yellow' ? '#f59e0b' : '#ef4444'; }

function missLabel(n) {
  if (n === 0) return '0 пропусков';
  if (n === 1) return '1 пропуск';
  if (n >= 2 && n <= 4) return `${n} пропуска`;
  return `${n} пропусков`;
}

function formatDate() {
  const d = new Date();
  const days = ['вс','пн','вт','ср','чт','пт','сб'];
  return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')} · ${days[d.getDay()]}`;
}

function shortAddr(addr) {
  if (!addr) return '';
  const parts = addr.split(',').map(s => s.trim());
  const filtered = parts.filter(p => !/район|область/i.test(p));
  if (filtered.length >= 3) return filtered.slice(-3).join(', ');
  if (filtered.length >= 2) return filtered.slice(-2).join(', ');
  return addr;
}

function normalizePoint(pt) {
  pt.address = pt.tt_short || pt.tt || pt.address || '';
  pt.visits_done = pt.passed_planned !== undefined ? pt.passed_planned : (pt.visits_done || 0);
  pt.visits_total = pt.total_planned !== undefined ? pt.total_planned : (pt.visits_total || 0);
  pt.misses = pt.missed !== undefined ? pt.missed : (pt.misses || 0);

  if (pt.sequence) {
    pt.visits = [];
    for (const [day, has_order] of pt.sequence) {
      // 31.08.2026 (исправлено): day раньше вообще не сохранялся — из-за
      // этого нельзя было показать, В КАКОЙ день был визит/пропуск, только
      // голую последовательность значков. Дата уже приходит с бэкенда
      // (calc_point_stt.sequence), просто терялась здесь.
      pt.visits.push({ day, has_order, is_future: false });
    }
    for (let i = 0; i < (pt.remaining || 0); i++) {
      pt.visits.push({ has_order: false, is_future: true });
    }
  }

  // 31.08.2026: даты заказов вне маршрута (calc_point_stt.off_schedule_dates,
  // добавлено на бэкенде 31.08.2026) — раньше был только счётчик
  // (off_schedule_orders), теперь можно показать, В КАКОЙ день это было.
  pt.off_route_days = Array.isArray(pt.off_schedule_dates)
    ? pt.off_schedule_dates
    : (pt.off_schedule_dates ? Object.values(pt.off_schedule_dates) : []);

  if (!pt.hint) {
    const need75 = pt.need_75 !== undefined ? pt.need_75 : null;
    const remaining = pt.remaining !== undefined ? pt.remaining : null;
    if (pt.orders >= Math.ceil(pt.total_planned * 0.75)) {
      pt.hint = { type: 'achieved' };
    } else if (pt.need_75_possible === false) {
      pt.hint = { type: 'unreachable', need: need75, remaining: remaining };
    } else {
      pt.hint = { type: 'need', need: need75, remaining: remaining };
    }
  }

  if (pt.cat_stts) {
    pt.cats = Object.entries(pt.cat_stts).map(([name, pct]) => ({
      name,
      pct,
      misses: pct === null ? null : ((pt.cat_missed || {})[name] ?? 0)
    }));
  }

  return pt;
}

function renderVisits(pt) {
  const visits = pt.visits || [];
  const offRouteDays = pt.off_route_days || [];
  if (!visits.length && !offRouteDays.length) return '';

  // 31.08.2026 (переработано): раньше был просто ряд значков без дат и
  // отдельный текст "+N вне" — теперь один хронологический ряд (визит по
  // плану + заказ вне маршрута вперемешку, по датам), с днём недели под
  // каждой иконкой, тем же стилем, что и в "Анализ системности" у ТМ.
  const shortWd = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
  const now = new Date();
  function dayToWd(day) {
    return shortWd[new Date(now.getFullYear(), now.getMonth(), day).getDay()];
  }

  const past = visits.filter(v => !v.is_future && v.day != null);
  const future = visits.filter(v => v.is_future);

  const items = [
    ...past.map(v => ({ day: v.day, type: v.has_order ? 'ok' : 'miss' })),
    ...offRouteDays.map(day => ({ day, type: 'off' })),
  ].sort((a, b) => a.day - b.day);

  const STYLE = {
    ok:   { bg: '#639922', icon: '✓' },
    miss: { bg: '#E24B4A', icon: '✗' },
    off:  { bg: '#378ADD', icon: '📍' },
  };

  let html = '<div class="visits-cells">';
  html += items.map(it => {
    const s = STYLE[it.type];
    return `<div class="v-cell"><div class="v-cell-icon" style="background:${s.bg}">${s.icon}</div><span class="v-cell-day">${dayToWd(it.day)}</span></div>`;
  }).join('');
  if (future.length) {
    html += `<div class="v-cell"><div class="v-cell-icon v-cell-future">${'·'.repeat(Math.min(future.length,3))}</div><span class="v-cell-day">ост.</span></div>`;
  }
  return html + '</div>';
}

function renderHint(pt) {
  if (!pt.hint) return '';
  const h = pt.hint;
  if (h.type === 'achieved')    return `<div class="hint hint-done">✅ 75% достигнуто</div>`;
  if (h.type === 'unreachable') return `<div class="hint hint-unreachable">🚫 75% недостижимо — нужно ${h.need !== null ? h.need : '?'}, осталось ${h.remaining !== null ? h.remaining : '?'}</div>`;
  return `<div class="hint hint-need">🎯 нужно ${h.need !== null ? h.need : '?'} из ${h.remaining !== null ? h.remaining : '?'} для 75%</div>`;
}

function renderCats(cats) {
  if (!cats?.length) return '';
  return '<div class="cats">' + cats.map(c => {
    if (c.pct === null || c.pct === undefined) {
      return `<div class="cat">
        <div class="cat-name">${c.name}</div>
        <div class="cat-pct" style="color:var(--muted)">—</div>
      </div>`;
    }
    const lv = levelOf(c.pct);
    const bad = c.misses > 0;
    return `<div class="cat">
      <div class="cat-name">${c.name}</div>
      <div class="cat-pct c-${lv}">${c.pct}%</div>
      <div class="cat-miss${bad?' bad':''}">${missLabel(c.misses)}</div>
    </div>`;
  }).join('') + '</div>';
}

function calcMissedStreak(visits) {
  // Считаем пропуски подряд с конца прошедших визитов
  const past = (visits || []).filter(v => !v.is_future);
  let streak = 0;
  for (let i = past.length - 1; i >= 0; i--) {
    if (!past[i].has_order) streak++;
    else break;
  }
  return streak;
}

function bucketOf(pt) {
  const totalWorked = (pt.orders || 0) + (pt.off_schedule_orders || 0);
  if (totalWorked === 0) return 'red';
  return pt.stt >= 75 ? 'green' : 'yellow';
}

function renderCard(pt) {
  const lv = bucketOf(pt);
  const offRoute = pt.off_schedule_orders || 0;
  const badgeLabel = lv === 'red' ? 'Не АКБ' : lv === 'yellow' ? 'АКБ' : 'СТТ';
  const sttBlock = lv === 'red'
    ? `<div class="card-stt" style="font-size:14px">Не АКБ</div>`
    : `<div class="card-stt">${pt.stt}%</div><div class="card-stt-label">${badgeLabel}</div>`;
  return `<div class="card level-${lv}">
    <div class="card-top">
      <div>
        ${pt.client ? `<div class="card-client">${pt.client}</div>` : ''}
        <div class="card-addr">${pt.address}</div>
      </div>
      <div class="card-stt-wrap">${sttBlock}</div>
    </div>
    <div class="card-meta">прошло ${pt.visits_done} из ${pt.visits_total} · ${missLabel(pt.misses)}</div>
    ${renderVisits(pt)}
    ${renderHint(pt)}
    ${renderCats(pt.cats)}
  </div>`;
}

function buildRouteScreen(data) {
  const grouped = { red:[], yellow:[], green:[] };
  for (const pt of (data.points||[])) {
    normalizePoint(pt);
    grouped[bucketOf(pt)].push(pt);
  }

  // Сортируем: фокусные точки (2+ пропуска или вне) наверх
  function sortWithFocus(pts) {
    return [...pts].sort((a, b) => {
      const aFocus = calcMissedStreak(a.visits) >= 2 || (a.off_schedule_orders||0) > 0;
      const bFocus = calcMissedStreak(b.visits) >= 2 || (b.off_schedule_orders||0) > 0;
      return (bFocus ? 1 : 0) - (aFocus ? 1 : 0);
    });
  }

  // Считаем общее кол-во фокусных точек
  const allPoints = [...grouped.red, ...grouped.yellow, ...grouped.green];
  const focusCount = allPoints.filter(p =>
    calcMissedStreak(p.visits) >= 2 || (p.off_schedule_orders||0) > 0
  ).length;

  let tab = grouped.red.length ? 'red' : grouped.yellow.length ? 'yellow' : 'green';
  const agentName = data.agent || data.agent_name || '';

  // Строим блок фокуса СВ
  // Use cross-month focus points from /day endpoint
  const focusPoints = _dayFocusPoints.length > 0 ? _dayFocusPoints : allPoints.filter(p =>
    calcMissedStreak(p.visits) >= 2 || (p.off_schedule_orders||0) > 0
  );

  function getFocusReason(p) {
    if (p.missed_streak >= 3) return '3+ пропуска подряд';
    if (p.missed_streak >= 2) return '2 пропуска подряд';
    if (p.off_route > 0) return 'вне маршрута';
    const streak = calcMissedStreak(p.visits || []);
    if (streak >= 3) return '3+ пропуска подряд';
    if (streak >= 2) return '2 пропуска подряд';
    return 'вне маршрута';
  }

  const focusBlockHtml = focusPoints.length > 0 ? `
    <div class="focus-block">
      <details class="focus-details">
        <summary>
          <div class="focus-sum-left">
            <span style="font-size:16px">⚠️</span>
            <span class="focus-title">Фокус СВ</span>
            <span class="focus-count">${focusPoints.length} точек</span>
          </div>
          <span class="focus-chevron">▶</span>
        </summary>
        <div class="focus-points">
          ${focusPoints.map(p => `
            <div class="focus-point">
              <div>
                ${p.client ? `<div class="focus-point-name">${p.client}</div><div class="focus-point-client">${p.name || p.address || ''}</div>` : `<div class="focus-point-name">${p.name || p.address || ''}</div>`}
                <div class="focus-point-reason">${getFocusReason(p)}</div>
              </div>
            </div>`).join('')}
        </div>
      </details>
    </div>` : '';

  function render() {
    document.getElementById('screen-route').innerHTML = `
      <div class="header">
        <div class="header-top">
          <div class="header-name">${agentName}</div>
          <div class="header-date">${formatDate()}</div>
        </div>
        <div class="tabs" id="tabs">
          <button class="tab ${tab==='red'?'active-red':''}" data-t="red">Не АКБ<span class="badge">${grouped.red.length}</span></button>
          <button class="tab ${tab==='yellow'?'active-yellow':''}" data-t="yellow">АКБ<span class="badge">${grouped.yellow.length}</span></button>
          <button class="tab ${tab==='green'?'active-green':''}" data-t="green">СТТ<span class="badge">${grouped.green.length}</span></button>
        </div>
      </div>

      ${focusBlockHtml}
      <div id="tab-content">
        ${grouped[tab].length
          ? `<div class="cards">${grouped[tab].map(renderCard).join('')}</div>`
          : `<div class="empty">Точки отсутствуют</div>`}
      </div>`;

    document.getElementById('tabs').addEventListener('click', e => {
      const btn = e.target.closest('[data-t]');
      if (!btn) return;
      tab = btn.dataset.t;
      render();
    });
  }
  render();
}

// 31.08.2026: "Анализ системности по точкам" — та же карточка (СТТ/АКБ/
// Не АКБ вкладки + хронология визитов по датам), что уже есть у ТМ на
// "Маршрут" (tm-app.html), для собственного "Итоги месяца" агента.
// point_cards приходит готовым из архива (agent_stt, архивная ветка,
// только для "Прошлый месяц") — здесь только рендер, ничего не считаем.
function _pointAnalysisHtml(pointCards, monthNum, yearNum) {
  if (!pointCards.length) return '';

  const byLevel = { red: [], amber: [], green: [], ghost: [] };
  pointCards.forEach(p => { (byLevel[p.l] || byLevel.red).push(p); });
  const levelMeta = {
    red:   { label: 'Не АКБ',  border: '#8B1A1A', bg: '#FCEBEB', tabBg: '#F7C1C1', text: '#791F1F' },
    amber: { label: 'АКБ',     border: '#8B6914', bg: '#FAEEDA', tabBg: '#FAC775', text: '#633806' },
    green: { label: 'СТТ',     border: '#2D5A1B', bg: '#EAF3DE', tabBg: '#C0DD97', text: '#27500A' },
    // 01.09.2026: "Призрак" — точки, которых нет в плане агента вообще,
    // но заказы по ним реально были (см. calc_all_agents_month_summary,
    // ghost_orders). Раньше эти заказы были видны только числом в общем
    // "вне" на карточке "Система", саму точку нигде не было видно.
    ghost: { label: '👻 Призрак', border: '#5B4B8A', bg: '#EDE9F7', tabBg: '#C9BEEB', text: '#3D2E66' },
  };
  const TYPE_NAME = ['ok', 'miss', 'off'];
  const ICON = { ok: '✓', miss: '✗', off: '📍' };
  const COLOR = { ok: '#22C55E', miss: '#EF4444', off: '#378ADD' };
  const shortWd = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  function dayToWd(day) {
    if (!monthNum || !yearNum) return '';
    return shortWd[new Date(yearNum, monthNum - 1, day).getDay()];
  }

  function cardHtml(p, lvl) {
    const m = levelMeta[lvl];
    const cells = (p.i || []).map(([day, code]) => {
      const type = TYPE_NAME[code] || 'miss';
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;width:30px;">
        <div style="width:24px;height:24px;border-radius:6px;background:${COLOR[type]};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;">${ICON[type]}</div>
        <span style="font-size:9px;color:var(--muted);">${dayToWd(day)}</span>
      </div>`;
    }).join('');
    // 01.09.2026: у "призрака" нет планового графика — s это КОЛИЧЕСТВО
    // заказов, не %, показываем иначе (без значка процента).
    const badge = lvl === 'ghost' ? `${p.s} ${p.s === 1 ? 'заказ' : 'заказов'}` : `${p.s}%`;
    return `<details open style="border-left:3px solid ${m.border};border-radius:0 10px 10px 0;background:var(--bg);">
      <summary style="cursor:pointer;list-style:none;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <div style="font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.n}</div>
        <div style="display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:${m.text};flex-shrink:0;">${badge}<span style="font-size:13px;color:var(--muted);">▶</span></div>
      </summary>
      <div style="padding:0 12px 12px;">
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px;">${p.a}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">${cells}</div>
      </div>
    </details>`;
  }

  const tabsHtml = ['red', 'amber', 'green', 'ghost'].map((lvl, i) => {
    const m = levelMeta[lvl];
    return `<button data-pa-level="${lvl}" data-active="${i===0}" style="flex:1;border:none;font-family:inherit;font-size:12px;font-weight:700;padding:8px 0;border-radius:8px;cursor:pointer;background:${i===0?m.tabBg:m.bg};color:${m.text};" onclick="_switchPointAnalysisTab(this)">${m.label} (${byLevel[lvl].length})</button>`;
  }).join('');

  const listsHtml = ['red', 'amber', 'green', 'ghost'].map((lvl, i) => `
    <div data-pa-list="${lvl}" style="${i===0?'':'display:none'};display:flex;flex-direction:column;gap:8px;">
      ${byLevel[lvl].length ? byLevel[lvl].map(p => cardHtml(p, lvl)).join('') : '<div style="font-size:12px;color:var(--muted);padding:8px 0;">Точек этого уровня нет</div>'}
    </div>`).join('');

  // 01.09.2026: сумма по ВСЕМ точкам агента (все 3 уровня разом, не
  // зависит от выбранной вкладки) — сколько раз за месяц было
  // "заказ есть"/"заказа нет"/"вне маршрута" по всему списку точек.
  // ВАЖНО: point_cards строится через calc_point_stt, которая проходит
  // ТОЛЬКО по точкам, которые есть в плане агента — если заказ был на
  // точке, которой в плане вообще нет, она сюда не попадёт. Поэтому
  // totals.off здесь МЕНЬШЕ, чем "вне" в карточке "Система" выше (та
  // цифра честная, включает и полностью неучтённые точки — см. память
  // проекта, отдельная нерешённая задача на будущее).
  const totals = { ok: 0, miss: 0, off: 0 };
  pointCards.forEach(p => (p.i || []).forEach(([, code]) => {
    const type = TYPE_NAME[code] || 'miss';
    totals[type]++;
  }));

  const legendRow = (bg, icon, label, count) => `<div style="display:flex;align-items:center;gap:6px;">
    <span style="width:20px;height:20px;border-radius:6px;background:${bg};color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;">${icon}</span>
    <span style="display:flex;flex-direction:column;">
      <span style="font-size:10.5px;color:var(--muted);line-height:1.3;">${label}</span>
      <span style="font-size:11px;color:var(--text);line-height:1.3;">${count}</span>
    </span>
  </div>`;

  return `<div class="stt-card c-teal">
    <details>
      <summary style="cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;">
        <span class="stt-card-head" style="margin:0"><span>🔍</span><span class="stt-card-title">Анализ системности по точкам</span></span>
        <span style="display:flex;align-items:center;gap:8px;">
          <span style="text-align:right;">
            <span style="display:block;font-size:20px;font-weight:700;color:#0F6E56;line-height:1;">${pointCards.length}</span>
            <span style="display:block;font-size:9px;color:var(--muted);margin-top:2px;">точек</span>
          </span>
          <span style="font-size:13px;color:var(--muted);">▶</span>
        </span>
      </summary>
      <div style="border:0.5px solid var(--border);border-radius:10px;padding:10px 12px;margin:12px 0;">
        <div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;">Обозначения</div>
        <div style="display:flex;gap:18px;flex-wrap:wrap;">
          ${legendRow('#22C55E', '✓', 'заказ есть', totals.ok)}
          ${legendRow('#EF4444', '✗', 'заказа нет', totals.miss)}
          ${legendRow('#378ADD', '📍', 'вне маршрута', totals.off)}
        </div>
      </div>
      <div style="display:flex;gap:3px;background:var(--bg);border-radius:11px;padding:3px;margin-bottom:12px;">${tabsHtml}</div>
      ${listsHtml}
    </details>
  </div>`;
}

function _switchPointAnalysisTab(btn) {
  const level = btn.dataset.paLevel;
  const parent = btn.parentElement;
  parent.querySelectorAll('button').forEach(b => {
    const lvl = b.dataset.paLevel;
    const colors = { red: ['#FCEBEB','#791F1F'], amber: ['#FAEEDA','#633806'], green: ['#EAF3DE','#27500A'], ghost: ['#EDE9F7','#3D2E66'] };
    const tabColors = { red: ['#F7C1C1','#791F1F'], amber: ['#FAC775','#633806'], green: ['#C0DD97','#27500A'], ghost: ['#C9BEEB','#3D2E66'] };
    const isActive = b === btn;
    const [bg, text] = isActive ? tabColors[lvl] : colors[lvl];
    b.style.background = bg;
    b.style.color = text;
  });
  parent.parentElement.querySelectorAll('[data-pa-list]').forEach(el => {
    el.style.display = el.dataset.paList === level ? 'flex' : 'none';
  });
}

function _dayChipsHtml() {
  const dow = ['вс','пн','вт','ср','чт','пт','сб'];
  const today = new Date();
  const periods = [
    { key: 'today',     label: 'Сегодня',      date: today },
    { key: 'yesterday', label: 'Прошлый день', date: (() => { const d = new Date(); d.setDate(d.getDate()-1); return d; })() },
    { key: 'weekago',   label: 'Неделя назад', date: (() => { const d = new Date(); d.setDate(d.getDate()-7); return d; })() },
  ];
  const active = periods.find(p =>
    p.date.getFullYear() === _dayDate.getFullYear() &&
    p.date.getMonth()    === _dayDate.getMonth()    &&
    p.date.getDate()     === _dayDate.getDate()
  );
  const activeKey = active ? active.key : null;

  return `<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;">${_fmtDayLabel(_dayDate)}</div>
    <div style="display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);">
      ${periods.map(p => `<div style="flex:1;text-align:center;padding:8px 4px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;${p.key===activeKey?'background:var(--text);color:#fff;':'color:var(--muted);'}" onclick="jumpToDay('${_localDateStr(p.date)}')">${p.label}</div>`).join('')}
    </div>`;
}

function buildDayScreen(data) {
  if (!data || !data.my) {
    document.getElementById('screen-day').innerHTML = '<div class="empty">Данные итога дня недоступны</div>';
    return;
  }

  const my = data.my;
  const focusPts = data.focus_points || [];
  const team = data.team || [];
  const myCatShares = data.cat_shares_today || {};
  const myTotalOrdersToday = data.total_orders_today || 0;

  const tileStyle = 'background:var(--bg);border-radius:10px;padding:10px 12px;';
  const myHtml = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div style="${tileStyle}"><div style="font-size:20px;font-weight:700">${my.planned}</div><div style="font-size:10px;color:var(--muted);margin-top:2px">плановых</div></div>
      <div style="${tileStyle}"><div style="font-size:20px;font-weight:700">${my.orders} <span style="font-size:13px;color:var(--red);font-weight:700">−${my.off} вне</span></div><div style="font-size:10px;color:var(--muted);margin-top:2px">заказов</div></div>
      <div style="${tileStyle}"><div style="font-size:20px;font-weight:700;color:${colorOf(levelOf(my.sys_stt))}">${my.sys_stt}%</div><div style="font-size:10px;color:var(--muted);margin-top:2px">системная</div></div>
      <div style="${tileStyle}"><div style="font-size:20px;font-weight:700;color:${colorOf(levelOf(my.clean_stt))}">${my.clean_stt}%</div><div style="font-size:10px;color:var(--muted);margin-top:2px">чистая</div></div>
    </div>`;

  const myCatEntries = Object.entries(myCatShares);
  const catsHtml = myCatEntries.length
    ? `<div style="display:flex;flex-wrap:wrap;gap:6px;">${myCatEntries.map(([name, v]) => `
        <div style="flex:1 1 30%;min-width:90px;${tileStyle}text-align:center;">
          <div style="font-size:10px;color:var(--muted);">${name}</div>
          <div style="font-size:16px;font-weight:700;">${v.pct}%</div>
        </div>`).join('')}</div>`
    : '<div style="font-size:12px;color:var(--muted);">Категории не заданы</div>';

  const focusDoneCount = focusPts.filter(p => p.had_order).length;
  const focusHtml = focusPts.length > 0
    ? focusPts.map((p, i) => {
        const res = p.had_order
          ? '<span style="color:#2D5A1B;font-weight:700;font-size:15px;flex-shrink:0">✓</span>'
          : '<span style="color:#8B1A1A;font-weight:700;font-size:15px;flex-shrink:0">✕</span>';
        const border = i < focusPts.length - 1 ? 'border-bottom:1px solid #f0d090;' : '';
        const ptLabel = p.client
          ? `<div style="font-size:12px;font-weight:700;line-height:1.3">${p.client}</div><div style="font-size:10px;color:#8B6914;margin-top:1px">${p.name || ''}</div>`
          : `<div style="font-size:12px;font-weight:600;line-height:1.3">${p.name || ''}</div>`;
        return `<div style="display:flex;align-items:flex-start;justify-content:space-between;padding:8px 0;${border}gap:8px">
          <div>${ptLabel}</div>${res}</div>`;
      }).join('')
    : '<div style="font-size:13px;color:#8B6914;padding:8px 0">Нет точек контроля от СВ</div>';

  function _fmtPct1(v) {
    return v.toFixed(1).replace('.', ',');
  }

  function dayCell(val, isTotal) {
    const lv = levelOf80(val);
    if (isTotal) {
      return `<div style="flex:1;background:${colorOf(lv)};border-radius:6px;padding:5px 2px;text-align:center;margin:0 2px;border:2px solid ${colorOf(lv)};">
        <span style="font-size:13px;font-weight:800;color:#fff;">${_fmtPct1(val)}%</span>
      </div>`;
    }
    return `<div style="flex:1;background:${bgOf(lv)};border-radius:6px;padding:5px 2px;text-align:center;margin:0 2px;">
      <span style="font-size:12px;font-weight:500;color:${colorOf(lv)};">${val}%</span>
    </div>`;
  }

  // 01.08.2026: подписи колонок (Сист/Чист/категории/Итог) выводятся ОДИН
  // РАЗ сверху, не под каждым числом у каждого агента — при 5-7 торговых
  // подряд повторение убивает читаемость. Строка визитов/заказов/вне
  // рядом с именем убрана полностью по просьбе.
  const teamCatNames = team.length ? Object.keys(team[0].cat_shares || {}) : [];

      <div style="flex:1;text-align:center;font-size:10px;font-weight:700;color:#3730A3;text-transform:uppercase;">Сист</div>
      <div style="flex:1;text-align:center;font-size:10px;font-weight:700;color:#3730A3;text-transform:uppercase;">Чист</div>
      ${teamCatNames.map(n => `<div style="flex:1;text-align:center;font-size:10px;font-weight:700;color:#3730A3;text-transform:uppercase;">${n}</div>`).join('')}
      <div style="flex:1;text-align:center;font-size:10px;font-weight:800;color:#3730A3;text-transform:uppercase;">Итог</div>
    </div>` : '';

  const teamHtml = team.map((a, i) => {
    const short = a.name.split(' ').slice(0,2).join(' ');
    const catCells = teamCatNames.map(n => dayCell((a.cat_shares || {})[n]?.pct ?? 0)).join('');
    const meStyle = a.is_me
      ? 'background:#fff;border:2px solid #6366F1;border-radius:10px;padding:7px 6px;margin:2px 0;'
      : `padding:7px 0;${i < team.length - 1 ? 'border-bottom:1px solid #C7D2FE;' : ''}`;
    return `<div style="${meStyle}">
      <div style="font-size:12.5px;font-weight:700;color:#1e1b4b;margin-bottom:5px;">
        <span style="color:#6366F1;margin-right:4px;">${i+1}.</span>${short}${a.is_me ? ' <span style="color:#6366F1;">(вы)</span>' : ''}
      </div>
      <div style="display:flex;">
        ${dayCell(a.sys_stt)}${dayCell(a.clean_stt)}${catCells}${dayCell(a.average, true)}
      </div>
    </div>`;
  }).join('') || '<div style="font-size:13px;color:var(--muted);padding:8px 0">Нет данных по команде</div>';

  const cardStyle = 'background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);';

  document.getElementById('screen-day').innerHTML = `
    <div class="header">
      <div class="header-top">
        <div class="header-name">Итоги дня</div>
        <div class="header-date">${formatDate()}</div>
      </div>
    </div>
    <div style="padding:12px 16px 0">
      ${_dayChipsHtml()}
    </div>
    <div style="padding:0 16px 80px">
      <div style="${cardStyle}border-left:3px solid var(--green)">
        <span style="font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:block;">Мой итог</span>
        ${myHtml}
      </div>

      <div style="${cardStyle}border-left:3px solid #7c4fbf">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
          <span>🏷️</span>
          <span style="font-size:11px;font-weight:700;color:#7c4fbf;text-transform:uppercase;letter-spacing:.06em;">Категории</span>
        </div>
        <div style="font-size:10.5px;color:var(--muted);margin-bottom:10px;">доля заказов с категорией от всех заказов сегодня (${myTotalOrdersToday})</div>
        ${catsHtml}
      </div>

      <div style="background:#fff3cd;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #f59e0b;">
        <details>
          <summary style="list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;margin-bottom:0">
            <span style="font-size:13px;font-weight:700;color:#7c4f00">⚠️ Точки фокуса СВ · ${focusDoneCount}/${focusPts.length}</span>
            <span style="font-size:10px;color:#7c4f00">▶</span>
          </summary>
          <div style="padding-top:8px">${focusHtml}</div>
        </details>
      </div>

      <div style="background:#EEF2FF;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #C7D2FE;">
        <details>
          <summary style="list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;margin-bottom:0">
            <span style="font-size:13px;font-weight:700;color:#3730A3">👥 Команда сегодня</span>

          </summary>
          <div style="padding-top:8px">${teamHeaderHtml}${teamHtml}</div>
        </details>
      </div>
    </div>`;
}


function activateScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-screen="${name}"]`).classList.add('active');
}

let _dayFocusPoints = [];
let _dayDate = new Date();   // текущая просматриваемая дата на "Итоги дня" (агент)

function _localDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function _fmtDayLabel(d) {
  const days = ['вс','пн','вт','ср','чт','пт','сб'];
  return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')} · ${days[d.getDay()]}`;
}

// 01.08.2026: тот же чип-переключатель на 7 дней, что уже сделан у СВ.
async function jumpToDay(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const next = new Date(y, m - 1, d);
  if (next > new Date()) return;
  _dayDate = next;
  const el = document.getElementById('screen-day');
  el.innerHTML = '<div class="loader"><div class="spinner"></div><span>Загрузка...</span></div>';
  try {
    const r = await fetch(`${API}/api/agent/${_telegramId}/day?d=${dateStr}`);
    if (!r.ok) throw new Error('bad response');
    buildDayScreen(await r.json());
  } catch (e) {
    el.innerHTML = '<div class="empty">⚠️ Ошибка загрузки итога дня</div>';
  }
}
let _telegramId = null;
let _sttMonthOffset = 0;
let _sttOpenCat = null;
let _lastSttData = null;

function fetchAndBuildStt(offset) {
  _sttMonthOffset = offset;
  if (!_telegramId) {
    buildSttScreen(DEMO.stt);
    return;
  }
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth() - offset, 1);
  fetch(`${API}/api/agent/${_telegramId}/stt?month=${d.getMonth()+1}&year=${d.getFullYear()}`)
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(buildSttScreen)
    .catch(() => apiErr('screen-stt', 'Ошибка загрузки Итогов месяца'));
}

function apiErr(sid, msg) {
  document.getElementById(sid).innerHTML = `<div class="loader"><div style="font-size:28px">⚠️</div><div>${msg}</div></div>`;
}
