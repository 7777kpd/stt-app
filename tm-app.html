<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СТТ — Территориальный менеджер</title>
<style>
  /* 13.08.2026: -webkit-details-marker скрывает нативную стрелку только
     в Safari/Chrome-семействе — стандартный ::marker (др. движки/версии)
     отдельно, иначе у вложенных <details> вылезает вторая стрелка поверх
     нашего собственного rc-chevron/span-индикатора. */
  summary::marker { display: none; content: ''; }
  summary::-webkit-details-marker { display: none; }
  :root {
    --bg: #F0EADC;
    --card: #FFFFFF;
    --ink: #2C2A26;
    --ink-soft: #8B8578;
    --line: #ECE6D8;
    --green: #3FAE6A;
    --green-bg: #E6F4EC;
    --yellow: #E2A335;
    --yellow-bg: #FBF1DF;
    --red: #DC5B4E;
    --red-bg: #FAE7E4;
    --red-dark: #A93B30;
    --amber: #D98A3D;
    --amber-bg: #F8EBDB;
    --blue: #3B7DDB;
    --blue-bg: #E7EFFB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  .phone {
    width: 100%; max-width: 480px; background: var(--bg);
    height: 100dvh; display: flex; flex-direction: column;
  }
  .topbar { padding: 22px 20px 14px; display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0; }
  .topbar h1 { font-size: 20px; font-weight: 700; margin: 0; }
  .top-pill { font-size: 13px; color: var(--ink-soft); background: var(--card); border-radius: 100px; padding: 6px 12px; font-weight: 600; }
  .content { padding: 4px 16px 24px; overflow-y: auto; flex: 1; }
  .tabbar { display: flex; background: var(--card); border-top: 1px solid var(--line); padding: 9px 4px 14px; flex-shrink: 0; }
  .tab { flex: 1; text-align: center; font-size: 10px; font-weight: 700; color: var(--ink-soft); background: none; border: none; font-family: inherit; cursor: pointer; padding: 6px 2px 0; }
  .tab.active { color: var(--ink); }
  .tab .icon { width: 26px; height: 26px; margin: 0 auto 4px; border-radius: 8px; background: var(--line); display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .tab.active .icon { background: #D9CFAE; }
  .loader { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 12px; color: var(--ink-soft); }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--amber); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 40px 16px; color: var(--ink-soft); font-size: 14px; }

  /* ============ ЭКРАН МАРШРУТ (ТМ) — ТОП-5 в фокусе ============ */
  .sub { font-size: 12px; color: var(--ink-soft); font-weight: 600; margin: -4px 0 14px; }

  details.route-card {
    background: var(--card); border-radius: 16px; margin-bottom: 10px; overflow: hidden;
    border: 1px solid var(--line);
  }
  details.route-card[open] {
    margin: 14px 0; box-shadow: 0 6px 18px rgba(60,50,20,.10);
  }
  details.route-card summary {
    list-style: none; cursor: pointer; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  details.route-card summary::-webkit-details-marker { display: none; }
  .rc-name { font-size: 14px; font-weight: 700; }
  .rc-sub { font-size: 11px; color: var(--ink-soft); font-weight: 600; margin-left: 4px; }
  .rc-right { display: flex; align-items: center; gap: 10px; }
  .rc-deficit { text-align: right; }
  .rc-deficit .num { font-size: 18px; font-weight: 800; color: var(--red-dark); line-height: 1.1; }
  .rc-deficit .lbl { font-size: 9px; color: var(--red-dark); opacity: .8; }
  .rc-chevron { font-size: 13px; color: var(--ink-soft); transition: transform .15s; }
  details[open] .rc-chevron { transform: rotate(90deg); }

  .rc-body { padding: 0 16px 16px; }
  .rc-tiles { display: flex; gap: 5px; margin-bottom: 14px; align-items: stretch; }
  .rc-tile { flex: 1; background: var(--bg); border-radius: 9px; padding: 7px 3px; text-align: center; min-width: 0; }
  .rc-tile .val { font-size: 13px; font-weight: 800; }
  .rc-tile .lbl { font-size: 8px; color: var(--ink-soft); font-weight: 600; margin-top: 3px; }
  .rc-tile .sub { font-size: 7px; color: var(--ink-soft); opacity: .75; margin: 1px 0 0; font-weight: 500; }
  .rc-off { align-self: center; font-size: 10px; font-weight: 800; color: var(--red-dark); white-space: nowrap; }

  .formula-toggle { cursor: pointer; background: var(--blue-bg); border-left: 3px solid var(--blue); border-radius: 10px; padding: 10px 12px; }
  .formula-head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--blue); }
  .formula-body { margin-top: 8px; display: none; }
  .formula-toggle.open .formula-body { display: block; }
  .frow { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(59,125,219,.12); font-size: 11px; }
  .frow:last-of-type { border-bottom: none; }
  .frow span:first-child { color: var(--blue); opacity: .8; }
  .frow span:last-child { font-weight: 700; color: var(--blue); }
  .frow.total { padding-top: 6px; border-top: 1px solid rgba(59,125,219,.25); margin-top: 4px; font-size: 12px; }
  .frow.total span:last-child { color: var(--red-dark); font-size: 14px; }

  .rest-toggle { text-align: center; padding: 12px 0; font-size: 12px; font-weight: 700; color: var(--ink-soft); cursor: pointer; }
  .rest-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .rest-row span:last-child { color: var(--ink-soft); font-weight: 600; }

  .week-load-block { margin-bottom: 4px; }
  .week-load-label { font-size: 10px; color: var(--ink-soft); font-weight: 600; margin-bottom: 8px; }
  .week-load-note { font-size: 9.5px; color: var(--ink-soft); opacity: 0.85; line-height: 1.4; margin: -4px 0 10px; }
  .pp-block { border-top: 0.5px solid var(--line); margin: 14px -18px 0; padding: 14px 18px 0; }
  .pp-title-row { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .pp-title-row::-webkit-details-marker { display: none; }
  .pp-title { font-size: 13px; font-weight: 700; color: var(--ink); }
  .pp-tabs { display: flex; background: var(--bg); border-radius: 11px; padding: 3px; margin-bottom: 12px; }
  .pp-tab { flex: 1; border: none; background: transparent; font-family: inherit; font-size: 12px; font-weight: 700; color: var(--ink-soft); padding: 8px 0; border-radius: 8px; cursor: pointer; }
  .pp-tab.active { background: var(--card); color: var(--ink); }
  .pp-legend { border: 0.5px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
  .pp-legend-title { font-size: 10px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 8px; }
  .pp-legend-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .pp-legend-item { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--ink-soft); }
  .pp-legend-icon { width: 20px; height: 20px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; }
  .pp-list { display: flex; flex-direction: column; gap: 8px; }
  .pp-empty { font-size: 12px; color: var(--ink-soft); padding: 8px 0; }
  .pp-card { border-left: 3px solid; border-radius: 0 10px 10px 0; background: var(--card); box-shadow: 0 2px 6px rgba(60,50,20,0.06); margin-bottom: 8px; }
  .pp-card summary { cursor: pointer; list-style: none; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pp-card summary::-webkit-details-marker { display: none; }
  .pp-card-name { font-size: 13px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pp-card-right { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; flex-shrink: 0; }
  .pp-card-body { padding: 0 12px 12px; }
  .pp-card-addr { font-size: 11px; color: var(--ink-soft); margin-bottom: 8px; }
  .pp-card-cells { display: flex; gap: 6px; flex-wrap: wrap; }
  .pp-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 30px; }
  .pp-cell-icon { width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
  .pp-cell-day { font-size: 9px; color: var(--ink-soft); }
  .week-load-bars { display: flex; justify-content: space-between; align-items: flex-end; gap: 4px; height: 56px; }
  .week-load-avg-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--blue); opacity: .7; }
  .week-load-avg-num { position: absolute; right: 0; top: -14px; font-size: 8px; font-weight: 800; color: var(--blue); background: var(--card); padding: 0 3px; border-radius: 4px; }
  .week-load-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; position: relative; z-index: 1; }
  .week-load-bar-wrap { flex: 1; display: flex; align-items: flex-end; width: 100%; }
  .week-load-bar { width: 100%; background: var(--ink-soft); opacity: .35; border-radius: 3px 3px 0 0; min-height: 2px; }
  .week-load-bar.off { background: var(--red); opacity: .7; }
  .week-load-zone { display: flex; justify-content: space-between; gap: 4px; padding: 5px 0; border-top: 1px solid var(--line); }
  .week-load-col-lbl { flex: 1; text-align: center; position: relative; min-width: 0; }
  .week-load-zone-tag { position: absolute; left: 2px; top: -6px; font-size: 6px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }
  .week-load-num { font-size: 10px; font-weight: 700; }
  .week-load-num-sys { font-size: 9px; font-weight: 700; color: var(--blue); }
  .week-load-num-sys.low { color: var(--red-dark); font-weight: 800; }
  .week-load-zone-days { border-top: none; padding-top: 2px; }
  .week-load-day { font-size: 9px; color: var(--ink-soft); font-weight: 600; }
  .week-load-legend { font-size: 8px; color: var(--ink-soft); text-align: center; margin-top: 8px; opacity: .8; }

  .history-toggle { cursor: pointer; background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
  .history-head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .history-body { margin-top: 10px; display: none; }
  .history-toggle.open .history-body { display: block; }
  .history-days { display: flex; gap: 6px; justify-content: space-between; }
  .history-day { text-align: center; }
  .history-day .dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; margin: 0 auto 4px; }
  .history-day .dot.done { background: var(--green-bg); color: var(--green); }
  .history-day .dot.miss { background: var(--red-bg); color: var(--red-dark); }
  .history-day .lbl { font-size: 9px; color: var(--ink-soft); font-weight: 600; }
  .history-summary { text-align: center; font-size: 11px; color: var(--ink-soft); font-weight: 600; margin-top: 10px; }

  /* ============ ЭКРАН ИТОГИ ДНЯ (ТМ) ============ */
  .period-switch { display: flex; gap: 6px; margin-bottom: 14px; }
  .period-btn { flex: 1; font-size: 11px; font-weight: 700; padding: 8px 4px; border-radius: 9px; border: none; background: var(--card); color: var(--ink-soft); cursor: pointer; font-family: inherit; }
  .period-btn.active { background: var(--ink); color: #fff; }

  .day-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  .day-card h3 { font-size: 12px; font-weight: 700; color: var(--ink-soft); margin: 0 0 10px; text-transform: uppercase; letter-spacing: .02em; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .month-pill { background: var(--card); border-radius: 100px; padding: 6px 14px; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .card-label { font-size: 11px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .02em; }
  .card-note { font-size: 11px; color: var(--ink-soft); margin: 4px 0 0; }
  .rating-toggle { display: flex; gap: 4px; margin: 14px 0 10px; }
  .rating-toggle button { flex: 1; font-size: 11.5px; font-weight: 700; padding: 9px 4px; border-radius: 9px; border: none; font-family: inherit; cursor: pointer; background: transparent; color: var(--ink-soft); }
  .rating-toggle button.active { background: var(--card); color: var(--ink); }
  .show-more-btn { display: block; width: 100%; font-size: 13px; font-weight: 700; padding: 12px; border-radius: 12px; border: 1px dashed var(--ink-soft); background: transparent; color: var(--ink-soft); cursor: pointer; font-family: inherit; margin-top: 4px; }
  .best-card { background: var(--green-bg); border-radius: 16px; padding: 16px; margin-bottom: 10px; }
  .best-label { font-size: 10px; font-weight: 700; color: var(--green); text-transform: uppercase; margin: 0 0 8px; }
  .best-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .best-name { font-size: 16px; font-weight: 800; }
  .best-pct { font-size: 22px; font-weight: 800; color: var(--green); }
  .rating-delta { font-size: 11px; font-weight: 700; }
  .rating-delta.up { color: var(--green); }
  .rating-delta.down { color: var(--red-dark); }
  .rating-delta.neutral { color: var(--ink-soft); font-weight: 600; }
  .best-sub { font-size: 12px; color: var(--ink-soft); margin: 0 0 8px; }
  .best-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .chip.good { background: var(--green-bg); color: var(--green); }
  .chip.bad { background: var(--yellow-bg); color: var(--amber); }
  .collapsible-card summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
  .collapsible-card > summary::-webkit-details-marker { display: none; }
  .collapsible-card > summary::after { content: '▶'; font-size: 11px; color: var(--ink-soft); }
  .collapsible-card[open] > summary::after { content: '▼'; }
  .collapsible-card summary h3 { margin: 0; }
  .day-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .day-tiles-row { display: flex; gap: 5px; align-items: center; margin-top: 10px; }
  .day-tiles-row .day-tile { flex: 1; }
  .day-off { align-self: center; font-size: 11px; font-weight: 800; color: var(--red-dark); white-space: nowrap; text-align: center; line-height: 1.3; }
  .day-tile { background: var(--bg); border-radius: 10px; padding: 10px; text-align: center; }
  .day-tile .val { font-size: 18px; font-weight: 800; }
  .day-tile .lbl { font-size: 10px; color: var(--ink-soft); font-weight: 600; margin-top: 3px; }

  .bar-row { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .bar-row:last-child { border-bottom: none; }
  .bar-row-label { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .bar-row-track-wrap { display: flex; align-items: center; gap: 8px; }
  .bar-row-track { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar-row-fill { height: 100%; border-radius: 4px; }
  .bar-row-count { font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
  .bar-row-pct { font-size: 13px; font-weight: 800; width: 38px; text-align: right; flex-shrink: 0; }

  details.agent-day-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; overflow: hidden; }
  details.agent-day-card summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  details.agent-day-card summary::-webkit-details-marker { display: none; }
  .adc-name { font-size: 13px; font-weight: 700; }
  .adc-sub { font-size: 10px; color: var(--ink-soft); font-weight: 600; margin-left: 4px; }
  .status-badge { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; font-size: 11px; font-weight: 800; flex-shrink: 0; }
  .status-badge.ok { background: var(--green-bg); color: var(--green); }
  .status-badge.bad { background: var(--red-bg); color: var(--red-dark); }
  .top5-summary-badges { display: flex; align-items: center; gap: 5px; margin-left: auto; }
  .top5-count { font-size: 12px; font-weight: 700; }
  .top5-count.ok { color: var(--green); }
  .top5-count.bad { color: var(--red-dark); }
  .focus-sv-ok { background: var(--green-bg); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--green); }
  .adc-body { padding: 0 14px 14px; }
  .adc-metrics { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .adc-metric { flex: 1 1 30%; background: var(--bg); border-radius: 9px; padding: 8px 4px; text-align: center; min-width: 0; }
  .adc-metric .val { font-size: 14px; font-weight: 800; }
  .adc-metric .delta { font-size: 9px; font-weight: 700; margin-top: 1px; }
  .adc-metric .lbl { font-size: 7px; color: var(--ink-soft); font-weight: 600; margin-top: 2px; line-height: 1.2; }
  .level-bar { height: 6px; border-radius: 3px; overflow: hidden; display: flex; margin-bottom: 4px; }
  .level-bar-labels { display: flex; justify-content: space-between; font-size: 9px; font-weight: 700; margin-bottom: 10px; }
  .point-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 12px; border-bottom: 1px solid var(--line); }
  .point-row:last-child { border-bottom: none; }
  .point-info { flex: 1; min-width: 0; }
  .point-client { color: var(--ink); font-weight: 600; }
  .point-addr { color: var(--ink-soft); font-size: 10px; margin-top: 1px; }
  .point-pct-wrap { flex-shrink: 0; text-align: right; }
  .point-pct { font-size: 13px; font-weight: 800; display: block; }
  .point-pct-lbl { font-size: 7px; color: var(--ink-soft); font-weight: 600; }
  .visit-dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; align-items: center; }
  .visit-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .visit-dot.yes { background: var(--green); }
  .visit-dot.no { background: var(--line); border: 1px solid var(--ink-soft); }
  .cat-chip { font-size: 8px; font-weight: 700; padding: 1px 5px; border-radius: 6px; }
  .cat-chip.good { background: var(--green-bg); color: var(--green); }
  .cat-chip.bad { background: var(--yellow-bg); color: var(--amber); }
  .cat-chip.none { background: var(--line); color: var(--ink-soft); }
  .cat-chip.avg { background: var(--blue-bg); color: var(--blue); font-weight: 800; }
  .sv-cats-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .lvl-tabs { display: flex; gap: 6px; margin: 4px 0 10px; }
  .lvl-tab { flex: 1; font-size: 10px; font-weight: 700; padding: 7px 4px; border-radius: 8px; border: none; background: var(--bg); color: var(--ink-soft); cursor: pointer; font-family: inherit; }
  .lvl-tab.active.lvl-tab-green { background: var(--green-bg); color: var(--green); }
  .lvl-tab.active.lvl-tab-yellow { background: var(--yellow-bg); color: var(--amber); }
  .lvl-tab.active.lvl-tab-red { background: var(--red-bg); color: var(--red-dark); }
  details.focus-sv-block { background: var(--red-bg); border-radius: 10px; padding: 0; margin-bottom: 10px; overflow: hidden; }
  details.focus-sv-block[open] { padding: 8px 10px; }
  .focus-sv-head { list-style: none; cursor: pointer; padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--red-dark); }
  details.focus-sv-block[open] .focus-sv-head { padding: 0 0 6px; }
  .focus-sv-head::-webkit-details-marker { display: none; }
  details.focus-sv-block[open] .rc-chevron { transform: rotate(90deg); }
  .focus-sv-block .point-row { border-bottom: 1px solid rgba(169,59,48,.12); }
  .check-yes { color: var(--green); font-weight: 800; }
  .check-no { color: var(--red-dark); font-weight: 800; }
  /* 15.10.2026: единый балл — части и формула */
  .sp-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 8px 0 6px; }
  .sp-loadline { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 10.5px; font-weight: 600; color: var(--ink-soft); background: rgba(240,234,220,.75); border-radius: 10px; padding: 7px 10px; margin: 0 0 6px; }
  .sp-loadline b { font-size: 13px; color: var(--ink); white-space: nowrap; }
  .sp-tile { background: rgba(240,234,220,.75); border-radius: 10px; padding: 7px 4px; text-align: center; }
  .sp-tile.off { opacity: .45; }
  .sp-v { font-size: 14px; font-weight: 800; }
  .sp-l { font-size: 9.5px; color: var(--ink-soft); font-weight: 600; margin-top: 2px; }
  .sp-formula { font-size: 11px; color: var(--ink-soft); margin: 2px 0 8px; line-height: 1.4; }
  .sp-formula b { color: var(--ink); }
  .sp-load { font-size: 11px; color: var(--ink-soft); font-weight: 600; margin-top: 3px; }
  .sp-load b { color: var(--ink); }
  .sp-note { font-size: 10.5px; color: var(--ink-soft); line-height: 1.4; margin-top: 8px; padding: 9px 10px; background: rgba(240,234,220,.75); border-radius: 10px; }
</style>
</head>
<body>
<div id="app">
  <div class="phone">
    <div class="topbar">
      <div style="display:flex;flex-direction:column;">
        <h1 id="topTitle" style="margin:0 0 6px;">Загрузка...</h1>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="width:22px;height:22px;border-radius:7px;background:var(--ink-soft);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0;">Т</div>
          <div style="font-size:12px;color:var(--ink-soft);">Территориальный менеджер <span id="tmName" style="font-weight:600;color:var(--ink);"></span></div>
        </div>
      </div>
      <div class="top-pill" id="topPill" style="display:none"></div>
    </div>
    <div class="content" id="mainContent">
      <div class="loader"><div class="spinner"></div><span>Загрузка данных...</span></div>
    </div>
    <div class="tabbar" id="tabbar">
      <button class="tab active" data-screen="route" onclick="switchScreen('route')"><span class="icon">🗺️</span>Маршрут</button>
      <button class="tab" data-screen="day" onclick="switchScreen('day')"><span class="icon">📋</span>Итоги дня</button>
      <button class="tab" data-screen="month" onclick="switchScreen('month')"><span class="icon">📊</span>Итоги месяца</button>
    </div>
  </div>
</div>

<script>
// 04.10.2026: ДВЕ ШКАЛЫ ЦВЕТА (как у СВ и агента):
//   категории и «Задачи СВ»: ≥90 зелёный · 80–89 жёлтый · <80 красный;
//   система (системная, чистая, СТТ точек): ≥75 · 50–74 · <50.
function catColor(v) { return v >= 90 ? 'var(--green)' : v >= 80 ? 'var(--yellow)' : 'var(--red)'; }
function sysColor(v) { return v >= 75 ? 'var(--green)' : v >= 50 ? 'var(--amber)' : 'var(--red-dark)'; }
// 15.10.2026: ЕДИНЫЙ БАЛЛ — одинаковый на всех дашбордах (СВ, ТМ, руководитель).
// Балл = среднее: Системная, Чистая, СТТ точек, Категории (одно число — среднее),
// Задачи СВ, Нагрузка визитов (строкой под плашками); у ТМ и выше ещё ТОП-5.
function scoreParts(p) {
  const f = v => (Math.round(v * 10) / 10).toFixed(1);
  const parts = [['Системная', p.sys, 0], ['Чистая', p.clean, 0], ['СТТ точек', p.stt, 0], ['Категории', p.cats, 1], ['Задачи СВ', p.tasks, 1]];
  if (p.top5In) parts.push(['ТОП-5 отстающих', p.top5, 0]);
  const used = parts.filter(x => x[1] != null).map(x => f(x[1]));
  // 16.10.2026: нагрузка — строкой под плашками и подписанным слагаемым в формуле
  // 16.10.2026: в балл нагрузка — не больше 120 (полная цифра — в строке)
  const lf = p.loadRaw != null ? p.loadRaw : p.load;
  if (p.load != null) used.push(`<span style="color:var(--blue)">нагрузка ${f(p.load)}${lf != null && lf > 120 ? ` (${Math.round(lf)}%, засчитываем до 120)` : ''}</span>`);
  const span = parts.length === 5 ? i => i < 3 ? 2 : 3 : () => 2;
  const tiles = parts.map(([l, v, c], i) => `<div class="sp-tile" style="grid-column:span ${span(i)}"><div class="sp-v" style="color:${v == null ? 'var(--ink-soft)' : (c ? catColor(v) : sysColor(v))}">${v == null ? '—' : f(v) + '%'}</div><div class="sp-l">${l}</div></div>`).join('');
  return `<div class="sp-grid">${tiles}</div>${p.load != null ? `<div class="sp-loadline"><span>Нагрузка визитов за месяц<small style="display:block;font-size:9.5px;opacity:.85">к типичному агенту компании</small></span><b>${p.loadRaw != null ? Math.round(p.loadRaw) : f(p.load)}%</b></div>` : ''}${used.length ? `<div class="sp-formula">Балл = (${used.join(' + ')}) ÷ ${used.length} = <b>${f(p.avg)}%</b></div>` : ''}`;
}
function loadLine(v) { return v == null ? '' : `<div class="sp-load">Нагрузка плановых визитов <b>${v}%</b> от среднего</div>`; }
const SCORE_NOTE = '';   // 16.10.2026: пояснение убрано — формула под плашками показывает, из чего балл


const API = new URLSearchParams(window.location.search).get('dev') === '1'
  ? 'https://develop-production-0a2d.up.railway.app'
  : 'https://worker-production-1dfb.up.railway.app';

function getTelegramId() {
  const p = new URLSearchParams(window.location.search);
  if (p.get('id')) return p.get('id');
  if (window.Telegram?.WebApp?.initDataUnsafe?.user?.id)
    return String(window.Telegram.WebApp.initDataUnsafe.user.id);
  return null;
}

function toggleFormula(el, ev) {
  ev.stopPropagation();
  el.classList.toggle('open');
}

let currentTelegramId = null;
const historyCache = {};

async function toggleHistory(cardId, agentName, ev) {
  ev.stopPropagation();
  const toggle = document.getElementById(`hist-${cardId}`);
  const body = document.getElementById(`hist-body-${cardId}`);
  const wasOpen = toggle.classList.contains('open');
  toggle.classList.toggle('open');
  if (wasOpen) return;

  if (historyCache[agentName]) {
    body.innerHTML = renderHistoryDots(historyCache[agentName]);
    return;
  }

  try {
    const res = await fetch(`${API}/api/tm/${currentTelegramId}/route-history?agent=${encodeURIComponent(agentName)}`);
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    historyCache[agentName] = data.history;
    body.innerHTML = renderHistoryDots(data.history);
  } catch (e) {
    body.innerHTML = '<div class="empty" style="padding:10px 0">Не удалось загрузить историю</div>';
  }
}

function renderHistoryDots(history) {
  const doneCount = history.filter(d => d.completed).length;
  const days = history.map(d => `
    <div class="history-day">
      <div class="dot ${d.completed ? 'done' : 'miss'}">${d.completed ? '✓' : '✗'}</div>
      <div class="lbl">${d.weekday.slice(0, 2)}</div>
    </div>`).join('');
  return `<div class="history-days">${days}</div>
    <div class="history-summary">${doneCount} из ${history.length} дней — задача выполнена</div>`;
}

function renderRouteCard(a, rank, monthLabel, monthNum, yearNum) {
  const cardId = rank;

  const weekEntries = Object.entries(a.weekly_load || {});
  const counts = weekEntries.map(([,v]) => v.avg_count);
  const maxLoad = Math.max(...counts, a.daily_avg || 0, 1);
  const avgLine = a.daily_avg || 0;
  const avgLinePct = Math.round(avgLine / maxLoad * 100);
  const weekShortMap = {'понедельник':'Пн','вторник':'Вт','среда':'Ср','четверг':'Чт','пятница':'Пт','суббота':'Сб','воскресенье':'Вс'};
  // Критерий подсветки столбика (11.08.2026, по просьбе): не порог ±30% от
  // среднего, а просто 2 САМЫХ НИЗКИХ дня по визитам — те, что реально
  // стоит перераспределить в первую очередь.
  const sortedCounts = [...counts].sort((x,y) => x-y);
  const lowThreshold = sortedCounts[1]; // 2-е по величине снизу = граница "двух худших"
  const weeklyLoadHtml = `<div class="week-load-block">
    <div class="week-load-label">План посещений по дням недели</div>
    <div class="week-load-note">
      Данные за: ${monthLabel || 'прошлый месяц'} — та же база, что и в
      расчёте дефицита выше. Не совпадает с планом на текущий месяц,
      если маршрут агента с тех пор менялся.
    </div>
    <div class="week-load-bars" style="position:relative">
      <div class="week-load-avg-line" style="bottom:${avgLinePct}%"><span class="week-load-avg-num">${avgLine}</span></div>
      ${weekEntries.map(([d, v]) => {
        const h = Math.round(v.avg_count/maxLoad*100);
        const off = v.avg_count <= lowThreshold;
        return `<div class="week-load-col">
          <div class="week-load-bar-wrap"><div class="week-load-bar ${off?'off':''}" style="height:${h}%"></div></div>
        </div>`;
      }).join('')}
    </div>
    <div class="week-load-zone week-load-zone-visits">
      ${weekEntries.map(([d, v], j) => `<div class="week-load-col-lbl">${j===0?'<span class=\"week-load-zone-tag\">визитов (ср)</span>':''}<span class="week-load-num">${v.avg_count}</span></div>`).join('')}
    </div>
    <div class="week-load-zone week-load-zone-system">
      ${weekEntries.map(([d, v], j) => {
        const pctTxt = v.system_pct != null ? v.system_pct + '%' : '—';
        // Критерий (11.08.2026, по просьбе): красным и жирным — система < 75%.
        const low = v.system_pct != null && v.system_pct < 75;
        return `<div class="week-load-col-lbl">${j===0?'<span class=\"week-load-zone-tag\">система</span>':''}<span class="week-load-num-sys ${low?'low':''}">${pctTxt}</span></div>`;
      }).join('')}
    </div>
    <div class="week-load-zone week-load-zone-days">
      ${weekEntries.map(([d]) => `<div class="week-load-col-lbl"><span class="week-load-day">${weekShortMap[d] || d.slice(0,2)}</span></div>`).join('')}
    </div>
  </div>`;

  // 31.08.2026: карточки "Точки прошлого месяца" — вкладки Не АКБ/АКБ/СТТ,
  // список точек каждого уровня, разворачивается по тапу в хронологию
  // визитов (заказ есть/нет/вне маршрута). Данные уже готовы в архиве
  // (calc_all_agents_month_summary), здесь только рендер — ничего не
  // считаем и не запрашиваем.
  const pointCards = a.point_cards || [];
  const byLevel = {red: [], amber: [], green: []};
  pointCards.forEach(p => { (byLevel[p.l] || byLevel.red).push(p); });
  const levelMeta = {
    red: {label: 'Не АКБ', border: '#E24B4A', bg: '#FCEBEB', text: '#A32D2D', tabBg: '#F7C1C1', tabText: '#791F1F'},
    amber: {label: 'АКБ', border: '#EF9F27', bg: '#FAEEDA', text: '#854F0B', tabBg: '#FAC775', tabText: '#633806'},
    green: {label: 'СТТ', border: '#639922', bg: '#EAF3DE', text: '#3B6D11', tabBg: '#C0DD97', tabText: '#27500A'},
  };
  const itemStyle = {
    ok: {bg: '#639922', fg: '#FFFFFF', icon: '✓'},
    miss: {bg: '#E24B4A', fg: '#FFFFFF', icon: '✗'},
    off: {bg: '#378ADD', fg: '#FFFFFF', icon: vgPin('#fff','13px')},
  };
  // 31.08.2026: формат в архиве сжат до [день_месяца, код_типа] (0=ok,
  // 1=miss, 2=off) — день недели здесь пересчитывается на лету из
  // month_num/year, а не хранится текстом в архиве (см. stt.py — лимит
  // Google Sheets в 50000 символов на ячейку, реальный сбой на RDB_Center).
  const TYPE_NAME = ['ok', 'miss', 'off'];
  const shortWd = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
  function dayToWd(day) {
    if (!monthNum || !yearNum) return '';
    return shortWd[new Date(yearNum, monthNum - 1, day).getDay()];
  }
  const ppTabsHtml = ['red', 'amber', 'green'].map((lvl, i) => {
    const m = levelMeta[lvl];
    return `<button class="pp-tab${i===0?' active':''}" data-pp-level="${lvl}" data-pp-card="${cardId}" data-bg-active="${m.tabBg}" data-bg-inactive="${m.bg}" data-text-active="${m.tabText}" data-text-inactive="${m.text}" style="background:${i===0?m.tabBg:m.bg};color:${i===0?m.tabText:m.text}" onclick="switchPointTab(this, event)">${m.label} (${byLevel[lvl].length})</button>`;
  }).join('');
  // 13.09.2026: 'i' теперь строка фиксированной длины (1 символ на
  // календарный день, '.'=нет данных), не список пар — см. _pack_items в
  // stt.py. Разворачиваем обратно в [день,код] для рендера.
  function expandItems(compact) {
    if (Array.isArray(compact)) return compact;
    if (!compact) return [];
    const out = [];
    for (let i = 0; i < compact.length; i++) {
      const ch = compact[i];
      if (ch !== '.') out.push([i + 1, Number(ch)]);
    }
    return out;
  }

  function pointCardHtml(p, lvl) {
    const m = levelMeta[lvl];
    const cells = expandItems(p.i).map(([day, code]) => {
      const type = TYPE_NAME[code] || 'miss';
      const s = itemStyle[type];
      return `<div class="pp-cell"><div class="pp-cell-icon" style="background:${s.bg};color:${s.fg}">${s.icon}</div><span class="pp-cell-day">${dayToWd(day)}</span></div>`;
    }).join('');
    return `<details class="pp-card" style="border-left-color:${m.border}">
      <summary>
        <div class="pp-card-name">${p.n}</div>
        <div class="pp-card-right"><span style="color:${m.text}">${p.s}%</span><span class="rc-chevron">▶</span></div>
      </summary>
      <div class="pp-card-body">
        <div class="pp-card-addr">${p.a}</div>
        <div class="pp-card-cells">${cells}</div>
      </div>
    </details>`;
  }
  const ppListsHtml = ['red', 'amber', 'green'].map((lvl, i) => `
    <div class="pp-list" data-pp-list="${cardId}" data-pp-list-level="${lvl}" style="${i===0?'':'display:none'}">
      ${byLevel[lvl].length ? byLevel[lvl].map(p => pointCardHtml(p, lvl)).join('') : '<div class="pp-empty">Точек этого уровня нет</div>'}
    </div>`).join('');
  const pointCardsBlockHtml = pointCards.length ? `<details class="pp-block">
    <summary class="pp-title-row">
      <span class="pp-title">Анализ системности по точкам</span>
      <span class="rc-chevron pp-title-chevron">▶</span>
    </summary>
    <div class="pp-legend">
      <div class="pp-legend-title">Обозначения</div>
      <div class="pp-legend-row">
        <span class="pp-legend-item"><span class="pp-legend-icon" style="background:#639922;color:#fff">✓</span>заказ есть</span>
        <span class="pp-legend-item"><span class="pp-legend-icon" style="background:#E24B4A;color:#fff">✗</span>заказа нет</span>
        <span class="pp-legend-item"><span class="pp-legend-icon" style="background:#378ADD;color:#fff">${vgPin('#fff','12px')}</span>вне маршрута</span>
      </div>
    </div>
    <div class="pp-tabs">${ppTabsHtml}</div>
    ${ppListsHtml}
  </details>` : '';

  return `<details class="route-card">
    <summary>
      <div><span class="rc-name">${rank} · ${a.agent}</span><span class="rc-sub">${a.sv || ''}</span></div>
      <div class="rc-right">
        <div class="rc-deficit"><div class="num">${a.deficit_orders}</div><div class="lbl">дефицит чистых заказов</div></div>
        <span class="rc-chevron">▶</span>
      </div>
    </summary>
    <div class="rc-body">
      <div class="formula-toggle" onclick="toggleFormula(this, event)">
        <div class="formula-head"><span>Как посчитали дефицит чистых заказов ${a.deficit_orders}?</span><span>▾</span></div>
        <div class="formula-body">
          <div class="frow"><span>План визитов (мес)</span><span>${a.plan}</span></div>
          <div class="frow"><span>Средний по команде</span><span>${a.team_average_plan}</span></div>
          <div class="frow"><span>Требуемый план чистых заказов = ${a.base}×75%</span><span>${a.need_orders}</span></div>
          <div class="frow"><span>Заказов по факту (системные)</span><span>${a.orders}</span></div>
          ${a.off_route != null ? `<div class="frow"><span>− вне маршрута и призраки</span><span>−${a.off_route}</span></div>
          <div class="frow"><span>Чистых заказов = ${a.orders} − ${a.off_route}</span><span>${Math.max(0, a.orders - a.off_route)}</span></div>` : ''}
          <div class="frow total"><span>Дефицит чистых = ${a.need_orders} − ${a.off_route != null ? Math.max(0, a.orders - a.off_route) : a.orders}</span><span>${a.deficit_orders}</span></div>
          <div class="frow" style="border-top:1px dashed rgba(59,111,160,.3);margin-top:4px;padding-top:8px"><span>Плановых визитов в день = ${a.base}÷раб.дни</span><span>${a.daily_avg}</span></div>
          <div class="frow"><span>Плановых чистых заказов в день = ${a.need_orders}÷раб.дни</span><span>${a.daily_orders_avg}</span></div>
        </div>
      </div>
      ${weeklyLoadHtml}
      ${pointCardsBlockHtml}
    </div>
  </details>`;
}

function switchPointTab(btn, event) {
  event.preventDefault();
  const cardId = btn.dataset.ppCard;
  const level = btn.dataset.ppLevel;
  btn.parentElement.querySelectorAll('.pp-tab').forEach(b => {
    b.classList.remove('active');
    b.style.background = b.dataset.bgInactive;
    b.style.color = b.dataset.textInactive;
  });
  btn.classList.add('active');
  btn.style.background = btn.dataset.bgActive;
  btn.style.color = btn.dataset.textActive;
  document.querySelectorAll(`[data-pp-list="${cardId}"]`).forEach(el => {
    el.style.display = el.dataset.ppListLevel === level ? '' : 'none';
  });
}

function renderRoute(data) {
  if (!data.archive_ready) {
    return `<div class="sub">ТОП-5 в фокусе · ${data.month}</div>
      <div class="empty">Итоги ${data.month} ещё не закрыты — ТОП-5 появится после закрытия месяца.</div>`;
  }

  const top5Html = data.top5.map((a, i) => renderRouteCard(a, i + 1, data.month, data.month_num, data.year)).join('');
  const restHtml = data.rest.length
    ? `<div class="rest-toggle" onclick="document.getElementById('restList').style.display = document.getElementById('restList').style.display === 'none' ? 'block' : 'none'">Остальные маршруты (${data.rest.length}) ▾</div>
       <div id="restList" style="display:none">
         ${data.rest.map(a => `<div class="rest-row"><span>${a.agent}</span><span>дефицит ${a.deficit_orders}</span></div>`).join('')}
       </div>`
    : '';

  return `<div class="sub">ТОП-5 в фокусе · ${data.month}</div>${top5Html}${restHtml}`;
}

let currentScreen = 'route';
let currentPeriod = 'today';
const dayCache = {};

function switchScreen(screen) {
  currentScreen = screen;
  if (screen === 'day') trackItogi(currentTelegramId);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.screen === screen));
  if (screen === 'route') {
    document.getElementById('topTitle').textContent = 'Маршрут';
    loadRoute();
  } else if (screen === 'day') {
    document.getElementById('topTitle').textContent = 'Итоги дня';
    loadDay(currentPeriod);
  } else {
    document.getElementById('topTitle').textContent = 'Итоги месяца';
    loadMonth(currentMonthPeriod);
  }
}

function switchLevelTab(btn) {
  const aid = btn.dataset.aid;
  const lvl = btn.dataset.lvl;
  document.querySelectorAll(`.lvl-tab[data-aid="${aid}"]`).forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll(`.lvl-panel[data-aid="${aid}"]`).forEach(p => {
    p.style.display = p.dataset.lvl === lvl ? 'block' : 'none';
  });
}

function levelClass(level) {
  if (level === '🟢') return 'green';
  if (level === '🟡') return 'yellow';
  return 'red';
}

function renderDay(data) {
  const periodSwitch = `<div class="period-switch">
    <button class="period-btn ${currentPeriod === 'today' ? 'active' : ''}" onclick="loadDay('today')">Сегодня</button>
    <button class="period-btn ${currentPeriod === 'prev' ? 'active' : ''}" onclick="loadDay('prev')">Вчера</button>
    <button class="period-btn ${currentPeriod === 'week' ? 'active' : ''}" onclick="loadDay('week')">Неделя назад</button>
  </div>`;

  // 13.08.2026: единый рендер бара "N из M · %" в стиле реального экрана
  // СВ ("Категории" на sv-app.html) — переиспользуется для всех трёх
  // блоков (Категории/ТОП-5 маршрутов/По супервайзерам), а не три разных
  // визуальных языка на одном экране.
  // 13.08.2026: единый значок выполнения — кружок ✓/✗ вместо эмодзи,
  // используется в сводке ТОП-5, у каждого агента и в Фокус СВ.
  function badge(ok) {
    return `<span class="status-badge ${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'}</span>`;
  }

  function barRow(label, done, total, pct) {
    const color = catColor(pct);   // 04.10.2026: полосы категорий — шкала 90/80
    return `<div class="bar-row">
      <div class="bar-row-label">${label}</div>
      <div class="bar-row-track-wrap">
        <div class="bar-row-track"><div class="bar-row-fill" style="width:${Math.min(pct,100)}%;background:${color}"></div></div>
        <span class="bar-row-count">${done} из ${total}</span>
        <span class="bar-row-pct" style="color:${color}">${pct}%</span>
      </div>
    </div>`;
  }

  function fmtPct(x) {
    return (Math.round(x * 10) / 10).toFixed(1).replace('.', ',') + '%';
  }

  const svsHtml = (data.svs || []).map(s => {
    const color = sysColor(s.system_pct);   // 04.10.2026: шкала системы 75/50
    const catsChips = (s.categories || []).slice().sort((x, y) => (y.pct ?? -1) - (x.pct ?? -1)).map(c => {   // 14.10.2026: по убыванию
      const cls = c.pct >= 90 ? 'good' : 'bad';   // 04.10.2026: шкала категорий
      return `<span class="cat-chip ${cls}">${c.name.slice(0,4)} ${fmtPct(c.pct)}</span>`;
    }).join('');
    // 24.08.2026 (по просьбе): большая цифра справа от полоски теперь —
    // общий показатель (s.avg, среднее системная+чистая+категории), а не
    // system_pct, с подписью "средний" под ней. Под полоской — отдельная
    // строка "Системная · Чистая" (её не было вообще). Все проценты — с
    // точностью до 1 знака, формат "73,5%".
    const avgBlock = s.avg != null
      ? `<div style="text-align:right"><span class="bar-row-pct" style="color:${color}">${fmtPct(s.avg)}</span><div style="font-size:10px;font-weight:700;color:var(--ink-soft);margin-top:1px;">средний</div></div>`
      : '';
    const sysCleanLine = `<div style="font-size:12px;font-weight:700;color:var(--ink-soft);margin:4px 0 2px;">Системная ${fmtPct(s.system_pct)} · Чистая ${fmtPct(s.clean_pct)}</div>`;
    return `<div class="bar-row">
      <div class="bar-row-label">${s.sv}</div>
      <div class="bar-row-track-wrap">
        <div class="bar-row-track"><div class="bar-row-fill" style="width:${Math.min(s.system_pct,100)}%;background:${color}"></div></div>
        ${avgBlock}
      </div>
      ${sysCleanLine}
      ${catsChips ? `<div class="sv-cats-row">${catsChips}</div>` : ''}
    </div>`;
  }).join('');
  const catsHtml = (data.categories || []).slice().sort((a,b) => b.pct - a.pct).map(c => barRow(c.name, c.orders, c.total, c.pct)).join('');

  const top5Html = data.top5_focus_ready
    ? (data.top5_today || [])
        // 24.08.2026 (по просьбе, п.5): агенты с ✓ (выполнили план заказов
        // сегодня) — наверх списка, ✗ — вниз.
        .slice()
        .sort((a, b) => {
          const okA = a.orders_today >= a.orders_target ? 1 : 0;
          const okB = b.orders_today >= b.orders_target ? 1 : 0;
          return okB - okA;
        })
        .map((a, agentIdx) => {
        // 13.08.2026: критерий "выполнил" — ЗАКАЗЫ сегодня относительно
        // нормы, даже если план визитов не выполнен (заказы важнее самих
        // визитов — это то, ради чего вообще всё считается).
        const ok = a.orders_today >= a.orders_target;

        // 24.08.2026 (по просьбе, п.8): внутри "Фокус СВ" — точки с ✓
        // (был заказ сегодня) наверх, точки с ✗ вниз, а среди ✗ — по
        // убыванию "пропусков подряд" (самые запущенные первыми).
        const focusList = (a.focus_sv || []).slice().sort((fa, fb) => {
          if (fa.had_order !== fb.had_order) return fa.had_order ? -1 : 1;
          return fb.missed_streak - fa.missed_streak;
        });
        const focusDone = focusList.filter(fp => fp.had_order).length;
        const focusSvHtml = focusList.length
          ? `<details class="focus-sv-block">
              <summary class="focus-sv-head">
                <span>👁 Фокус СВ · ${focusDone}/${focusList.length} сделано</span>
                <span class="rc-chevron">▶</span>
              </summary>
              ${focusList.map(fp => {
                // 24.08.2026 (по просьбе, п.6+7): точка могла попасть в
                // "Фокус СВ" НЕ из-за пропусков (missed_streak может быть
                // 0), а из-за заказа вне маршрута (off_route>0) — раньше
                // эта причина нигде не показывалась, отсюда и вопрос
                // "почему тут точка без пропусков". Показываем обе причины
                // явно, жирным, если они есть.
                const parts = [];
                if (fp.missed_streak > 0) parts.push(`<b>${fp.missed_streak} пропусков подряд</b>`);
                if (fp.off_route > 0) parts.push(`<b>${fp.off_route} вне маршрута</b>`);
                const reasonText = parts.length ? parts.join(' · ') : '0 пропусков подряд';
                return `
                <div class="point-row">
                  ${badge(fp.had_order)}
                  <div class="point-info">
                    <div class="point-client">${fp.name}</div>
                    <div class="point-addr">${fp.address} · ${reasonText}</div>
                  </div>
                </div>`;
              }).join('')}
            </details>`
          : `<div class="focus-sv-ok">${badge(true)}<span>Фокус СВ · нет проблемных точек</span></div>`;

        function factorTile(actual, target, label) {
          const diff = actual - target;
          const sign = diff >= 0 ? '+' : '';
          const color = diff >= 0 ? 'var(--green)' : 'var(--red-dark)';
          return `<div class="adc-metric">
            <div style="display:flex;align-items:baseline;justify-content:center;gap:5px">
              <span class="val">${actual}/${target}</span>
              <span style="font-size:11px;font-weight:800;color:${color}">${sign}${diff}</span>
            </div>
            <div class="lbl">${label} · есть/нужно</div>
          </div>`;
        }

        // 15.09.2026 (по просьбе, п.3 — было слишком много инфо в одной
        // плитке): % — единственное крупное число, "N из M" — мелкая
        // подпись под ним, без второй строки текста и без рядом стоящей
        // разницы вперемешку с дробью.
        function ordersFactorTile(actual, target, pct) {
          const p = pct != null ? pct : (target ? Math.round(actual / target * 100) : 0);
          const color = p >= 100 ? 'var(--green)' : 'var(--red-dark)';
          return `<div class="adc-metric">
            <div style="font-size:20px;font-weight:700;color:${color};line-height:1.1">${p}%</div>
            <div class="lbl" style="margin-top:2px">заказы · ${actual} из ${target}</div>
          </div>`;
        }

        const ordersPct = a.orders_completion_pct != null
          ? a.orders_completion_pct
          : (a.orders_target ? Math.round(a.orders_today / a.orders_target * 100) : 0);
        const ordersPctColor = ordersPct >= 100 ? 'var(--green)' : 'var(--red-dark)';

        return `<details class="agent-day-card">
          <summary>
            ${badge(ok)}
            <div style="flex:1;min-width:0"><span class="adc-name">${a.agent}</span><span class="adc-sub">${a.sv || ''}</span></div>
            <span style="font-size:13px;font-weight:800;color:${ordersPctColor};margin-right:6px">${ordersPct}%</span>
            <span class="rc-chevron">▶</span>
          </summary>
          <div class="adc-body">
            <div class="adc-metrics">
              ${factorTile(a.visits_today, a.visits_target, 'визиты')}
              ${ordersFactorTile(a.orders_today, a.orders_target, a.orders_completion_pct)}
            </div>
            ${focusSvHtml}
          </div>
        </details>`;
      }).join('')
    : '<div class="empty" style="padding:12px 0">Итоги прошлого месяца ещё не закрыты — ТОП-5 недоступен</div>';

  const top5GreenCount = data.top5_focus_ready ? (data.top5_today || []).filter(a => a.orders_today >= a.orders_target).length : 0;
  const top5RedCount = data.top5_focus_ready ? (data.top5_today || []).length - top5GreenCount : 0;

  // 15.09.2026 (по просьбе): одна общая цифра над списком ТОП-5 — не
  // среднее процентов по агентам, а честная сумма "есть"/"нужно" по ВСЕМ
  // пятерым, потом уже % от сумм (тот же принцип агрегации, что и везде
  // в проекте — сначала сырые числа, потом процент от них).
  const top5SumOrders = (data.top5_today || []).reduce((s, a) => s + (a.orders_today || 0), 0);
  const top5SumTarget = (data.top5_today || []).reduce((s, a) => s + (a.orders_target || 0), 0);
  const top5SumPct = top5SumTarget ? Math.round(top5SumOrders / top5SumTarget * 100) : 0;
  const top5SumColor = top5SumPct >= 100 ? 'var(--green)' : 'var(--red-dark)';

  return `${periodSwitch}
    <div class="day-card">
      <h3>Итог по территории</h3>
      ${vgTiles({   // 19.10.2026: две строки по три; вне и призраки нажимаются — СВ → агенты → точки → карточка
        key: 'terr', planned: data.planned_visits, orders: data.clean_orders, sys: data.system_stt, clean: data.clean_stt,
        off: data.off_sched_orders != null ? data.off_sched_orders : data.off_route_orders, ghost: data.ghost_orders_day || 0,
        offHtml: vgTerrList(data.svs, 'off'), ghostHtml: vgTerrList(data.svs, 'ghost'),
      })}
    </div>
    <details class="day-card collapsible-card">
      <summary><h3 style="display:inline">Категории</h3></summary>
      <div style="margin-top:10px">${catsHtml || '<div class="empty">Нет данных</div>'}</div>
    </details>
    <details class="day-card collapsible-card">
      <summary><h3 style="display:inline">По супервайзерам</h3></summary>
      <div style="margin-top:10px">${svsHtml || '<div class="empty">Нет данных</div>'}</div>
    </details>
    <details class="day-card collapsible-card">
      <summary>
        <h3 style="display:inline">ТОП-5 сегодня</h3>
        <div class="top5-summary-badges">${badge(true)}<span class="top5-count ok">${top5GreenCount}</span>${badge(false)}<span class="top5-count bad">${top5RedCount}</span></div>
      </summary>
      ${data.top5_focus_ready ? `<div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:12px;padding:10px 14px;margin-top:10px">
        <div style="font-size:11px;color:var(--ink-soft)">заказы: ${top5SumOrders} из ${top5SumTarget} нужно</div>
        <div style="font-size:22px;font-weight:700;color:${top5SumColor}">${top5SumPct}%</div>
      </div>` : ''}
      <div style="margin-top:12px">${top5Html}</div>
    </details>`;
}

async function loadDay(period) {
  currentPeriod = period;
  document.querySelectorAll('.period-btn').forEach(b => {});
  if (dayCache[period]) {
    document.getElementById('mainContent').innerHTML = renderDay(dayCache[period]);
    return;
  }
  document.getElementById('mainContent').innerHTML = '<div class="loader"><div class="spinner"></div><span>Загрузка данных...</span></div>';
  try {
    const res = await fetch(`${API}/api/tm/${currentTelegramId}/day?period=${period}`);
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    setTmName(data.tm_name);
    dayCache[period] = data;
    document.getElementById('mainContent').innerHTML = renderDay(data);
  } catch (e) {
    document.getElementById('mainContent').innerHTML = '<div class="empty">⚠️ Не удалось загрузить итоги дня</div>';
  }
}

let currentMonthPeriod = 'current';
let currentRatingTab = 'agents';
let ratingCardOpen = false;
let ratingVisibleCount = 5;

function showMoreRating() {
  ratingVisibleCount += 5;
  const data = monthCache[currentMonthPeriod];
  if (data) document.getElementById('mainContent').innerHTML = renderMonth(data);
}
const monthCache = {};

function ratingRow(r, isAgent) {
  const color = r.avg_score >= 75 ? 'var(--green)' : r.avg_score >= 50 ? 'var(--amber)' : 'var(--red-dark)';
  const off = r.off > 0 ? '−' + r.off : '—';
  const name = isAgent ? r.agent : r.sv;
  return `<tr>
    <td style="padding:9px 8px;text-align:left"><span style="width:8px;height:8px;border-radius:50%;background:${color};display:inline-block;margin-right:6px;vertical-align:middle"></span>${name}</td>
    <td style="padding:9px 6px;text-align:right">${r.plan}</td>
    <td style="padding:9px 6px;text-align:right">${r.orders}</td>
    <td style="padding:9px 6px;text-align:right;color:var(--red-dark)">${off}</td>
    <td style="padding:9px 6px;text-align:right;font-weight:800;color:${color}">${r.avg_score.toFixed(1)}%</td>
  </tr>`;
}

function categoriesRatingTable(rows, isAgent) {
  if (!rows.length) return '<div class="empty">Нет данных</div>';
  const allCats = [...new Set(rows.flatMap(r => r.categories.map(c => c.name)))];
  const withCatAvg = rows.map(r => {
    const avg = r.categories.length ? r.categories.reduce((s,c) => s + c.pct, 0) / r.categories.length : 0;
    return {r, avg: Math.round(avg * 10) / 10};
  }).sort((a,b) => b.avg - a.avg);
  const headCells = allCats.map(n => `<th style="padding:7px 6px;text-align:right;font-size:10px;font-weight:700;color:var(--ink-soft);text-transform:uppercase">${n}</th>`).join('')
    + `<th style="padding:7px 6px;text-align:right;font-size:10px;font-weight:700;color:var(--ink-soft);text-transform:uppercase">Средняя</th>`;
  const trs = withCatAvg.map(({r, avg}) => {
    const name = isAgent ? r.agent : r.sv;
    const cellsByName = Object.fromEntries(r.categories.map(c => [c.name, c.pct]));
    const cells = allCats.map(n => {
      const v = cellsByName[n];
      if (v === undefined) return `<td style="padding:7px 6px;text-align:right;color:var(--ink-soft)">—</td>`;
      const color = catColor(v);   // 04.10.2026: шкала категорий 90/80
      return `<td style="padding:7px 6px;text-align:right;color:${color};font-weight:700">${v.toFixed(1)}%</td>`;
    }).join('');
    const avgColor = catColor(avg);
    return `<tr><td style="padding:9px 8px;text-align:left">${name}</td>${cells}<td style="padding:7px 6px;text-align:right;font-weight:800;color:${avgColor}">${avg.toFixed(1)}%</td></tr>`;
  }).join('');
  return `<table style="width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed">
    <thead><tr style="border-bottom:1px solid var(--line)"><th style="padding:7px 8px;text-align:left;font-size:10px;font-weight:700;color:var(--ink-soft);text-transform:uppercase">Имя</th>${headCells}</tr></thead>
    <tbody>${trs}</tbody></table>`;
}

function switchRatingTab(tab) {
  currentRatingTab = tab;
  ratingVisibleCount = 5;
  const data = monthCache[currentMonthPeriod];
  if (data) document.getElementById('mainContent').innerHTML = renderMonth(data);
}

function renderMonth(data) {
  const rows = currentRatingTab === 'agents' ? (data.rating.agents || [])
    : currentRatingTab === 'svs' ? (data.rating.svs || [])
    : (data.rating.tms || []);
  const isAgent = currentRatingTab === 'agents';
  const isTm = currentRatingTab === 'tms';

  function rowName(r) { return isAgent ? r.agent : isTm ? r.tm : r.sv; }

  function ratingCard(r, rank) {
    const isBest = rank === 1;
    // 15.10.2026: единый балл — части, формула и нагрузка (в балл не входит)
    const chips = r.categories.slice().sort((x, y) => (y.pct ?? -1) - (x.pct ?? -1)).map(c => `<span class="chip ${c.pct>=90?'good':'bad'}">${c.name} ${c.pct.toFixed(1)}%</span>`).join('');
    const parts = scoreParts({ sys: r.system_pct, clean: r.clean_pct, stt: r.stt_pct, cats: r.cats_pct, tasks: r.focus_pct,
                               top5: r.top5_pct, top5In: !!r.top5_in_avg, load: r.load_score, loadRaw: r.load_pct, avg: r.avg_score });
    let deltaHtml = '';
    if (r.delta !== null && r.delta !== undefined) {
      const up = r.delta >= 0;
      const sign = up ? '+' : '';
      deltaHtml = `<span class="rating-delta ${up?'up':'down'}">${sign}${r.delta.toFixed(1)}%</span>`;
    } else if (data.is_current_month) {
      deltaHtml = `<span class="rating-delta neutral">впервые в рейтинге</span>`;
    }
    const meBadge = (isTm && r.is_me) ? ` <span style="font-size:10px;font-weight:700;color:var(--ink-soft);">(вы)</span>` : '';
    return `<details class="${isBest ? 'best-card' : 'day-card'}" ${isTm && r.is_me ? 'style="border:1.5px solid var(--green);"' : ''}>
      <summary style="cursor:pointer;list-style:none;">
        ${isBest ? `<p class="best-label">Лучший результат — ${data.month}</p>` : `<p class="card-label" style="margin-bottom:8px">#${rank}</p>`}
        <div class="best-head">
          <div><span class="best-name">${rowName(r)}${meBadge}</span></div>
          <div style="text-align:right;display:flex;align-items:center;gap:6px">
            <div><span class="best-pct" style="display:block;${isBest?'':'color:var(--ink);font-size:18px'}">${r.avg_score.toFixed(1)}%</span>${deltaHtml}</div>
            <span style="font-size:13px;color:var(--ink-soft)">▶</span>
          </div>
        </div>
      </summary>
      <div style="padding-top:10px">
        ${parts}
        ${chips ? `<p class="best-sub" style="margin:6px 0 4px">Категории ${r.cats_pct != null ? r.cats_pct.toFixed(1) + '% — среднее из:' : ''}</p><div class="best-chips">${chips}</div>` : ''}
      </div>
    </details>`;
  }

  // 13.08.2026: "Рейтинг торговых" может быть длинным (десятки агентов) —
  // показываем по 5 с кнопкой "+5" вместо всего списка разом. "Рейтинг
  // СВ"/"Рейтинг ТМ" короткие (несколько человек) — показываются целиком.
  const visibleCount = isAgent ? Math.min(ratingVisibleCount, rows.length) : rows.length;
  const ratingCards = rows.length
    ? rows.slice(0, visibleCount).map((r, i) => ratingCard(r, i + 1)).join('')
    : '<div class="empty">Нет данных</div>';
  const showMoreBtn = (isAgent && visibleCount < rows.length)
    ? `<button class="show-more-btn" onclick="showMoreRating()">+5 (ещё ${rows.length - visibleCount})</button>`
    : '';

  return `
    <div class="top-row"><span></span><span class="month-pill">${data.month}</span></div>
    <div class="period-switch">
      <button class="period-btn ${currentMonthPeriod==='current'?'active':''}" onclick="loadMonth('current')">Текущий месяц</button>
      <button class="period-btn ${currentMonthPeriod==='prev'?'active':''}" onclick="loadMonth('prev')">Прошлый месяц</button>
    </div>
    ${(() => {
      const tGreen = data.stt_points || 0, tYellow = data.akb_points || 0, tRed = data.ne_akb_points || 0;
      const tTotal = data.pakb || (tGreen + tYellow + tRed);
      if (!tTotal) return '';
      const gp = Math.round(tGreen / tTotal * 100), yp = Math.round(tYellow / tTotal * 100), rp = Math.round(tRed / tTotal * 100);
      return `<details class="day-card">
        <summary style="cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;">
          <span class="card-label">🏢 Клиентская база</span>
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="text-align:right;"><div style="font-size:20px;font-weight:700;color:var(--green);">${gp}%</div><div style="font-size:9px;color:var(--ink-soft);">СТТ</div></div>
            <span style="font-size:13px;color:var(--ink-soft);">▶</span>
          </div>
        </summary>
        <div style="padding-top:14px;">
          <div style="text-align:right;margin-bottom:10px;"><span style="font-size:12px;font-weight:700;color:var(--ink-soft)">ПАКБ: ${tTotal}</span></div>
          <div style="display:flex;gap:8px;">
            <div style="flex:1;background:var(--green-bg);border-radius:12px;padding:12px 8px;text-align:center;"><div style="font-size:10.5px;font-weight:700;color:var(--green);text-transform:uppercase;margin-bottom:4px;">СТТ</div><div style="font-size:20px;font-weight:800;color:var(--green);">${tGreen}</div><div style="font-size:11px;font-weight:600;color:var(--green);opacity:.85;">${gp}%</div></div>
            <div style="flex:1;background:var(--yellow-bg);border-radius:12px;padding:12px 8px;text-align:center;"><div style="font-size:10.5px;font-weight:700;color:var(--yellow);text-transform:uppercase;margin-bottom:4px;">АКБ</div><div style="font-size:20px;font-weight:800;color:var(--yellow);">${tYellow}</div><div style="font-size:11px;font-weight:600;color:var(--yellow);opacity:.85;">${yp}%</div></div>
            <div style="flex:1;background:var(--red-bg);border-radius:12px;padding:12px 8px;text-align:center;"><div style="font-size:10.5px;font-weight:700;color:var(--red);text-transform:uppercase;margin-bottom:4px;">Не АКБ</div><div style="font-size:20px;font-weight:800;color:var(--red);">${tRed}</div><div style="font-size:11px;font-weight:600;color:var(--red);opacity:.85;">${rp}%</div></div>
          </div>
        </div>
      </details>`;
    })()}
    <details class="day-card">
      <summary style="cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;">
        <span class="card-label">📊 Система</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="text-align:right;"><div style="font-size:20px;font-weight:700;color:var(--ink);">${data.clean_stt}%</div><div style="font-size:9px;color:var(--ink-soft);">чистая</div></div>
          <span style="font-size:13px;color:var(--ink-soft);">▶</span>
        </div>
      </summary>
      <div style="padding-top:14px;">
        ${data.is_current_month ? '<p class="card-note">За период с начала месяца по вчера включительно</p>' : ''}
        <div class="day-grid">
          <div class="day-tile"><div class="val">${data.planned_visits}</div><div class="lbl">плановых визитов</div></div>
          <div class="day-tile"><div class="val">${data.system_orders}</div><div class="lbl">системных заказов</div></div>

async function loadMonth(period) {
  currentMonthPeriod = period;
  ratingVisibleCount = 5;
  if (monthCache[period]) {
    document.getElementById('mainContent').innerHTML = renderMonth(monthCache[period]);
    return;
  }
  document.getElementById('mainContent').innerHTML = '<div class="loader"><div class="spinner"></div><span>Загрузка данных...</span></div>';
  try {
    const today = new Date();
    let m = today.getMonth() + 1, y = today.getFullYear();
    if (period === 'prev') {
      m = m > 1 ? m - 1 : 12;
      y = m === 12 ? y - 1 : y;
    }
    const [summaryRes, ratingRes] = await Promise.all([
      fetch(`${API}/api/tm/${currentTelegramId}/month?month=${m}&year=${y}`),
      fetch(`${API}/api/tm/${currentTelegramId}/month-rating?month=${m}&year=${y}`),
    ]);
    if (!summaryRes.ok || !ratingRes.ok) throw new Error('bad response');
    const summary = await summaryRes.json();
    setTmName(summary.tm_name);
    const ratingData = await ratingRes.json();
    const merged = { ...summary, rating: { agents: ratingData.agents, svs: ratingData.svs } };
    monthCache[period] = merged;
    document.getElementById('mainContent').innerHTML = renderMonth(merged);
  } catch (e) {
    document.getElementById('mainContent').innerHTML = '<div class="empty">⚠️ Не удалось загрузить итоги месяца</div>';
  }
}

function setTmName(name) {
  const el = document.getElementById('tmName');
  if (el && name) el.textContent = name;
}

async function loadRoute() {
  document.getElementById('mainContent').innerHTML = '<div class="loader"><div class="spinner"></div><span>Загрузка данных...</span></div>';
  try {
    const res = await fetch(`${API}/api/tm/${currentTelegramId}/route`);
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    setTmName(data.tm_name);
    document.getElementById('mainContent').innerHTML = renderRoute(data);
  } catch (e) {
    document.getElementById('mainContent').innerHTML = '<div class="empty">⚠️ Не удалось загрузить маршрут</div>';
  }
}

    .map(s => ({ ...s, n: s.agents.reduce((t, a) => t + a[key].length, 0) })).filter(s => s.n).sort((a, b) => b.n - a.n);
  if (!rows.length) return '';
  const total = rows.reduce((t, s) => t + s.n, 0);
  const col = kind === 'off' ? '#1a56db' : VG_GHOST;
  return `<div class="vg-list">${_vgHead(kind, total)}${rows.map(s => `<details class="vg-grp"><summary><span>${vgEsc(s.sv)}<small>агентов: ${s.agents.length}</small></span><span class="vg-cnt" style="color:${col}">${s.n} ▾</span></summary><div>${s.agents.map(a => `<details class="vg-grp"><summary><span style="font-weight:600">${vgEsc(a.name.split(' ').slice(0, 2).join(' '))}<small>${vgPluralPts(a[key].length)}</small></span><span class="vg-cnt" style="color:${col}">${a[key].length} ▾</span></summary><div>${a[key].map(p => _vgRow(a.name, p, kind)).join('')}</div></details>`).join('')}</div></details>`).join('')}</div>`;
}

// ---------- Карточка точки ----------
async function vgOpenPoint(i) {
  const p = _vgPts[i];
  if (!p) return;
  let ov = document.getElementById('vg-ov');
  if (!ov) { ov = document.createElement('div'); ov.id = 'vg-ov'; ov.className = 'vg-ov'; document.body.appendChild(ov); }
  const back = `<div class="vg-back" onclick="vgClosePoint()">‹ Назад</div>`;
  ov.innerHTML = `<div class="vg-ov-in">${back}<div class="vg-card"><div class="vg-pts">Загрузка…</div></div></div>`;
  ov.style.display = 'block';
  document.body.style.overflow = 'hidden';
  try {
    const r = await fetch(`${API}/api/point/${vgId()}?agent=${encodeURIComponent(p.agent)}&tt=${encodeURIComponent(p.tt)}`);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    ov.innerHTML = `<div class="vg-ov-in">${back}${vgPointCard(d)}</div>`;
  } catch (e) {
    ov.innerHTML = `<div class="vg-ov-in">${back}<div class="vg-card"><div class="vg-pts">Не удалось загрузить точку. Попробуйте ещё раз.</div></div></div>`;
  }
}
function vgClosePoint() {
  const ov = document.getElementById('vg-ov');
  if (ov) ov.style.display = 'none';
  document.body.style.overflow = '';
}
function vgPointCard(d) {
  const ghost = !d.in_plan;
  const pd = new Set(d.plan_days || []);
  const cell = (x, y, m) => {
    const cls = { ok: 'ok p', miss: 'miss p', off: 'off', ghost: 'ghost', fut: 'fut p', today: 'today p' }[x.s] || '';
    const ic = x.s === 'ok' ? '✓' : x.s === 'miss' ? '✕' : x.s === 'off' ? vgPin('#fff', '10px') : x.s === 'ghost' ? '👻' : '';
    return `<div class="vg-c ${cls}"><em>${ic}</em>${x.d}</div>`;
  };
  const months = (d.months || []).map(mo => {
    const first = (new Date(mo.year, mo.month - 1, 1).getDay() + 6) % 7;
    const stat = mo.in_plan ? `план ${mo.planned} · по плану ${mo.orders - mo.off} · вне ${mo.off}` : `нет в плане${mo.orders ? ` · заказов ${mo.orders}` : ''}`;
    return `<div class="vg-mon">${VG_MONTHS[mo.month - 1]}<span>${stat}</span></div><div class="vg-cal">
      ${VG_WD.map((w, i) => `<div class="vg-wd${(mo.plan_wd ? mo.plan_wd.includes(i) : pd.has(i)) ? ' pl' : ''}">${w}</div>`).join('')}
      ${'<div class="vg-c e"></div>'.repeat(first)}${mo.days.map(x => cell(x, mo.year, mo.month)).join('')}</div>`;
  }).join('');
  const t = d.totals || {};
  const wdFull = ['понедельник', 'вторник', 'среду', 'четверг', 'пятницу', 'субботу', 'воскресенье'];
  const v = d.verdict;
  // плашка «В плане: пн, нед. 1, 2 · добавлена 20.10 / закрыта с 03.10»
  const ddmm = s => s ? s.slice(8, 10) + '.' + s.slice(5, 7) : '';
  const sp = d.plan_spec || [];
  const planTxt = sp.length ? sp.map(x => VG_WD[x.wd] + (x.weeks ? ` (нед. ${x.weeks.join(', ')})` : '')).join(', ')
    + (sp.every(x => !x.weeks) ? ', каждую неделю' : '') : '';
  const extra = [d.since ? `добавлена ${ddmm(d.since)}` : '', d.until ? `закрыта с ${ddmm(d.until)}` : ''].filter(Boolean).join(' · ');
  const planLine = ghost ? `<div class="vg-plan" style="background:${VG_GHOST}">👻 Точки нет в плане агента</div>`
    : planTxt ? `<div class="vg-plan">🗓 В плане: ${planTxt}${extra ? ' · ' + extra : ''}</div>` : '';
  const verdict = v ? `<div class="vg-verdict">${vgPin(VG_BLUE)}<span>${v.off} из ${v.total} заказов — не в свой день, чаще всего в ${wdFull[v.weekday]}. Возможно, точку стоит перенести на ${wdFull[v.weekday]}.</span></div>`
    : ghost && t.off ? `<div class="vg-verdict" style="background:#EDE9F7;color:${VG_GHOST}">👻<span>Точки нет в плане агента, а заказы есть (${t.off}). Возможно, её стоит добавить в маршрут.</span></div>` : '';
  return `<div class="vg-card${ghost ? ' ghost' : ''}">
    <div class="vg-pt">${vgEsc(d.name)}</div>
    <div class="vg-pts">${d.address && d.address !== d.name ? vgEsc(d.address) + ' · ' : ''}код ${vgEsc(d.tt_code)}<br>${vgEsc(d.agent)}</div>
    ${planLine}
    <div class="vg-leg2">${ghost ? '' : `<span><i class="vg-sw" style="background:${VG_OK};box-shadow:inset 0 0 0 2.5px #1f2937"></i>плановый день · заказ есть</span>
      <span><i class="vg-sw" style="background:${VG_MISS};box-shadow:inset 0 0 0 2.5px #1f2937"></i>плановый день · заказа нет</span>
      <span><i class="vg-sw" style="background:#fff;box-shadow:inset 0 0 0 2.5px #1f2937;outline:1px dashed #9ca3af;outline-offset:-5px"></i>плановый день · впереди</span>`}
      <span><i class="vg-sw" style="background:${ghost ? VG_GHOST : VG_BLUE}"></i>${ghost ? 'заказ, точки нет в плане' : 'заказ не в плановый день'}</span></div>
    ${months}
    <div class="vg-sum"><div><b style="color:${VG_OK}">${t.ok || 0}</b>по плану</div><div><b style="color:${ghost ? VG_GHOST : VG_BLUE}">${t.off || 0}</b>${ghost ? 'призрак' : 'вне'}</div><div><b style="color:${VG_MISS}">${t.miss || 0}</b>без заказа</div><div><b>${t.fut || 0}</b>впереди</div></div>
    ${verdict}
  </div>`;
}

</script>
