<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СТТ — Территориальный менеджер</title>
<style>
  :root {
    --bg: #F0EADC;
    --card: #FFFFFF;
    --ink: #2C2A26;
    --ink-soft: #8B8578;
    --line: #ECE6D8;
    --green: #3FAE6A;
    --green-bg: #E6F4EC;
    --yellow: #E2A335;
    --yellow-bg: #FBF1DF;
    --red: #DC5B4E;
    --red-bg: #FAE7E4;
    --red-dark: #A93B30;
    --amber: #D98A3D;
    --amber-bg: #F8EBDB;
    --blue: #3B7DDB;
    --blue-bg: #E7EFFB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  .phone {
    width: 100%; max-width: 480px; background: var(--bg);
    height: 100dvh; display: flex; flex-direction: column;
  }
  .topbar { padding: 22px 20px 14px; display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0; }
  .topbar h1 { font-size: 20px; font-weight: 700; margin: 0; }
  .top-pill { font-size: 13px; color: var(--ink-soft); background: var(--card); border-radius: 100px; padding: 6px 12px; font-weight: 600; }
  .content { padding: 4px 16px 24px; overflow-y: auto; flex: 1; }
  .tabbar { display: flex; background: var(--card); border-top: 1px solid var(--line); padding: 9px 4px 14px; flex-shrink: 0; }
  .tab { flex: 1; text-align: center; font-size: 10px; font-weight: 700; color: var(--ink-soft); background: none; border: none; font-family: inherit; cursor: pointer; padding: 6px 2px 0; }
  .tab.active { color: var(--ink); }
  .tab .icon { width: 26px; height: 26px; margin: 0 auto 4px; border-radius: 8px; background: var(--line); display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .tab.active .icon { background: #D9CFAE; }
  .loader { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 12px; color: var(--ink-soft); }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--amber); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 40px 16px; color: var(--ink-soft); font-size: 14px; }

  /* ============ ЭКРАН МАРШРУТ (ТМ) — ТОП-5 в фокусе ============ */
  .sub { font-size: 12px; color: var(--ink-soft); font-weight: 600; margin: -4px 0 14px; }

  details.route-card {
    background: var(--card); border-radius: 16px; margin-bottom: 10px; overflow: hidden;
    border: 1px solid var(--line);
  }
  details.route-card[open] {
    margin: 14px 0; box-shadow: 0 6px 18px rgba(60,50,20,.10);
  }
  details.route-card summary {
    list-style: none; cursor: pointer; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  details.route-card summary::-webkit-details-marker { display: none; }
  .rc-name { font-size: 14px; font-weight: 700; }
  .rc-sub { font-size: 11px; color: var(--ink-soft); font-weight: 600; margin-left: 4px; }
  .rc-right { display: flex; align-items: center; gap: 10px; }
  .rc-deficit { text-align: right; }
  .rc-deficit .num { font-size: 18px; font-weight: 800; color: var(--red-dark); line-height: 1.1; }
  .rc-deficit .lbl { font-size: 9px; color: var(--red-dark); opacity: .8; }
  .rc-chevron { font-size: 13px; color: var(--ink-soft); transition: transform .15s; }
  details[open] .rc-chevron { transform: rotate(90deg); }

  .rc-body { padding: 0 16px 16px; }
  .rc-tiles { display: flex; gap: 5px; margin-bottom: 14px; align-items: stretch; }
  .rc-tile { flex: 1; background: var(--bg); border-radius: 9px; padding: 7px 3px; text-align: center; min-width: 0; }
  .rc-tile .val { font-size: 13px; font-weight: 800; }
  .rc-tile .lbl { font-size: 8px; color: var(--ink-soft); font-weight: 600; margin-top: 3px; }
  .rc-tile .sub { font-size: 7px; color: var(--ink-soft); opacity: .75; margin: 1px 0 0; font-weight: 500; }
  .rc-off { align-self: center; font-size: 10px; font-weight: 800; color: var(--red-dark); white-space: nowrap; }

  .pakb-block { margin-bottom: 12px; }
  .pakb-head { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 10px; color: var(--ink-soft); font-weight: 600; }
  .pakb-bar { height: 4px; border-radius: 2px; overflow: hidden; display: flex; }
  .pakb-legend { display: flex; justify-content: space-between; font-size: 9px; color: var(--ink-soft); font-weight: 600; margin-top: 4px; }

  .formula-toggle { cursor: pointer; background: var(--blue-bg); border-left: 3px solid var(--blue); border-radius: 10px; padding: 10px 12px; }
  .formula-head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--blue); }
  .formula-body { margin-top: 8px; display: none; }
  .formula-toggle.open .formula-body { display: block; }
  .frow { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(59,125,219,.12); font-size: 11px; }
  .frow:last-of-type { border-bottom: none; }
  .frow span:first-child { color: var(--blue); opacity: .8; }
  .frow span:last-child { font-weight: 700; color: var(--blue); }
  .frow.total { padding-top: 6px; border-top: 1px solid rgba(59,125,219,.25); margin-top: 4px; font-size: 12px; }
  .frow.total span:last-child { color: var(--red-dark); font-size: 14px; }

  .rest-toggle { text-align: center; padding: 12px 0; font-size: 12px; font-weight: 700; color: var(--ink-soft); cursor: pointer; }
  .rest-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .rest-row span:last-child { color: var(--ink-soft); font-weight: 600; }

  .history-toggle { cursor: pointer; background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
  .history-head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .history-body { margin-top: 10px; display: none; }
  .history-toggle.open .history-body { display: block; }
  .history-days { display: flex; gap: 6px; justify-content: space-between; }
  .history-day { text-align: center; }
  .history-day .dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; margin: 0 auto 4px; }
  .history-day .dot.done { background: var(--green-bg); color: var(--green); }
  .history-day .dot.miss { background: var(--red-bg); color: var(--red-dark); }
  .history-day .lbl { font-size: 9px; color: var(--ink-soft); font-weight: 600; }
  .history-summary { text-align: center; font-size: 11px; color: var(--ink-soft); font-weight: 600; margin-top: 10px; }

  /* ============ ЭКРАН ИТОГИ ДНЯ (ТМ) ============ */
  .period-switch { display: flex; gap: 6px; margin-bottom: 14px; }
  .period-btn { flex: 1; font-size: 11px; font-weight: 700; padding: 8px 4px; border-radius: 9px; border: none; background: var(--card); color: var(--ink-soft); cursor: pointer; font-family: inherit; }
  .period-btn.active { background: var(--ink); color: #fff; }

  .day-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  .day-card h3 { font-size: 12px; font-weight: 700; color: var(--ink-soft); margin: 0 0 10px; text-transform: uppercase; letter-spacing: .02em; }
  .day-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .day-tile { background: var(--bg); border-radius: 10px; padding: 10px; text-align: center; }
  .day-tile .val { font-size: 18px; font-weight: 800; }
  .day-tile .lbl { font-size: 10px; color: var(--ink-soft); font-weight: 600; margin-top: 3px; }

  .team-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .team-row:last-child { border-bottom: none; }
  .cat-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; color: var(--ink-soft); }
  .cat-row b { color: var(--ink); }

  details.agent-day-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; overflow: hidden; }
  details.agent-day-card summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; }
  details.agent-day-card summary::-webkit-details-marker { display: none; }
  .adc-name { font-size: 13px; font-weight: 700; }
  .adc-sub { font-size: 10px; color: var(--ink-soft); font-weight: 600; margin-left: 4px; }
  .adc-body { padding: 0 14px 14px; }
  .adc-metrics { display: flex; gap: 8px; margin-bottom: 10px; }
  .adc-metric { flex: 1; background: var(--bg); border-radius: 9px; padding: 8px; text-align: center; }
  .adc-metric .val { font-size: 15px; font-weight: 800; }
  .adc-metric .lbl { font-size: 8px; color: var(--ink-soft); font-weight: 600; margin-top: 2px; }
  .point-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px; }
  .point-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .point-dot.green { background: var(--green); }
  .point-dot.yellow { background: var(--yellow); }
  .point-dot.red { background: var(--red); }
  .point-name { flex: 1; color: var(--ink-soft); }
</style>
</head>
<body>
<div id="app">
  <div class="phone">
    <div class="topbar">
      <h1 id="topTitle">Загрузка...</h1>
      <div class="top-pill" id="topPill" style="display:none"></div>
    </div>
    <div class="content" id="mainContent">
      <div class="loader"><div class="spinner"></div><span>Загрузка данных...</span></div>
    </div>
    <div class="tabbar" id="tabbar">
      <button class="tab active" data-screen="route" onclick="switchScreen('route')"><span class="icon">🗺️</span>Маршрут</button>
      <button class="tab" data-screen="day" onclick="switchScreen('day')"><span class="icon">📋</span>Итоги дня</button>
    </div>
  </div>
</div>

<script>
const API = new URLSearchParams(window.location.search).get('dev') === '1'
  ? 'https://develop-production-0a2d.up.railway.app'
  : 'https://worker-production-1dfb.up.railway.app';

function getTelegramId() {
  const p = new URLSearchParams(window.location.search);
  if (p.get('id')) return p.get('id');
  if (window.Telegram?.WebApp?.initDataUnsafe?.user?.id)
    return String(window.Telegram.WebApp.initDataUnsafe.user.id);
  return null;
}

function toggleFormula(el, ev) {
  ev.stopPropagation();
  el.classList.toggle('open');
}

let currentTelegramId = null;
const historyCache = {};

async function toggleHistory(cardId, agentName, ev) {
  ev.stopPropagation();
  const toggle = document.getElementById(`hist-${cardId}`);
  const body = document.getElementById(`hist-body-${cardId}`);
  const wasOpen = toggle.classList.contains('open');
  toggle.classList.toggle('open');
  if (wasOpen) return;

  if (historyCache[agentName]) {
    body.innerHTML = renderHistoryDots(historyCache[agentName]);
    return;
  }

  try {
    const res = await fetch(`${API}/api/tm/${currentTelegramId}/route-history?agent=${encodeURIComponent(agentName)}`);
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    historyCache[agentName] = data.history;
    body.innerHTML = renderHistoryDots(data.history);
  } catch (e) {
    body.innerHTML = '<div class="empty" style="padding:10px 0">Не удалось загрузить историю</div>';
  }
}

function renderHistoryDots(history) {
  const doneCount = history.filter(d => d.completed).length;
  const days = history.map(d => `
    <div class="history-day">
      <div class="dot ${d.completed ? 'done' : 'miss'}">${d.completed ? '✓' : '✗'}</div>
      <div class="lbl">${d.weekday.slice(0, 2)}</div>
    </div>`).join('');
  return `<div class="history-days">${days}</div>
    <div class="history-summary">${doneCount} из ${history.length} дней — задача выполнена</div>`;
}

function renderRouteCard(a, rank) {
  const cardId = rank;
  const pakb = a.stt_points + a.akb_points + a.ne_akb_points;
  const sttPct = pakb ? Math.round(a.stt_points / pakb * 100) : 0;
  const akbPct = pakb ? Math.round(a.akb_points / pakb * 100) : 0;
  const neakbPct = 100 - sttPct - akbPct;

  return `<details class="route-card">
    <summary>
      <div><span class="rc-name">${rank} · ${a.agent}</span><span class="rc-sub">${a.sv || ''}</span></div>
      <div class="rc-right">
        <div class="rc-deficit"><div class="num">${a.deficit_orders}</div><div class="lbl">дефицит заказов</div></div>
        <span class="rc-chevron">▶</span>
      </div>
    </summary>
    <div class="rc-body">
      <div class="rc-tiles">
        <div class="rc-tile"><div class="val" style="color:${a.deficit_visits > 0 ? 'var(--red-dark)' : 'var(--ink-soft)'}">${a.deficit_visits}</div><div class="lbl">деф. визитов</div></div>
        <div class="rc-tile"><div class="val">${a.system_pct}%</div><div class="lbl">системная</div><div class="sub">${a.orders}з·${a.base}в(база)</div></div>
        <div class="rc-off">−${a.off_route}</div>
        <div class="rc-tile"><div class="val">${a.clean_pct}%</div><div class="lbl">чистая</div></div>
        <div class="rc-tile"><div class="val">${a.avg_category != null ? a.avg_category + '%' : '—'}</div><div class="lbl">ср. категория</div></div>
      </div>
      <div class="pakb-block">
        <div class="pakb-head"><span>Клиентская база (ПАКБ)</span><span>${pakb}</span></div>
        <div class="pakb-bar">
          <div style="width:${sttPct}%;background:var(--green)"></div>
          <div style="width:${akbPct}%;background:var(--yellow)"></div>
          <div style="width:${neakbPct}%;background:var(--red)"></div>
        </div>
        <div class="pakb-legend"><span>СТТ ${a.stt_points}</span><span>АКБ ${a.akb_points}</span><span>Не АКБ ${a.ne_akb_points}</span></div>
      </div>
      <div class="formula-toggle" onclick="toggleFormula(this, event)">
        <div class="formula-head"><span>Как посчитали ${a.deficit_orders}?</span><span>▾</span></div>
        <div class="formula-body">
          <div class="frow"><span>План визитов (мес)</span><span>${a.plan}</span></div>
          <div class="frow"><span>Средний по команде</span><span>${a.team_average_plan}</span></div>
          <div class="frow"><span>Требуемый план заказов = ${a.base}×75%</span><span>${a.need_orders}</span></div>
          <div class="frow"><span>Заказов по факту</span><span>${a.orders}</span></div>
          <div class="frow total"><span>Дефицит заказов</span><span>${a.deficit_orders}</span></div>
        </div>
      </div>
    </div>
  </details>`;
}

function renderRoute(data) {
  if (!data.archive_ready) {
    return `<div class="sub">ТОП-5 в фокусе · ${data.month}</div>
      <div class="empty">Итоги ${data.month} ещё не закрыты — ТОП-5 появится после закрытия месяца.</div>`;
  }

  const top5Html = data.top5.map((a, i) => renderRouteCard(a, i + 1)).join('');
  const restHtml = data.rest.length
    ? `<div class="rest-toggle" onclick="document.getElementById('restList').style.display = document.getElementById('restList').style.display === 'none' ? 'block' : 'none'">Остальные маршруты (${data.rest.length}) ▾</div>
       <div id="restList" style="display:none">
         ${data.rest.map(a => `<div class="rest-row"><span>${a.agent}</span><span>дефицит ${a.deficit_orders}</span></div>`).join('')}
       </div>`
    : '';

  return `<div class="sub">ТОП-5 в фокусе · ${data.month}</div>${top5Html}${restHtml}`;
}

let currentScreen = 'route';
let currentPeriod = 'today';
const dayCache = {};

function switchScreen(screen) {
  currentScreen = screen;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.screen === screen));
  if (screen === 'route') {
    document.getElementById('topTitle').textContent = 'Маршрут';
    loadRoute();
  } else {
    document.getElementById('topTitle').textContent = 'Итоги дня';
    loadDay(currentPeriod);
  }
}

function levelClass(level) {
  if (level === '🟢') return 'green';
  if (level === '🟡') return 'yellow';
  return 'red';
}

function renderDay(data) {
  const periodSwitch = `<div class="period-switch">
    <button class="period-btn ${currentPeriod === 'today' ? 'active' : ''}" onclick="loadDay('today')">Сегодня</button>
    <button class="period-btn ${currentPeriod === 'prev' ? 'active' : ''}" onclick="loadDay('prev')">Прошлый день</button>
    <button class="period-btn ${currentPeriod === 'week' ? 'active' : ''}" onclick="loadDay('week')">Неделя назад</button>
  </div>`;

  const teamsHtml = (data.teams || []).map(t => `<div class="team-row"><span>${t.team}</span><span>${t.orders}/${t.plan} · ${t.system_pct}%</span></div>`).join('');
  const catsHtml = (data.categories || []).map(c => `<div class="cat-row"><span>${c.name}</span><b>${c.pct}%</b></div>`).join('');

  const top5Html = data.top5_focus_ready
    ? (data.top5_today || []).map(a => {
        const pointsHtml = a.points.map(p => `
          <div class="point-row">
            <span class="point-dot ${levelClass(p.level)}"></span>
            <span class="point-name">${p.name}</span>
            <span>${p.orders}/${p.total_planned}</span>
          </div>`).join('') || '<div class="empty" style="padding:6px 0;font-size:11px">Нет точек на сегодня</div>';
        return `<details class="agent-day-card">
          <summary>
            <div><span class="adc-name">${a.agent}</span><span class="adc-sub">${a.sv || ''}</span></div>
            <span class="rc-chevron">▶</span>
          </summary>
          <div class="adc-body">
            <div class="adc-metrics">
              <div class="adc-metric"><div class="val">${a.visits_today}/${a.visits_target}</div><div class="lbl">визитов сегодня/норма</div></div>
              <div class="adc-metric"><div class="val">${a.orders_week_ago}/${a.orders_target}</div><div class="lbl">заказы неделю назад/норма</div></div>
            </div>
            ${pointsHtml}
          </div>
        </details>`;
      }).join('')
    : '<div class="empty" style="padding:12px 0">Итоги прошлого месяца ещё не закрыты — ТОП-5 недоступен</div>';

  return `${periodSwitch}
    <div class="day-card">
      <h3>Итог по территории</h3>
      <div class="day-grid">
        <div class="day-tile"><div class="val">${data.planned_visits}</div><div class="lbl">плановых</div></div>
        <div class="day-tile"><div class="val">${data.system_orders} <span style="color:var(--red-dark);font-size:11px">−${data.off_route_orders}</span></div><div class="lbl">заказов</div></div>
        <div class="day-tile"><div class="val">${data.system_stt}%</div><div class="lbl">системная</div></div>
        <div class="day-tile"><div class="val">${data.clean_stt}%</div><div class="lbl">чистая</div></div>
      </div>
    </div>
    <div class="day-card"><h3>По командам</h3>${teamsHtml || '<div class="empty">Нет данных</div>'}</div>
    <div class="day-card"><h3>Категории</h3>${catsHtml || '<div class="empty">Нет данных</div>'}</div>
    <div class="sub" style="margin:14px 0 10px">ТОП-5 сегодня</div>
    ${top5Html}`;
}

async function loadDay(period) {
  currentPeriod = period;
  document.querySelectorAll('.period-btn').forEach(b => {});
  if (dayCache[period]) {
    document.getElementById('mainContent').innerHTML = renderDay(dayCache[period]);
    return;
  }
  document.getElementById('mainContent').innerHTML = '<div class="loader"><div class="spinner"></div><span>Загрузка данных...</span></div>';
  try {
    const res = await fetch(`${API}/api/tm/${currentTelegramId}/day?period=${period}`);
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    dayCache[period] = data;
    document.getElementById('mainContent').innerHTML = renderDay(data);
  } catch (e) {
    document.getElementById('mainContent').innerHTML = '<div class="empty">⚠️ Не удалось загрузить итоги дня</div>';
  }
}

async function loadRoute() {
  document.getElementById('mainContent').innerHTML = '<div class="loader"><div class="spinner"></div><span>Загрузка данных...</span></div>';
  try {
    const res = await fetch(`${API}/api/tm/${currentTelegramId}/route`);
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    document.getElementById('mainContent').innerHTML = renderRoute(data);
  } catch (e) {
    document.getElementById('mainContent').innerHTML = '<div class="empty">⚠️ Не удалось загрузить маршрут</div>';
  }
}

async function main() {
  const telegramId = getTelegramId();
  currentTelegramId = telegramId;
  if (!telegramId) {
    document.getElementById('topTitle').textContent = 'Нет доступа';
    document.getElementById('mainContent').innerHTML = '<div class="empty">Откройте через Telegram</div>';
    return;
  }
  document.getElementById('topTitle').textContent = 'Маршрут';
  await loadRoute();
}

main();
</script>
</body>
</html>
