<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СТТ — Супервайзер</title>
<style>
  :root {
    --bg: #F0EADC;
    --card: #FFFFFF;
    --ink: #2C2A26;
    --ink-soft: #8B8578;
    --line: #ECE6D8;
    --green: #3FAE6A;
    --green-bg: #E6F4EC;
    --yellow: #E2A335;
    --yellow-bg: #FBF1DF;
    --red: #DC5B4E;
    --red-bg: #FAE7E4;
    --red-dark: #A93B30;
    --amber: #D98A3D;
    --amber-bg: #F8EBDB;
    --blue: #3B7DDB;
    --blue-bg: #E7EFFB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  .phone {
    width: 100%; max-width: 480px; background: var(--bg);
    height: 100dvh; display: flex; flex-direction: column;
  }
  .topbar { padding: 22px 20px 14px; display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0; }
  .topbar h1 { font-size: 20px; font-weight: 700; margin: 0; }
  .top-pill { font-size: 13px; color: var(--ink-soft); background: var(--card); border-radius: 100px; padding: 6px 12px; font-weight: 600; }
  .content { padding: 4px 16px 24px; overflow-y: auto; flex: 1; }

  .screen-panel { display: none; }
  .screen-panel.active { display: block; }

  .tabbar { display: flex; background: var(--card); border-top: 1px solid var(--line); padding: 9px 4px 14px; flex-shrink: 0; }
  .tab {
    flex: 1; text-align: center; font-size: 10px; font-weight: 700; color: var(--ink-soft);
    background: none; border: none; font-family: inherit; cursor: pointer; padding: 6px 2px 0;
  }
  .tab.active { color: var(--ink); }
  .tab .icon {
    width: 26px; height: 26px; margin: 0 auto 4px; border-radius: 8px; background: var(--line);
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .tab.active .icon { background: #D9CFAE; }

  /* LOADER */
  .loader { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 12px; color: var(--ink-soft); }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--amber); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 40px 16px; color: var(--ink-soft); font-size: 14px; }

  /* ============ SCREEN: МАРШРУТ ============ */
  #screen-route .ride-card {
    display: flex; align-items: center; gap: 12px;
    background: #FAE7E4; border: 1px solid #F1C9C2;
    border-radius: 14px; padding: 13px 14px; margin-bottom: 14px;
  }
  #screen-route .ride-icon { font-size: 22px; flex-shrink: 0; }
  #screen-route .ride-title { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--red); margin-bottom: 2px; }
  #screen-route .ride-name { font-size: 15px; font-weight: 800; color: var(--ink); }
  #screen-route .ride-reason { font-size: 12px; color: var(--ink-soft); font-weight: 600; margin-top: 1px; }

  #screen-route .summary-strip {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 16px;
  }
  #screen-route .ss-num { font-size: 20px; font-weight: 800; line-height: 1; }
  #screen-route .ss-text { font-size: 12px; color: var(--ink-soft); font-weight: 600; line-height: 1.3; }
  #screen-route .ss-divider { width: 1px; align-self: stretch; background: var(--line); }
  #screen-route .ss-explainer { font-size: 12px; color: var(--ink-soft); font-weight: 600; line-height: 1.4; }
  #screen-route .ss-explainer-sub { display: block; font-size: 10.5px; font-weight: 500; color: var(--ink-soft); opacity: 0.75; margin-top: 4px; line-height: 1.35; }

  #screen-route details.agent-group {
    background: var(--card); border-radius: 16px; margin-bottom: 16px; overflow: hidden;
    border: 1px solid #E2D9C2; box-shadow: 0 2px 6px rgba(60,50,20,0.05);
    border-left: 4px solid var(--line);
  }
  #screen-route details.agent-group.severity-high { border-left-color: var(--red); }
  #screen-route details.agent-group.severity-mid  { border-left-color: var(--amber); }
  #screen-route details.agent-group summary {
    list-style: none; display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; cursor: pointer; background: #EFE4C9; border-bottom: 1px solid #E2D9C2;
  }
  #screen-route details.agent-group summary::-webkit-details-marker { display: none; }
  #screen-route .agent-group .name { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; }
  #screen-route .agent-group .meta { display: flex; align-items: center; gap: 8px; }
  #screen-route .agent-group .count { font-size: 12px; color: var(--ink-soft); font-weight: 700; background: rgba(255,255,255,0.55); padding: 3px 9px; border-radius: 100px; }
  #screen-route .unfilled-badge { font-size: 10.5px; font-weight: 700; color: var(--red); background: #FAE7E4; padding: 3px 8px; border-radius: 100px; }
  #screen-route .chevron { font-size: 11px; color: var(--ink-soft); transition: transform 0.15s; }
  #screen-route details[open] .chevron { transform: rotate(90deg); }

  /* Коуч-контекст в карточке агента */
  #screen-route .coach-context { padding: 11px 16px; background: #F8F3E5; border-bottom: 1px solid #ECE3CD; }
  #screen-route .coach-context-label { font-size: 10px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 7px; }
  #screen-route .coach-context-row { display: flex; flex-direction: column; gap: 2px; margin-bottom: 5px; font-size: 11.5px; line-height: 1.4; }
  #screen-route .coach-context-key { font-weight: 800; color: var(--ink); }
  #screen-route .coach-context-val { color: var(--ink-soft); }
  #screen-route .coach-context-divider { height: 1px; background: #ECE3CD; margin: 7px 0; }
  #screen-route .coach-context-score { font-size: 11.5px; font-weight: 800; padding: 4px 10px; border-radius: 100px; display: inline-block; }
  #screen-route .coach-context-score.red { background: var(--red-bg); color: var(--red); }
  #screen-route .coach-context-score.yellow { background: var(--yellow-bg); color: var(--yellow); }
  #screen-route .coach-context-score.green { background: var(--green-bg); color: var(--green); }
  #screen-route .survey-unfilled { padding: 10px 16px; background: #F8F3E5; border-bottom: 1px solid #ECE3CD; font-size: 11.5px; font-style: italic; color: var(--ink-soft); opacity: 0.7; }

  #screen-route .grid-head, #screen-route .grid-row {
    display: grid; grid-template-columns: 1fr 44px 44px 60px; align-items: stretch;
  }
  #screen-route .grid-head { background: #F8F3E5; border-bottom: 1.5px solid #E2D9C2; }
  #screen-route .grid-head span {
    font-size: 10px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em;
    text-align: center; padding: 9px 4px; border-left: 1px solid #E2D9C2;
  }
  #screen-route .grid-head span:first-child { text-align: left; padding-left: 16px; border-left: none; }
  #screen-route .grid-row { border-bottom: 1px solid #ECE3CD; }
  #screen-route .grid-row:last-child { border-bottom: none; }
  #screen-route .grid-row:nth-of-type(even) { background: #FBF8EF; }
  #screen-route .point-name { font-size: 13px; font-weight: 600; line-height: 1.25; padding: 12px 10px 12px 16px; }
  #screen-route .mark { display: flex; justify-content: center; align-items: center; border-left: 1px solid #ECE3CD; padding: 8px 0; }
  #screen-route .mark-dot { width: 16px; height: 16px; border-radius: 50%; }
  #screen-route .mark-dot.two { background: var(--amber); }
  #screen-route .mark-dot.three { background: var(--red); }
  #screen-route .offroute-num { display: flex; align-items: center; justify-content: center; border-left: 1px solid #ECE3CD; font-size: 14px; font-weight: 800; color: var(--amber); }
  #screen-route .offroute-num.empty { color: var(--ink-soft); opacity: 0.4; }

  /* ============ SCREEN: СТТ ============ */
  #screen-stt .summary-card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 18px; }
  #screen-stt .summary-top-row { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 12px; }
  #screen-stt .summary-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin: 0; }
  #screen-stt .period-caption { font-size: 11px; color: var(--ink-soft); font-weight: 600; }
  #screen-stt .dist-row { display: flex; align-items: center; gap: 6px; margin-bottom: 16px; }
  #screen-stt .dist-tile { flex: 1; background: var(--bg); border-radius: 14px; padding: 11px 13px; }
  #screen-stt .dist-tile-label { font-size: 10.5px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; }
  #screen-stt .dist-tile-pct { font-size: 21px; font-weight: 800; line-height: 1.25; }
  #screen-stt .dist-tile-pct.green { color: var(--green); }
  #screen-stt .dist-tile-pct.yellow { color: var(--yellow); }
  #screen-stt .dist-tile-pct.red { color: var(--red); }
  #screen-stt .dist-tile-count { font-size: 11px; color: var(--ink-soft); font-weight: 600; }
  #screen-stt .dist-minus-chip { flex-shrink: 0; width: 44px; text-align: center; }
  #screen-stt .dist-minus-chip .val { font-size: 13px; font-weight: 800; color: var(--red); }
  #screen-stt .dist-minus-chip .cap { font-size: 9px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; }
  #screen-stt .category-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  #screen-stt .category-name { width: 92px; flex-shrink: 0; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  #screen-stt .category-bar-track { flex: 1; height: 7px; background: var(--bg); border-radius: 100px; overflow: hidden; }
  #screen-stt .category-bar-fill { height: 100%; border-radius: 100px; }
  #screen-stt .category-pct { width: 34px; text-align: right; font-size: 12.5px; font-weight: 700; }
  #screen-stt .segment { display: flex; background: #E5DDC8; border-radius: 12px; padding: 3px; margin-bottom: 14px; }
  #screen-stt .segment button { flex: 1; border: none; background: transparent; font-family: inherit; font-size: 13.5px; font-weight: 700; color: var(--ink-soft); padding: 9px 0; border-radius: 9px; cursor: pointer; }
  #screen-stt .segment button.active { background: var(--card); color: var(--ink); }
  #screen-stt .sub-view { display: none; }
  #screen-stt .sub-view.active { display: block; }
  #screen-stt .card { background: var(--card); border-radius: 18px; padding: 6px 0; }
  #screen-stt .rating-header { display: flex; align-items: center; gap: 12px; padding: 8px 16px 4px; }
  #screen-stt .rh-name { flex: 1; font-size: 11px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; }
  #screen-stt .rh-metrics { display: flex; gap: 14px; }
  #screen-stt .rh-metric { width: 42px; text-align: right; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); }
  #screen-stt .rating-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  #screen-stt .rating-row:last-child { border-bottom: none; }
  #screen-stt .rank { width: 16px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  #screen-stt .dot { width: 9px; height: 9px; border-radius: 50%; }
  #screen-stt .dot.green { background: var(--green); }
  #screen-stt .dot.yellow { background: var(--yellow); }
  #screen-stt .dot.red { background: var(--red); }
  #screen-stt .agent-name { flex: 1; font-size: 14.5px; font-weight: 600; }
  #screen-stt .metrics { display: flex; gap: 14px; }
  #screen-stt .m-sys { width: 42px; text-align: right; font-size: 13.5px; font-weight: 500; color: var(--ink-soft); }
  #screen-stt .m-net { width: 42px; text-align: right; font-size: 15px; font-weight: 800; }
  #screen-stt .m-net.green { color: var(--green); }
  #screen-stt .m-net.yellow { color: var(--yellow); }
  #screen-stt .m-net.red { color: var(--red); }

  /* Тренд по неделям */
  #screen-stt .weeks-chart { background: var(--card); border-radius: 18px; padding: 14px 16px; }
  #screen-stt .weeks-label { font-size: 11px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 12px; }
  #screen-stt .weeks-bars { display: flex; align-items: flex-end; gap: 8px; height: 80px; }
  #screen-stt .week-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  #screen-stt .week-bar { width: 100%; border-radius: 6px 6px 0 0; min-height: 4px; }
  #screen-stt .week-bar.filled { background: var(--amber); }
  #screen-stt .week-bar.empty { background: var(--line); }
  #screen-stt .week-pct { font-size: 11px; font-weight: 800; color: var(--ink-soft); }
  #screen-stt .week-num { font-size: 10px; color: var(--ink-soft); font-weight: 600; }
  #screen-stt .weeks-delta { font-size: 12px; font-weight: 700; margin-top: 10px; text-align: center; }

  /* ============ SCREEN: ИСТОРИЯ ============ */
  #screen-history .trend-card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 16px; }
  #screen-history .trend-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  #screen-history .trend-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); }
  #screen-history .trend-value { font-size: 14px; font-weight: 800; }
  #screen-history .trend-value.up { color: var(--green); }
  #screen-history .trend-value.down { color: var(--red); }
  #screen-history .forecast-line { font-size: 13px; font-weight: 600; color: var(--ink); margin: 10px 0 12px; }
  #screen-history .goal-track { height: 10px; background: var(--bg); border-radius: 100px; position: relative; overflow: visible; margin-bottom: 6px; }
  #screen-history .goal-fill { height: 100%; background: var(--green); border-radius: 100px; }
  #screen-history .goal-marker { position: absolute; top: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--card); border: 3px solid var(--ink); transform: translateX(-50%); }
  #screen-history .goal-labels { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-soft); font-weight: 600; }
  #screen-history .month-card { background: var(--card); border-radius: 18px; padding: 15px 16px; margin-bottom: 12px; }
  #screen-history .month-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  #screen-history .month-name { font-size: 14.5px; font-weight: 700; }
  #screen-history .month-badge { display: inline-block; font-size: 10px; font-weight: 800; color: var(--amber); background: #F8EBDB; padding: 2px 8px; border-radius: 100px; margin-top: 4px; text-transform: uppercase; }
  #screen-history .net-pct { font-size: 24px; font-weight: 800; line-height: 1; }
  #screen-history .net-pct.green { color: var(--green); }
  #screen-history .net-pct.yellow { color: var(--yellow); }
  #screen-history .net-pct.red { color: var(--red); }
  #screen-history .sys-pct { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-top: 2px; }
  #screen-history .level-bar { display: flex; height: 9px; border-radius: 100px; overflow: hidden; margin-bottom: 9px; }
  #screen-history .level-bar .seg.green { background: var(--green); }
  #screen-history .level-bar .seg.yellow { background: var(--yellow); }
  #screen-history .level-bar .seg.red { background: var(--red); }
  #screen-history .month-legend { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; line-height: 1.5; }
  #screen-history .month-legend b { color: var(--ink); font-weight: 800; }
  #screen-history .extra-line { font-size: 11px; color: var(--ink-soft); margin-top: 3px; }

  /* ============ SCREEN: ИИ-КОУЧ ============ */
  #screen-training .coach-intro { font-size: 11.5px; color: var(--ink-soft); line-height: 1.5; margin: 0 0 14px; }
  #screen-training .coach-week-toggle { display: flex; gap: 6px; background: var(--card); padding: 4px; border-radius: 12px; margin-bottom: 16px; }
  #screen-training .coach-week-btn { flex: 1; text-align: center; padding: 8px 4px; border-radius: 9px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--ink-soft); }
  #screen-training .coach-week-btn.active { background: var(--ink); color: #fff; }
  #screen-training .coach-summary-cap { font-size: 11px; color: var(--ink-soft); line-height: 1.4; margin: 0 0 8px; }
  #screen-training .coach-summary-row { display: flex; gap: 8px; margin-bottom: 6px; }
  #screen-training .coach-stat { flex: 1; border-radius: 14px; padding: 12px 8px; text-align: center; }
  #screen-training .coach-stat.green { background: var(--green-bg); }
  #screen-training .coach-stat.yellow { background: var(--yellow-bg); }
  #screen-training .coach-stat.red { background: var(--red-bg); }
  #screen-training .coach-stat.gray { background: var(--line); }
  #screen-training .coach-stat-num { font-size: 22px; font-weight: 800; line-height: 1; }
  #screen-training .coach-stat.green .coach-stat-num { color: var(--green); }
  #screen-training .coach-stat.yellow .coach-stat-num { color: var(--yellow); }
  #screen-training .coach-stat.red .coach-stat-num { color: var(--red); }
  #screen-training .coach-stat.gray .coach-stat-num { color: var(--ink-soft); }
  #screen-training .coach-stat-cap { font-size: 10px; font-weight: 700; color: var(--ink-soft); margin-top: 3px; line-height: 1.3; }
  #screen-training .coach-section-label { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); margin: 18px 0 4px; }
  #screen-training .coach-section-cap { font-size: 11px; color: var(--ink-soft); line-height: 1.4; margin: 0 0 10px; }
  #screen-training details.coach-agent-card {
    background: var(--card); border-radius: 16px; margin-bottom: 10px; overflow: hidden;
    border-left: 4px solid var(--line);
  }
  #screen-training details.coach-agent-card.level-red { border-left-color: var(--red); }
  #screen-training details.coach-agent-card.level-yellow { border-left-color: var(--yellow); }
  #screen-training details.coach-agent-card.level-green { border-left-color: var(--green); }
  #screen-training details.coach-agent-card.level-gray { border-left-color: var(--line); }
  #screen-training details.coach-agent-card summary {
    list-style: none; display: flex; align-items: center; gap: 8px; justify-content: space-between;
    padding: 13px 16px; cursor: pointer;
  }
  #screen-training details.coach-agent-card summary::-webkit-details-marker { display: none; }
  #screen-training .ca-name { font-size: 14px; font-weight: 700; flex: 1; }
  #screen-training .ca-days { font-size: 10.5px; font-weight: 700; color: var(--ink-soft); }
  #screen-training .ca-trend { font-size: 14px; font-weight: 800; }
  #screen-training .ca-trend.up { color: var(--green); }
  #screen-training .ca-trend.flat { color: var(--yellow); }
  #screen-training .ca-trend.down { color: var(--red); }
  #screen-training .ca-status { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 100px; }
  #screen-training .ca-status.red { background: var(--red-bg); color: var(--red); }
  #screen-training .ca-status.yellow { background: var(--yellow-bg); color: var(--yellow); }
  #screen-training .ca-status.green { background: var(--green-bg); color: var(--green); }
  #screen-training .ca-status.gray { background: var(--line); color: var(--ink-soft); }
  #screen-training .ca-new-signal {
    font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 100px;
    background: var(--blue-bg); color: var(--blue); white-space: nowrap;
  }
  #screen-training .coach-signals-card {
    background: var(--blue-bg); border-radius: 16px; padding: 14px 16px; margin-bottom: 16px;
  }
  #screen-training .coach-signals-label {
    font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--blue); margin-bottom: 8px;
  }
  #screen-training .coach-signal-row { font-size: 12.5px; line-height: 1.5; color: var(--ink); margin-bottom: 6px; }
  #screen-training .coach-signal-row:last-child { margin-bottom: 0; }
  #screen-training .coach-signal-agent { font-weight: 700; }
  #screen-training .coach-signals-empty { font-size: 12px; color: var(--ink-soft); }
  #screen-training .ca-body { padding: 4px 16px 14px; border-top: 1px solid var(--line); }
  #screen-training .ca-body-cap { font-size: 10.5px; color: var(--ink-soft); line-height: 1.4; margin: 10px 0 10px; }
  #screen-training .ca-response { background: var(--bg); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  #screen-training .ca-response:last-child { margin-bottom: 0; }
  #screen-training .ca-response-date { font-size: 10.5px; font-weight: 800; color: var(--ink-soft); margin-bottom: 8px; letter-spacing: 0.02em; }
  #screen-training .ca-row { display: flex; gap: 8px; margin-bottom: 7px; }
  #screen-training .ca-row:last-child { margin-bottom: 0; }
  #screen-training .ca-row-label { flex-shrink: 0; width: 60px; font-size: 9.5px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.02em; padding-top: 1px; }
  #screen-training .ca-row-text { font-size: 12.5px; line-height: 1.4; flex: 1; color: var(--ink); }
  #screen-training .ca-row.conclusion { border-top: 1px solid var(--line); padding-top: 7px; margin-top: 2px; }
  #screen-training .ca-row.conclusion .ca-row-text { font-weight: 600; }
  #screen-training .ca-score-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
  #screen-training .ca-score-dot.d1 { background: var(--red); }
  #screen-training .ca-score-dot.d2 { background: var(--yellow); }
  #screen-training .ca-score-dot.d3 { background: var(--green); }
  #screen-training .ca-no-responses { font-size: 12px; color: var(--ink-soft); text-align: center; padding: 12px 0; }
  #screen-training .coach-sv-card {
    background: #FAE7E4; border: 1px solid #F1C9C2; border-radius: 16px;
    padding: 14px 16px; margin-bottom: 16px; margin-top: 4px;
  }
  #screen-training .coach-sv-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--red); margin-bottom: 5px; }
  #screen-training .coach-sv-text { font-size: 14px; font-weight: 700; color: var(--ink); line-height: 1.4; margin-bottom: 4px; }
  #screen-training .coach-sv-cap { font-size: 10.5px; color: #99694F; line-height: 1.4; margin-bottom: 4px; }
  #screen-training .coach-feedback-row { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
  #screen-training .coach-fb-btn { background: rgba(255,255,255,0.6); border: 1px solid #F1C9C2; border-radius: 8px; padding: 5px 10px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <div class="phone">
    <div class="topbar">
      <h1 id="topTitle">Загрузка...</h1>
      <div class="top-pill" id="topPill" style="display:none"></div>
    </div>
    <div class="content" id="mainContent">
      <div class="loader"><div class="spinner"></div><span>Загрузка данных...</span></div>
    </div>
    <div class="tabbar" id="tabbar" style="display:none">
      <button class="tab active" data-screen="route" onclick="switchTab('route')"><span class="icon">🗺️</span>Маршрут</button>
      <button class="tab" data-screen="day" onclick="switchTab('day')"><span class="icon">📋</span>Итоги дня</button>
      <button class="tab" data-screen="stt" onclick="switchTab('stt')"><span class="icon">📊</span>Итоги месяца</button>
      <button class="tab" data-screen="training" onclick="switchTab('training')"><span class="icon">🧠</span>ИИ-коуч</button>
    </div>
  </div>
</div>

<script>
const API = new URLSearchParams(window.location.search).get('dev') === '1'
  ? 'https://develop-production-0a2d.up.railway.app'
  : 'https://worker-production-1dfb.up.railway.app';

const screenMeta = {
  route:    { title: 'Улучшить систему', pill: () => formatDate() },
  stt:      { title: 'Итоги месяца',               pill: () => _sttMonth || '' },
  training: { title: 'ИИ-коуч',                   pill: () => _coachPeriod || '7 дней' },
  day:      { title: 'Итоги дня',                     pill: () => formatDate() },
};

let _telegramId = null;
let _sttMonth = '';
let _sttMonthOffset = 0;   // 0 = текущий месяц, 1 = прошлый — переключатель на "Итоги месяца"
let _coachPeriod = '';
let _coachPatterns = [];
let _dayDate = new Date();   // текущая просматриваемая дата на вкладке "Итог дня"

// ГГГГ-ММ-ДД по МЕСТНОМУ времени (не toISOString — та берёт UTC и может
// сдвинуть дату на день назад/вперёд ближе к полуночи)
function _localDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function _fmtDayLabel(d) {
  const days = ['вс','пн','вт','ср','чт','пт','сб'];
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  return `${d.getDate()} ${months[d.getMonth()]} · ${days[d.getDay()]}`;
}

function _isToday(d) {
  const t = new Date();
  return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth() && d.getDate() === t.getDate();
}

function getTelegramId() {
  const p = new URLSearchParams(window.location.search);
  if (p.get('id')) return p.get('id');
  if (window.Telegram?.WebApp?.initDataUnsafe?.user?.id)
    return String(window.Telegram.WebApp.initDataUnsafe.user.id);
  return null;
}

function formatDate() {
  const d = new Date();
  const days = ['вс','пн','вт','ср','чт','пт','сб'];
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  return `${d.getDate()} ${months[d.getMonth()]} · ${days[d.getDay()]}`;
}

function safe(v, def=0) { return (v != null && !isNaN(v)) ? v : def; }
function safePct(v) { return (v != null && !isNaN(v)) ? Math.round(v) + '%' : '—'; }

function levelClass(pct) {
  return pct >= 75 ? 'green' : pct >= 50 ? 'yellow' : 'red';
}

// ВАЖНО (26.07.2026): перелистывание дат на вкладке "Итог дня".
// delta: -1 назад, +1 вперёд. Не пускаем в будущее и не даём уйти
// дальше 7 дней назад (столько хранится готовых снимков в базе —
// см. daily_snapshot.py RETENTION_DAYS; более старую дату сервер
// всё равно попробует посчитать на лету, но это уже медленно).
async function navDay(delta) {
  const next = new Date(_dayDate);
  next.setDate(next.getDate() + delta);
  if (next > new Date()) return;               // нельзя в будущее
  const daysBack = Math.round((new Date() - next) / 86400000);
  if (daysBack > 7) return;                     // дальше недели пока не пускаем
  _dayDate = next;
  await loadDay();
}

// 01.08.2026: переключатель "Текущий месяц/Прошлый месяц" на "Итоги
// месяца" — /api/sv/{id}/stt уже принимал month/year, тут только
// вызываем его правильно и сбрасываем кеш "Рейтинг СВ", чтобы он тоже
// пересчитался за нужный период при следующем открытии той вкладки.
async function switchSttMonth(offset) {
  _sttMonthOffset = offset;
  _svRatingLoaded = false;
  const el = document.getElementById('screen-stt');
  el.innerHTML = `<div class="loader"><div class="spinner"></div><span>Загрузка...</span></div>`;
  try {
    const now = new Date();
    const d = new Date(now.getFullYear(), now.getMonth() - offset, 1);
    const r = await fetch(`${API}/api/sv/${_telegramId}/stt?month=${d.getMonth() + 1}&year=${d.getFullYear()}`);
    if (!r.ok) throw new Error('bad response');
    const data = await r.json();
    el.innerHTML = renderStt(data);
    // Если сейчас открыт "Рейтинг СВ" — перезагрузить сразу, не дожидаясь
    // повторного переключения вкладки.
    if (document.getElementById('view-trend')?.classList.contains('active')) {
      loadSvRating();
    }
  } catch (e) {
    el.innerHTML = `<div class="empty">⚠️ Ошибка загрузки Итогов месяца</div>`;
  }
}

async function loadDay() {
  const el = document.getElementById('screen-day');
  if (!el) return;
  el.innerHTML = `<div class="loader"><div class="spinner"></div><span>Загрузка...</span></div>`;
  try {
    const ds = _localDateStr(_dayDate);
    const r = await fetch(`${API}/api/sv/${_telegramId}/today?d=${ds}`);
    if (!r.ok) throw new Error('bad response');
    const data = await r.json();
    el.innerHTML = renderDay(data);
  } catch (e) {
    el.innerHTML = `<div class="empty">⚠️ Ошибка загрузки итога дня</div>`;
  }
}

// 01.08.2026: прыжок на конкретный день по клику на чип (тот же путь,
// что navDay(), просто на абсолютную дату, а не на +1/-1 от текущей).
async function jumpToDay(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const next = new Date(y, m - 1, d);
  if (next > new Date()) return;
  _dayDate = next;
  await loadDay();
}

function switchTab(name) {
  document.querySelectorAll('.screen-panel').forEach(el => {
    el.classList.toggle('active', el.id === 'screen-' + name);
  });
  document.querySelectorAll('.tab').forEach(el => {
    el.classList.toggle('active', el.dataset.screen === name);
  });
  const meta = screenMeta[name];
  document.getElementById('topTitle').textContent = meta.title;
  const pill = document.getElementById('topPill');
  const pillText = meta.pill();
  if (pillText) {
    pill.textContent = pillText;
    pill.style.display = 'block';
  } else {
    pill.style.display = 'none';
  }
  document.getElementById('mainContent').scrollTop = 0;
}

// ============================================================
// РЕНДЕР: МАРШРУТ
// ============================================================
function renderRoute(data) {
  const agents = data.agents || [];
  const summary = data.summary || {};
  const rideWith = data.ride_with;

  let html = '';

  // С кем выехать
  if (rideWith) {
    html += `
      <div class="ride-card">
        <span class="ride-icon">🚗</span>
        <div>
          <div class="ride-title">С кем выехать сегодня</div>
          <div class="ride-name">${rideWith.agent}</div>
          <div class="ride-reason">${rideWith.reason}</div>
        </div>
      </div>`;
  }

  // Сводка
  html += `
    <div class="summary-strip">
      <div>
        <div class="ss-num">${summary.total_points || 0}</div>
        <div class="ss-text">точек у ${summary.agents_count || 0} агентов</div>
      </div>
      <div class="ss-divider"></div>
      <div class="ss-explainer">
        Точки с 2+ пропусками заказов подряд и/или заказы вне маршрута
        <span class="ss-explainer-sub">Месяц ни при чём — считаем последние визиты подряд</span>
      </div>
    </div>`;

  if (agents.length === 0) {
    html += '<div class="empty">Проблемных точек нет 🎉</div>';
  }

  agents.forEach(agent => {
    const survey = agent.survey || {};
    const points = agent.points || [];
    const hasSurvey = survey.filled;
    const badgeHtml = !hasSurvey
      ? `<span class="unfilled-badge">опросник не заполнен</span>` : '';

    html += `
      <details class="agent-group ${agent.severity === 'high' ? 'severity-high' : 'severity-mid'}">
        <summary>
          <span class="name">${agent.name}</span>
          <span class="meta">${badgeHtml}<span class="count">${points.length} точки</span><span class="chevron">▶</span></span>
        </summary>`;

    // Блок коуч-контекста
    if (hasSurvey) {
      const scoreClass = survey.ai_score === 3 ? 'green' : survey.ai_score === 2 ? 'yellow' : 'red';
      const scoreLabel = survey.ai_status || '—';
      html += `
        <div class="coach-context">
          <div class="coach-context-label">🧠 Вчера про ${survey.hard_point || '—'}</div>
          <div class="coach-context-row">
            <span class="coach-context-key">Что помешало:</span>
            <span class="coach-context-val">«${survey.reason || '—'}»</span>
          </div>
          <div class="coach-context-row">
            <span class="coach-context-key">Действие:</span>
            <span class="coach-context-val">«${survey.action || '—'}»</span>
          </div>
          <div class="coach-context-row">
            <span class="coach-context-key">Помощь коллеге:</span>
            <span class="coach-context-val">«${survey.seed || '—'}»</span>
          </div>
          <div class="coach-context-divider"></div>
          <div class="coach-context-score ${scoreClass}">${scoreLabel}</div>
        </div>`;
    } else if (survey.date === null) {
      // Нет ответа вообще — ничего не показываем
    } else {
      html += `<div class="survey-unfilled">Опросник за вчера не заполнен</div>`;
    }

    // Таблица точек
    html += `<div class="grid-head"><span>Точка</span><span>2</span><span>3+</span><span>Вне м.</span></div>`;
    points.forEach(pt => {
      html += `
        <div class="grid-row">
          <span class="point-name">${pt.client ? `<span style="font-weight:700">${pt.client}</span><br><span style="font-size:11px;font-weight:400;color:var(--ink-soft)">${pt.name}</span>` : pt.name}</span>
          <span class="mark">${pt.missed_2 ? '<span class="mark-dot two"></span>' : ''}</span>
          <span class="mark">${pt.missed_3plus ? '<span class="mark-dot three"></span>' : ''}</span>
          <span class="offroute-num ${pt.off_route === 0 ? 'empty' : ''}">${pt.off_route > 0 ? pt.off_route : '—'}</span>
        </div>`;
    });

    html += `</details>`;
  });

  return html;
}

// ============================================================
// РЕНДЕР: СТТ
// ============================================================
function renderStt(data) {
  _sttMonth = data.month || '';
  const lv = levelClass(data.clean_stt || 0);
  const lvSys = levelClass(data.system_stt || 0);

  // Категории
  // 19.08.2026 (исправлено): было data.system_orders (только системные
  // заказы, без учёта вне маршрута) — знаменатель категорий должен быть
  // РЕАЛЬНЫМ числом заказов (система+вне маршрута), которое сервер уже
  // правильно считает и присылает в каждом c.total. count тоже теперь
  // берётся готовым из c.orders, а не восстанавливается округлением
  // c.pct*total/100 (источник лишней погрешности).
  const catsHtml = (data.categories || []).map(c => {
    const color = c.pct >= 75 ? 'var(--green)' : c.pct >= 50 ? 'var(--yellow)' : 'var(--red)';
    return `
    <div class="category-row">
      <span class="category-name">${c.name}</span>
      <div class="category-bar-track"><div class="category-bar-fill" style="width:${c.pct}%;background:${color}"></div></div>
      <span style="font-size:11px;color:var(--ink-soft);white-space:nowrap">${c.orders} из ${c.total}</span>
      <span class="category-pct" style="color:${color}">${c.pct}%</span>
    </div>`;
  }).join('');

  // Рейтинг — 13.08.2026: карточки вместо двух таблиц, тот же паттерн, что
  // уже сделан для ТМ (Итоги месяца) — единый балл (avg_score, среднее
  // системная+чистая+категории), дельта к прошлому месяцу, "Глаз ТМ"
  // (если этот торговый попал в ТОП-5 фокуса своего территориального
  // менеджера — показать ту же формулу, что видна ТМ на "Маршрут").
  function svBadge(ok) {
    return `<span style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:800;flex-shrink:0;background:${ok?'var(--green-bg)':'var(--red-bg)'};color:${ok?'var(--green)':'var(--red-dark)'}">${ok?'✓':'✗'}</span>`;
  }

  function tmFocusBlock(tf) {
    if (!tf) return '';
    return `<details style="background:var(--amber-bg);border-radius:10px;margin-top:10px;overflow:hidden">
      <summary style="list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:12px;font-weight:700;color:var(--amber)">👁 Глаз ТМ — в фокусе территории</span>
        <span style="font-size:11px;color:var(--amber)">▶</span>
      </summary>
      <div style="padding:0 12px 12px;font-size:11px">
        <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(217,138,61,.15)"><span style="color:var(--amber);opacity:.85">План визитов (мес)</span><span style="font-weight:700;color:var(--amber)">${tf.plan}</span></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(217,138,61,.15)"><span style="color:var(--amber);opacity:.85">Средний по команде</span><span style="font-weight:700;color:var(--amber)">${tf.team_average_plan}</span></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(217,138,61,.15)"><span style="color:var(--amber);opacity:.85">Требуемый план заказов = ${tf.base}×75%</span><span style="font-weight:700;color:var(--amber)">${tf.need_orders}</span></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(217,138,61,.15)"><span style="color:var(--amber);opacity:.85">Заказов по факту</span><span style="font-weight:700;color:var(--amber)">${tf.orders}</span></div>
        <div style="display:flex;justify-content:space-between;padding-top:6px;margin-top:2px;font-size:12px"><span style="font-weight:800;color:var(--amber)">Дефицит заказов</span><span style="font-weight:800;color:var(--red-dark);font-size:14px">${tf.deficit_orders}</span></div>
      </div>
    </details>`;
  }

  function svRatingCard(r, rank) {
    const isBest = rank === 1;
    const color = r.avg_score >= 75 ? 'var(--green)' : r.avg_score >= 50 ? 'var(--yellow)' : 'var(--red)';
    const chips = Object.entries(r.categories || {}).map(([name, v]) => {
      const c = v >= 75 ? 'var(--green)' : v >= 50 ? 'var(--yellow)' : 'var(--red)';
      const bg = v >= 75 ? 'var(--green-bg)' : 'var(--yellow-bg)';
      return `<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:${bg};color:${c}">${name} ${v}%</span>`;
    }).join('');
    let deltaHtml = '';
    if (r.delta !== null && r.delta !== undefined) {
      const up = r.delta >= 0;
      deltaHtml = `<span style="font-size:11px;font-weight:700;color:${up?'var(--green)':'var(--red-dark)'}">${up?'+':''}${r.delta}%</span>`;
    } else if (data.is_current_month) {
      deltaHtml = `<span style="font-size:11px;font-weight:600;color:var(--ink-soft)">впервые в рейтинге</span>`;
    }
    return `<div class="card" style="padding:16px;margin-bottom:10px;${isBest?'background:var(--green-bg)':''}">
      ${isBest ? `<p style="font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase;margin:0 0 8px">Лучший результат — ${data.month || ''}</p>` : `<p style="font-size:11px;font-weight:700;color:var(--ink-soft);margin:0 0 8px">#${rank}</p>`}
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:${isBest?16:15}px;font-weight:800">${r.agent}</span>
        <div style="text-align:right"><span style="display:block;font-size:${isBest?22:18}px;font-weight:800;color:${isBest?'var(--green)':'var(--ink)'}">${r.avg_score}%</span>${deltaHtml}</div>
      </div>
      <p style="font-size:13px;color:var(--ink-soft);margin:8px 0">Системная ${r.sys}% · Чистая ${r.net}% · Вне ${r.off > 0 ? '−' + r.off : '—'}</p>
      ${pakbMiniBar(r.pakb)}
      <div style="display:flex;gap:6px;flex-wrap:wrap">${chips}</div>
      ${tmFocusBlock(r.tm_focus)}
    </div>`;
  }

  function renderSvRatingCards() {
    const rows = data.rating || [];
    const visible = Math.min(window._svRatingVisible || 5, rows.length);
    const cards = rows.slice(0, visible).map((r, i) => svRatingCard(r, i + 1)).join('');
    const showMore = visible < rows.length
      ? `<button onclick="showMoreSvRating()" style="display:block;width:100%;font-size:13px;font-weight:700;padding:12px;border-radius:12px;border:1px dashed var(--ink-soft);background:transparent;color:var(--ink-soft);cursor:pointer;font-family:inherit;margin-top:4px">+5 (ещё ${rows.length - visible})</button>`
      : '';
    return (cards || '<div style="text-align:center;padding:20px;color:var(--ink-soft);font-size:13px">Нет данных</div>') + showMore;
  }
  window.renderSvRatingCards = renderSvRatingCards;

  // Тренд по неделям
  const weeks = data.trend_weekdays || data.trend_weeks || [];
  const posWeeks = weeks.filter(w => !w.is_current && !w.current && (w.clean_stt || w.clean_pct) !== null && (w.clean_stt || w.clean_pct) > 0);
  const maxVal = Math.max(...weeks.filter(w => (w.clean_pct || w.clean_stt) != null && (w.clean_pct || w.clean_stt) > 0).map(w => w.clean_pct || w.clean_stt || 0), 1);
  const bestWeek = posWeeks.length > 0 ? posWeeks.reduce((a, b) => (a.clean_pct||a.clean_stt||0) > (b.clean_pct||b.clean_stt||0) ? a : b) : null;

  const barsHtml = weeks.map(w => {
    const isCurrent = w.is_current || w.current;
    const isBest = bestWeek && (w.weekday === bestWeek.weekday || w.week === bestWeek.week);
    const isZero = (w.clean_pct || w.clean_stt) === 0 || (w.clean_pct ?? w.clean_stt) === null;
    const lbl = w.label ? w.label.split(' ')[0] : 'Нед ' + w.week;
    const offTxt = w.week_off > 0 ? `<span style="font-size:9px;font-weight:800;color:rgba(255,255,255,.85)">−${w.week_off}</span>` : '';
    const offTxtRed = w.week_off > 0 ? `<span style="font-size:9px;font-weight:800;color:var(--red)">−${w.week_off}</span>` : '';
    const offTxtDash = w.week_off > 0 ? `<span style="font-size:9px;font-weight:800;color:#C4B89A">−${w.week_off}</span>` : '';

    if ((w.clean_pct ?? w.clean_stt) === null) {
      return `<div class="week-col">
        <div class="week-pct" style="color:var(--ink-soft)">—</div>
        <div class="week-bar" style="height:14px;background:var(--line);opacity:.4;border-radius:6px 6px 0 0"></div>
        <div class="week-num">${lbl}</div>
      </div>`;
    }
    if (isCurrent) {
      const h = isZero ? 14 : Math.max(16, Math.round((w.clean_pct || w.clean_stt || 0) / maxVal * 70));
      const pctColor = isZero ? 'var(--ink-soft)' : 'var(--ink-soft)';
      return `<div class="week-col">
        <div class="week-pct" style="color:${pctColor}">${Math.round(w.clean_pct ?? w.clean_stt ?? 0)}%</div>
        <div class="week-bar" style="height:${h}px;border-radius:6px 6px 0 0;border:1.5px dashed #C4B89A;border-bottom:none;display:flex;align-items:center;justify-content:center">${offTxtDash}</div>
        <div class="week-num">${lbl}</div>
      </div>`;
    }
    if (isZero) {
      return `<div class="week-col">
        <div class="week-pct" style="color:var(--red)">0%</div>
        <div class="week-bar" style="height:14px;background:#FAE7E4;border:1px solid #F1C9C2;border-radius:6px 6px 0 0;display:flex;align-items:center;justify-content:center">${offTxtRed}</div>
        <div class="week-num">${lbl}</div>
      </div>`;
    }
    const h = Math.max(16, Math.round((w.clean_pct || w.clean_stt || 0) / maxVal * 70));
    const isWorst = bestWeek && weeks.length > 1 && (w.clean_pct || w.clean_stt || 0) === Math.min(...weeks.filter(x => (x.clean_pct || x.clean_stt || 0) > 0).map(x => x.clean_pct || x.clean_stt || 0));
    const barBg = isBest ? 'var(--green)' : isWorst ? 'var(--red)' : '#C4B89A';
    const pctColor = isBest ? 'var(--green)' : isWorst ? 'var(--red)' : '#6B6358';
    const bestMark = isBest ? ' ✦' : '';
    const wkStyle = isBest ? `color:var(--green);font-weight:800` : isWorst ? `color:var(--red);font-weight:800` : '';
    const colWrap = isBest ? `style="background:var(--green-bg);border-radius:6px;padding:2px 0"` : isWorst ? `style="background:var(--red-bg);border-radius:6px;padding:2px 0"` : '';
    const deltaVal = w.delta != null ? (w.delta > 0 ? '+' + w.delta : String(w.delta)) : '';
    const deltaColor = w.delta > 0 ? 'var(--green)' : w.delta < 0 ? 'var(--red)' : 'var(--ink-soft)';
    return `<div class="week-col" ${colWrap}>
      <div class="week-pct" style="color:${pctColor}">${Math.round(w.clean_pct ?? w.clean_stt ?? 0)}%${bestMark}</div>
      <div class="week-bar" style="height:${h}px;background:${barBg};border-radius:6px 6px 0 0;display:flex;align-items:center;justify-content:center">${offTxt}</div>
      <div class="week-num" style="${wkStyle}">${lbl}</div>
      ${deltaVal ? `<div style="font-size:9px;font-weight:700;color:${deltaColor}">${deltaVal}</div>` : '<div style="font-size:9px"> </div>'}
    </div>`;
  }).join('');

  // Блок сравнения с прошлым месяцем
  const cmp = data.prev_month_compare || null;
  let compareHtml = '';
  if (cmp) {
    const cleanDelta = cmp.clean_delta || 0;
    const offDelta = cmp.off_delta || 0;
    const cleanUp = cleanDelta >= 0;
    const offGood = offDelta <= 0;
    const cmpBg = (cleanUp && offGood) ? 'var(--green-bg)' : (!cleanUp && !offGood) ? 'var(--red-bg)' : '#F5F0EB';
    const cmpTitle = (cleanUp && offGood) ? 'color:#1A5C33' : (!cleanUp && !offGood) ? 'color:#7C1A1A' : 'color:var(--ink-soft)';
    const daysNote = '';
    compareHtml = `
      <div style="border-radius:10px;padding:9px 11px;margin-top:10px;background:${cmpBg}">
        <div style="font-size:10px;font-weight:700;margin-bottom:7px;${cmpTitle}">${cmp.current_label} (${cmp.current_days} дн) vs ${cmp.prev_label} (${cmp.prev_days} дн)</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;align-items:baseline;font-size:12px;font-weight:600;margin-bottom:5px">
          <span style="color:var(--ink)">Чистая: <b>${cmp.current_clean}%</b></span>
          <span style="color:var(--ink-soft);text-align:center">${cmp.prev_label || cmp.prev_label_short || ''}: ${cmp.prev_clean}%</span>
          <span style="text-align:right;font-size:13px;font-weight:800;color:${cleanUp ? 'var(--green)' : 'var(--red)'}">${cleanUp ? '↑' : '↓'} ${cleanUp ? '+' : ''}${cleanDelta}%</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;align-items:baseline;font-size:12px;font-weight:600">
          <span style="color:var(--ink)">Вне: <b style="color:var(--red)">−${cmp.current_off}</b></span>
          <span style="color:var(--ink-soft);text-align:center">${cmp.prev_label || cmp.prev_label_short || ''}: −${cmp.prev_off || 0}</span>
          <span style="text-align:right;font-size:13px;font-weight:800;color:${offGood ? 'var(--green)' : 'var(--red)'}">${offGood ? '↓' : '↑'} ${offGood ? '' : '+'}${offDelta} вне</span>
        </div>
        ${daysNote}
      </div>`;
  }

  const deltaHtml = '';

  return `
    <div class="segment">
      <button class="${_sttMonthOffset === 0 ? 'active' : ''}" onclick="switchSttMonth(0)">Текущий месяц</button>
      <button class="${_sttMonthOffset === 1 ? 'active' : ''}" onclick="switchSttMonth(1)">Прошлый месяц</button>
    </div>

    <div class="summary-card">
      <div class="summary-top-row">
        <p class="summary-label">Итог по команде</p>
        <span class="period-caption">${data.passed_visits} плановых визитов</span>
      </div>
      <div style="font-size:10px;color:var(--ink-soft);margin:-4px 0 8px;line-height:1.3">
        За период с начала месяца по вчера включительно (без сегодняшнего дня — по нему заказы ещё не закрыты)
      </div>
      <div class="dist-row">
        <div class="dist-tile">
          <div class="dist-tile-label">Системная</div>
          <div class="dist-tile-pct ${lvSys}">${data.system_stt}%</div>
          <div class="dist-tile-count">${data.system_orders} заказов</div>
        </div>
        <div class="dist-minus-chip">
          <div class="val">−${data.off_route}</div>
          <div class="cap">вне</div>
        </div>
        <div class="dist-tile">
          <div class="dist-tile-label">Чистая</div>
          <div class="dist-tile-pct ${lv}">${data.clean_stt}%</div>
          <div class="dist-tile-count">${data.clean_orders} заказов</div>
        </div>
      </div>
      ${catsHtml ? `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:4px 0 8px;">Продажи по категориям</div>${catsHtml}` : ''}
    </div>

    ${(() => {
      const tGreen = data.green || 0, tYellow = data.yellow || 0, tRed = data.red || 0;
      const tTotal = tGreen + tYellow + tRed;
      if (!tTotal) return '';
      const gp = Math.round(tGreen / tTotal * 100), yp = Math.round(tYellow / tTotal * 100), rp = Math.round(tRed / tTotal * 100);
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">
          <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);">Территория</span>
          <span style="font-size:12px;font-weight:700;color:var(--ink-soft)">ПАКБ: ${tTotal}</span>
        </div>
        <div style="display:flex;height:14px;border-radius:8px;overflow:hidden;margin-bottom:12px;">
          <div style="width:${gp}%;background:var(--green)"></div>
          <div style="width:${yp}%;background:var(--yellow)"></div>
          <div style="width:${rp}%;background:var(--red)"></div>
        </div>
        <div style="display:flex;justify-content:space-between;">
          <div style="text-align:center;flex:1"><span style="font-size:11px;color:var(--ink-soft);font-weight:600">СТТ</span><div style="font-size:15px;font-weight:800;color:var(--green)">${tGreen} <span style="font-size:11px;font-weight:600">(${gp}%)</span></div></div>
          <div style="text-align:center;flex:1"><span style="font-size:11px;color:var(--ink-soft);font-weight:600">АКБ</span><div style="font-size:15px;font-weight:800;color:var(--yellow)">${tYellow} <span style="font-size:11px;font-weight:600">(${yp}%)</span></div></div>
          <div style="text-align:center;flex:1"><span style="font-size:11px;color:var(--ink-soft);font-weight:600">Не АКБ</span><div style="font-size:15px;font-weight:800;color:var(--red)">${tRed} <span style="font-size:11px;font-weight:600">(${rp}%)</span></div></div>
        </div>
      </div>`;
    })()}

    <div class="segment">
      <button id="btn-rating" class="active" onclick="sttView('rating')">Рейтинг торговых</button>
      <button id="btn-trend" onclick="sttView('trend')">Рейтинг СВ</button>
    </div>

    <div id="view-rating" class="sub-view active">
      ${renderSvRatingCards()}
    </div>

    <div id="view-trend" class="sub-view">
      <div id="sv-rating-area">
        <div style="text-align:center;padding:20px;color:var(--ink-soft);font-size:13px;">Загрузка...</div>
      </div>
    </div>`;
}

function showMoreSvRating() {
  window._svRatingVisible = (window._svRatingVisible || 5) + 5;
  const el = document.getElementById('view-rating');
  if (el && window.renderSvRatingCards) el.innerHTML = window.renderSvRatingCards();
}

function sttView(name) {
  ['rating','trend'].forEach(n => {
    document.getElementById('view-'+n).classList.toggle('active', n === name);
    document.getElementById('btn-'+n).classList.toggle('active', n === name);
  });
  if (name === 'trend' && !_svRatingLoaded) {
    loadSvRating();
  }
}

let _svRatingLoaded = false;

function pakbMiniBar(pakb) {
  if (!pakb) return '';
  const g = pakb.green || 0, y = pakb.yellow || 0, r = pakb.red || 0;
  const total = g + y + r;
  if (!total) return '';
  const gp = Math.round(g / total * 100), yp = Math.round(y / total * 100), rp = Math.round(r / total * 100);
  return `<div style="margin:8px 0">
    <div style="display:flex;height:6px;border-radius:4px;overflow:hidden;margin-bottom:4px;">
      <div style="width:${gp}%;background:var(--green)"></div>
      <div style="width:${yp}%;background:var(--yellow)"></div>
      <div style="width:${rp}%;background:var(--red)"></div>
    </div>
    <div style="font-size:10px;color:var(--ink-soft)">ПАКБ ${total} · СТТ ${g} · АКБ ${y} · Не АКБ ${r}</div>
  </div>`;
}

async function loadSvRating() {
  const area = document.getElementById('sv-rating-area');
  try {
    const now = new Date();
    const d = new Date(now.getFullYear(), now.getMonth() - _sttMonthOffset, 1);
    const res = await fetch(`${API}/api/sv/${_telegramId}/rating-sv?month=${d.getMonth() + 1}&year=${d.getFullYear()}`);
    const data = await res.json();
    _svRatingLoaded = true;

    const rows = data.rows || [];

    if (!rows.length) {
      area.innerHTML = '<div style="text-align:center;padding:20px;color:var(--ink-soft);font-size:13px;">Нет других СВ на той же территории</div>';
      return;
    }

    const top3 = rows.slice(0, 1);
    const rest = rows.slice(1);

    function catChipsHtml(categories, muted) {
      return Object.entries(categories || {}).map(([cat, v]) => {
        if (muted) {
          return `<span style="font-size:11px;background:#F5F0E6;color:var(--ink-soft);padding:4px 9px;border-radius:8px;font-weight:600;">${cat} ${v}%</span>`;
        }
        const chipColor = v >= 75 ? 'var(--green)' : v >= 50 ? 'var(--yellow)' : 'var(--red)';
        const chipBg = v >= 75 ? 'var(--green-bg)' : v >= 50 ? 'var(--yellow-bg)' : 'var(--red-bg)';
        return `<span style="font-size:11px;background:${chipBg};color:${chipColor};padding:4px 9px;border-radius:8px;font-weight:600;">${cat} ${v}%</span>`;
      }).join('');
    }

    const top3Html = top3.map(r => {
      const shortName = r.sv.split(' ').slice(0, 2).join(' ');
      const offText = r.off > 0
        ? `<span style="color:var(--red);margin-left:4px;">(-${r.off} вне)</span>`
        : '';
      return `
        <div style="border-radius:18px;background:var(--green-bg);border:0.5px solid #3FAE6A33;padding:14px 16px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span style="font-weight:700;font-size:15px;color:var(--ink);">${shortName}</span>
            <span style="font-size:20px;font-weight:700;color:var(--green);">${r.avg.toFixed(1)}%</span>
          </div>
          <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">
            Системная ${r.system_stt.toFixed(1)}% · Чистая ${r.clean_stt.toFixed(1)}%${offText}
          </div>
          ${pakbMiniBar(r.pakb)}
          <div style="display:flex;gap:6px;flex-wrap:wrap;">${catChipsHtml(r.categories, false)}</div>
        </div>`;
    }).join('');

    const restHtml = rest.length ? `
      <div style="border-radius:18px;background:var(--card);border:0.5px solid var(--line);overflow:hidden;">
        ${rest.map((r, i) => {
          const shortName = r.sv.split(' ').slice(0, 2).join(' ');
          const offText = r.off > 0
            ? `<span style="color:var(--red);margin-left:4px;">(-${r.off} вне)</span>`
            : '';
          const borderBottom = i < rest.length - 1 ? 'border-bottom:0.5px solid var(--line);' : '';
          return `
            <div style="padding:13px 16px;${borderBottom}">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
                <span style="font-size:13.5px;font-weight:600;color:var(--ink);">${shortName}</span>
                <span style="font-size:15px;font-weight:700;color:var(--ink-soft);">${r.avg.toFixed(1)}%</span>
              </div>
              <div style="font-size:12px;color:var(--ink-soft);margin-bottom:9px;">
                Системная ${r.system_stt.toFixed(1)}% · Чистая ${r.clean_stt.toFixed(1)}%${offText}
              </div>
              ${pakbMiniBar(r.pakb)}
              <div style="display:flex;gap:6px;flex-wrap:wrap;">${catChipsHtml(r.categories, true)}</div>
            </div>`;
        }).join('')}
      </div>` : '';

    area.innerHTML = `
      <div style="font-size:13px;font-weight:700;margin:2px 0 12px;color:var(--ink);">${data.group ? 'ТМ: ' + data.group : 'Территориальный менеджер не определён'}</div>
      <div style="font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Лучший результат — ${data.month || 'этот месяц'}</div>
      ${top3Html}
      ${rest.length ? '<div style="font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px;">Команда</div>' + restHtml : ''}`;

  } catch(e) {
    area.innerHTML = '<div style="text-align:center;padding:20px;color:var(--red);font-size:13px;">Не удалось загрузить рейтинг СВ</div>';
  }
}

function renderHistory(data) {
  const tr = data.trend || {};
  let trendHtml = '';

  if (tr.avg_per_month === null || tr.avg_per_month === undefined) {
    trendHtml = `<div class="trend-card">
      <div class="forecast-line">Накапливаем историю — тренд появится после второго закрытого месяца</div>
    </div>`;
  } else if (tr.current_stt >= 75) {
    trendHtml = `<div class="trend-card"><div class="forecast-line">✅ Цель 75% достигнута</div></div>`;
  } else {
    const dir = tr.avg_per_month >= 0 ? 'up' : 'down';
    const arrow = tr.avg_per_month >= 0 ? '↗' : '↘';
    const avgText = tr.avg_per_month >= 0 ? `+${tr.avg_per_month}%` : `${tr.avg_per_month}%`;
    const goalText = tr.months_to_goal === null ? 'до цели — снижение'
      : tr.months_to_goal === 0 ? 'цель достигнута' : `до цели ~${tr.months_to_goal} мес`;
    const goalPct = Math.max(0, Math.min(100, Math.round((tr.current_stt || 0) / 75 * 100)));
    trendHtml = `
      <div class="trend-card">
        <div class="trend-row">
          <span class="trend-label">Тренд по чистой</span>
          <span class="trend-value ${dir}">${arrow} ${avgText} в мес</span>
        </div>
        <div class="forecast-line">При таком темпе — ${goalText}</div>
        <div class="goal-track">
          <div class="goal-fill" style="width:${goalPct}%"></div>
          <div class="goal-marker" style="left:${goalPct}%"></div>
        </div>
        <div class="goal-labels"><span>0%</span><span>Цель 75%</span></div>
      </div>`;
  }

  const monthsHtml = (data.history || []).map(mo => {
    const lv = mo.clean_stt < 0 ? 'red' : levelClass(mo.clean_stt);
    const total = (mo.green || 0) + (mo.yellow || 0) + (mo.red || 0);
    const gf = total ? mo.green/total*100 : 0;
    const yf = total ? mo.yellow/total*100 : 0;
    const rf = total ? mo.red/total*100 : 0;
    return `
      <div class="month-card">
        <div class="month-top">
          <div>
            <div class="month-name">${mo.month}</div>
            ${mo.is_current ? '<div class="month-badge">в процессе</div>' : ''}
          </div>
          <div>
            <div class="net-pct ${lv}">${mo.clean_stt}%</div>
            <div class="sys-pct">сист ${mo.stt}%</div>
          </div>
        </div>
        <div class="level-bar">
          <div class="seg green" style="flex:${gf}"></div>
          <div class="seg yellow" style="flex:${yf}"></div>
          <div class="seg red" style="flex:${rf}"></div>
        </div>
        <div class="month-legend">
          <b>${mo.green}</b> в системе · <b>${mo.yellow}</b> потенциал · <b>${mo.red}</b> провал
        </div>
        ${(mo.not_in_route > 0 || mo.not_worked > 0) ? `
        <div class="extra-line">
          ${mo.not_in_route > 0 ? `Не в маршруте: ${mo.not_in_route}` : ''}
          ${mo.not_in_route > 0 && mo.not_worked > 0 ? ' · ' : ''}
          ${mo.not_worked > 0 ? `Не сработало: ${mo.not_worked}` : ''}
        </div>` : ''}
      </div>`;
  }).join('');

  return trendHtml + monthsHtml;
}

let _coachWeek = 'current';

function _coachTrendArrow(dots) {
  if (!dots || dots.length < 2) return '';
  const half = Math.floor(dots.length / 2) || 1;
  const firstAvg = dots.slice(0, half).reduce((a, b) => a + b, 0) / half;
  const lastAvg = dots.slice(-half).reduce((a, b) => a + b, 0) / half;
  if (lastAvg > firstAvg) return '<span class="ca-trend up">↑</span>';
  if (lastAvg < firstAvg) return '<span class="ca-trend down">↓</span>';
  return '<span class="ca-trend flat">→</span>';
}

function renderCoach(data) {
  _coachPeriod = data.period || '7 дней';
  _coachPatterns = data.patterns_for_topic || [];
  _coachWeek = data.week || 'current';
  const ts = data.team_summary || {};

  const newSignals = data.new_signals || [];
  const newSignalsHtml = newSignals.length === 0
    ? `<div class="coach-signals-empty">Новых сигналов на этой неделе нет.</div>`
    : newSignals.map(s => `
        <div class="coach-signal-row">
          <span class="coach-signal-agent">${s.agent}:</span> ${s.reason}
        </div>`).join('');

  const agentsHtml = (data.agents || []).map(a => {
    const responses = a.last_responses || [];
    const bodyHtml = responses.length === 0
      ? `<div class="ca-no-responses">Ещё не отвечал(а) на этой неделе.</div>`
      : responses.map(r => {
          const scoreCls = r.ai_score >= 3 ? 'd3' : r.ai_score === 2 ? 'd2' : 'd1';
          return `
            <div class="ca-response">
              <div class="ca-response-date">${r.date || ''}</div>
              <div class="ca-row">
                <div class="ca-row-label">Причина</div>
                <div class="ca-row-text">${r.reason || '—'}</div>
              </div>
              <div class="ca-row">
                <div class="ca-row-label">Действие</div>
                <div class="ca-row-text">${r.action || '—'}</div>
              </div>
              <div class="ca-row">
                <div class="ca-row-label">Помощь</div>
                <div class="ca-row-text">${r.seed || '—'}</div>
              </div>
              ${r.ai_reasoning ? `
              <div class="ca-row conclusion">
                <div class="ca-row-label">Вывод ИИ</div>
                <div class="ca-row-text"><span class="ca-score-dot ${scoreCls}"></span>${r.ai_reasoning}</div>
              </div>` : ''}
            </div>`;
        }).join('');

    return `
      <details class="coach-agent-card level-${a.status_color}">
        <summary>
          <span class="ca-name">${a.name}</span>
          <span class="ca-days">${a.days_answered} ${a.days_answered === 1 ? 'день' : 'дн.'}</span>
          ${_coachTrendArrow(a.trend_dots)}
          ${a.new_signal ? '<span class="ca-new-signal">новый сигнал</span>' : ''}
          <span class="ca-status ${a.status_color}">${a.status}</span>
        </summary>
        <div class="ca-body">
          <div class="ca-body-cap">Последние ответы — что написал(а) агент и вывод ИИ по каждому дню:</div>
          ${bodyHtml}
        </div>
      </details>`;
  }).join('');

  return `
    <p class="coach-intro">
      Как думает команда, а не только что сделала. Каждый вечер агент
      отвечает на 3 коротких вопроса — ИИ определяет, в каком состоянии
      он сейчас: ждёт, разбирается или уже действует.
    </p>

    <div class="coach-week-toggle">
      <div class="coach-week-btn ${_coachWeek === 'current' ? 'active' : ''}" onclick="switchCoachWeek('current')">Текущая неделя</div>
      <div class="coach-week-btn ${_coachWeek === 'previous' ? 'active' : ''}" onclick="switchCoachWeek('previous')">Прошлая неделя</div>
    </div>

    <p class="coach-summary-cap">Считается по всем накопленным ответам — без правила «минимум 3 из 5». Один ответ есть — уже есть статус.</p>
    <div class="coach-summary-row">
      <div class="coach-stat green">
        <div class="coach-stat-num">${ts.acts || 0}</div>
        <div class="coach-stat-cap">Действует</div>
      </div>
      <div class="coach-stat yellow">
        <div class="coach-stat-num">${ts.grows || 0}</div>
        <div class="coach-stat-cap">Анализирует</div>
      </div>
      <div class="coach-stat red">
        <div class="coach-stat-num">${ts.waits || 0}</div>
        <div class="coach-stat-cap">Ждёт</div>
      </div>
      <div class="coach-stat gray">
        <div class="coach-stat-num">${ts.collecting || 0}</div>
        <div class="coach-stat-cap">Нет ответов</div>
      </div>
    </div>

    <div class="coach-signals-card">
      <div class="coach-signals-label">Новые сигналы за неделю</div>
      ${newSignalsHtml}
    </div>

    <div class="coach-section-label">По агентам</div>
    <p class="coach-section-cap">Нажмите на агента — увидите его последние ответы и что решил ИИ.</p>
    ${agentsHtml}

    <div class="coach-section-label">Программа обучения на неделю</div>
    <p class="coach-section-cap">Собирается из реальных слов команды — не из общей теории.</p>
    <div class="coach-sv-card">
      <div class="coach-sv-label">Тема обучения по результатам недели</div>
      <div class="coach-sv-text" id="coach-topic">Ещё не сформирована</div>
      <div style="border-top:1px solid #F1C9C2;margin:10px 0;"></div>
      <div id="program-area">
        <button onclick="generateProgram()" style="width:100%;background:#A93B30;color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;">
          ✦ Сгенерировать программу обучения
        </button>
      </div>
      <div class="coach-feedback-row">
        <button class="coach-fb-btn" onclick="sendFeedback('up')">👍</button>
        <button class="coach-fb-btn" onclick="sendFeedback('down')">👎</button>
        <span style="font-size:11px;color:#993C1D;font-weight:600;margin-left:4px;">Провели встречу по этой теме?</span>
      </div>
    </div>`;
}

async function switchCoachWeek(week) {
  if (week === _coachWeek) return;
  const container = document.getElementById('screen-training');
  if (!container) return;
  try {
    const res = await fetch(`${API}/api/sv/${_telegramId}/coach/week?week=${week}`);
    if (!res.ok) throw new Error(`request failed: ${res.status}`);
    const data = await res.json();
    container.innerHTML = renderCoach(data);
  } catch (e) {
    console.error('switchCoachWeek error', e);
  }
}

// ============================================================
// ГЕНЕРАЦИЯ ПРОГРАММЫ ОБУЧЕНИЯ
// ============================================================
async function generateProgram() {
  const area = document.getElementById('program-area');
  area.innerHTML = '<div style="text-align:center;padding:10px;color:var(--ink-soft);font-size:13px;">⏳ Анализирую ответы команды…</div>';

  try {
    const res = await fetch(
      `${API}/api/sv/${_telegramId}/coach/generate-program?week=${_coachWeek}`,
      { method: 'POST' }
    );
    if (!res.ok) throw new Error(`request failed: ${res.status}`);

    const data = await res.json();
    const steps = data.steps || [];
    if (!steps.length) throw new Error('no steps');

    const topicEl = document.getElementById('coach-topic');
    if (topicEl && data.topic) topicEl.textContent = data.topic;

    let html = '<div style="display:flex;flex-direction:column;gap:8px;margin-top:2px;">';
    steps.forEach(s => {
      html += `
        <div style="background:#fff;border-radius:10px;padding:10px 12px;border:1px solid #F1C9C2;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
            <div style="width:22px;height:22px;border-radius:50%;background:#A93B30;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${s.num}</div>
            <div style="font-size:12.5px;font-weight:800;color:#2C2A26;">${s.title}</div>
          </div>
          <div style="font-size:12px;color:#6B5B4E;line-height:1.45;padding-left:30px;">${s.action}</div>
        </div>`;
    });
    html += '</div>';
    area.innerHTML = html;

  } catch(e) {
    area.innerHTML = `<div style="font-size:12px;color:#A93B30;padding:8px 0;">
      Ошибка генерации.
      <button onclick="generateProgram()" style="background:none;border:none;color:#A93B30;font-weight:700;cursor:pointer;text-decoration:underline;font-size:12px;">Попробовать ещё раз</button>
    </div>`;
  }
}

// ============================================================
// FEEDBACK СВ
// ============================================================
async function sendFeedback(rating) {
  if (!_telegramId) return;
  try {
    await fetch(`${API}/api/sv/${_telegramId}/coach/feedback?conducted=true&rating=${rating}`, {
      method: 'POST'
    });
    const row = document.querySelector('.coach-feedback-row');
    if (row) row.innerHTML = `<span style="font-size:12px;color:var(--green);font-weight:700;">✅ Оценка записана</span>`;
  } catch(e) {
    console.error('feedback error', e);
  }
}

// ============================================================
// RENDER — Итог дня
// ============================================================
function renderDay(data) {
  const team = data.team || {};
  const agents = data.agents || [];
  const tileStyle = 'background:var(--bg);border-radius:10px;padding:10px 12px;';

  // 01.08.2026: 3 кнопки периода (Сегодня/Прошлый день/Неделя назад)
  // вместо строки из 7 чипов — проще и понятнее для СВ.
  const periods = [
    { key: 'today',     label: 'Сегодня',      date: new Date() },
    { key: 'yesterday', label: 'Прошлый день', date: (() => { const d = new Date(); d.setDate(d.getDate()-1); return d; })() },
    { key: 'weekago',   label: 'Неделя назад', date: (() => { const d = new Date(); d.setDate(d.getDate()-7); return d; })() },
  ];
  const activePeriod = periods.find(p =>
    p.date.getFullYear() === _dayDate.getFullYear() &&
    p.date.getMonth()    === _dayDate.getMonth()    &&
    p.date.getDate()     === _dayDate.getDate()
  );
  const activePeriodKey = activePeriod ? activePeriod.key : null;
  const navHtml = `<div style="font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;">${_fmtDayLabel(_dayDate)}</div>
    <div style="display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);">
      ${periods.map(p => `<div style="flex:1;text-align:center;padding:8px 4px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;${p.key===activePeriodKey?'background:var(--ink);color:#fff;':'color:var(--ink-soft);'}" onclick="jumpToDay('${_localDateStr(p.date)}')">${p.label}</div>`).join('')}
    </div>`;


  const statsHtml = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
    <div style="${tileStyle}"><div style="font-size:20px;font-weight:700">${team.planned || 0}</div><div style="font-size:10px;color:var(--ink-soft);margin-top:2px">плановых</div></div>
    <div style="${tileStyle}"><div style="font-size:20px;font-weight:700">${team.orders || 0} <span style="font-size:13px;color:var(--red);font-weight:700">−${team.off_route || team.off || 0} вне</span></div><div style="font-size:10px;color:var(--ink-soft);margin-top:2px">заказов</div></div>
    <div style="${tileStyle}"><div style="font-size:20px;font-weight:700;color:var(--amber)">${team.system_pct || team.system_stt || 0}%</div><div style="font-size:10px;color:var(--ink-soft);margin-top:2px">системная</div></div>
    <div style="${tileStyle}"><div style="font-size:20px;font-weight:700;color:var(--amber)">${team.clean_pct || team.clean_stt || 0}%</div><div style="font-size:10px;color:var(--ink-soft);margin-top:2px">чистая</div></div>
  </div>`;
  const agentsHtml = agents.map(a => {
    const clean = a.clean_pct != null ? a.clean_pct : (a.planned > 0 ? Math.round(Math.max(0, a.orders - (a.off_route || a.off || 0)) / a.planned * 100) : 0);
    const dotColor = clean >= 75 ? 'var(--green)' : clean >= 50 ? 'var(--yellow)' : 'var(--red)';
    const sttColor = dotColor;
    const shortName = a.name.split(' ').slice(0, 2).join(' ');
    const ptCount = (a.control_points || []).length;
    const ptDone = (a.control_points || []).filter(p => p.visited_today || p.had_order || p.visited).length;
    const ptLabel = ptCount > 0 ? `контрольных точек: ${ptDone} из ${ptCount} сделано` : 'нет контрольных точек';
    const aTile = 'background:var(--bg);border-radius:8px;padding:7px 10px;text-align:center;';
    const tilesHtml = `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px;"><div style="${aTile}"><div style="font-size:15px;font-weight:700">${a.planned}</div><div style="font-size:9px;color:var(--ink-soft)">визитов</div></div><div style="${aTile}"><div style="font-size:15px;font-weight:700">${a.orders}</div><div style="font-size:9px;color:var(--ink-soft)">заказов</div></div><div style="${aTile}"><div style="font-size:15px;font-weight:700;color:var(--red)">−${a.off_route || a.off || 0}</div><div style="font-size:9px;color:var(--ink-soft)">вне</div></div></div>`;
    const sortedPoints = [...(a.control_points || [])].sort((p1, p2) => {
      const done1 = (p1.visited_today || p1.had_order || p1.visited) ? 1 : 0;
      const done2 = (p2.visited_today || p2.had_order || p2.visited) ? 1 : 0;
      return done2 - done1;
    });
    const pointsHtml = sortedPoints.map(p => {
      const result = (p.visited_today || p.had_order || p.visited) ? '<span style="color:var(--green);font-weight:700;font-size:14px">✓</span>' : '<span style="color:var(--red);font-weight:700;font-size:14px">✕</span>';
      const nameLine = p.client ? `<div style="font-size:12px;font-weight:700">${p.client}</div><div style="font-size:10px;color:var(--ink-soft)">${p.name}</div>` : `<div style="font-size:12px">${p.name}</div>`;
      return `<div style="display:flex;align-items:flex-start;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);gap:8px"><div>${nameLine}</div>${result}</div>`;
    }).join('');
    return `<details style="border-bottom:1.5px solid var(--line)"><summary style="list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:12px 0"><div style="display:flex;align-items:center;gap:8px;flex:1"><span style="width:8px;height:8px;border-radius:50%;background:${dotColor};flex-shrink:0;display:inline-block"></span><div><div style="font-size:13px;font-weight:700">${shortName}</div><div style="font-size:11px;color:var(--ink-soft)">${ptLabel}</div></div></div><div style="display:flex;align-items:center;gap:6px;flex-shrink:0"><div style="text-align:right"><span style="font-size:15px;font-weight:700;color:${sttColor}">${clean}%</span><div style="font-size:8px;color:var(--ink-soft);font-weight:600">чистая дистрибуция</div></div><span style="font-size:10px;color:var(--ink-soft)">▶</span></div></summary><div style="padding:4px 0 10px 16px">${tilesHtml}${pointsHtml}</div></details>`;
  }).join('');
  const cardStyle = 'background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;';
  const labelStyle = 'font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:10px;';

  // 01.08.2026: доля заказов с категорией от всех заказов команды за
  // день — сразу после блока "Команда за день", до списка по торговым.
  const catShares = data.cat_shares_today || {};
  const totalOrdersToday = data.total_orders_today || 0;
  const catRows = Object.entries(catShares).map(([name, v]) => {
    const barColor = v.pct >= 75 ? 'var(--green)' : v.pct >= 50 ? 'var(--yellow)' : 'var(--red)';
    return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;">
      <span style="width:70px;flex-shrink:0;font-size:12.5px;font-weight:600;color:var(--ink-soft);">${name}</span>
      <div style="flex:1;height:7px;background:var(--bg);border-radius:100px;overflow:hidden;"><div style="height:100%;border-radius:100px;width:${v.pct}%;background:${barColor}"></div></div>
      <span style="width:34px;text-align:right;font-size:12.5px;font-weight:700;">${v.pct}%</span>
    </div>`;
  }).join('');
  const categoriesHtml = Object.keys(catShares).length
    ? `<div style="${cardStyle}"><div style="${labelStyle}">🏷️ Категории</div><div style="font-size:10.5px;color:var(--ink-soft);margin:-6px 0 8px;">доля заказов с категорией от всех заказов команды сегодня (${totalOrdersToday})</div>${catRows}</div>`
    : '';

  return `${navHtml}<div style="${cardStyle}"><div style="${labelStyle}">Команда за день</div>${statsHtml}</div>${categoriesHtml}<div style="${cardStyle}"><div style="${labelStyle}">По торговым</div>${agentsHtml}</div>`;
}

// ============================================================
// MAIN — загрузка данных
// ============================================================
async function main() {
  _telegramId = getTelegramId();
  if (!_telegramId) {
    document.getElementById('topTitle').textContent = 'Нет доступа';
    document.getElementById('mainContent').innerHTML =
      '<div class="empty">Откройте через Telegram</div>';
    return;
  }

  // Инициализируем контейнеры экранов
  document.getElementById('mainContent').innerHTML = `
    <div id="screen-route" class="screen-panel active"></div>
    <div id="screen-stt"   class="screen-panel"></div>
    <div id="screen-training" class="screen-panel"></div>
    <div id="screen-day" class="screen-panel"></div>`;
  document.getElementById('tabbar').style.display = 'flex';

  const err = (screenId, msg) => {
    const el = document.getElementById(screenId);
    if (el) el.innerHTML = `<div class="empty">⚠️ ${msg}</div>`;
  };

  // Загружаем все 4 вкладки параллельно ("История" убрана 01.08.2026)
  const [routeRes, sttRes, coachRes, dayRes] = await Promise.allSettled([
    fetch(`${API}/api/sv/${_telegramId}/route`).then(r => r.ok ? r.json() : Promise.reject()),
    fetch(`${API}/api/sv/${_telegramId}/stt`).then(r => r.ok ? r.json() : Promise.reject()),
    fetch(`${API}/api/sv/${_telegramId}/coach/week?week=current`).then(r => r.ok ? r.json() : Promise.reject()),
    fetch(`${API}/api/sv/${_telegramId}/today`).then(r => r.ok ? r.json() : Promise.reject()),
  ]);

  if (routeRes.status === 'fulfilled') {
    document.getElementById('screen-route').innerHTML = renderRoute(routeRes.value);
  } else {
    err('screen-route', 'Ошибка загрузки маршрута');
  }

  if (sttRes.status === 'fulfilled') {
    document.getElementById('screen-stt').innerHTML = renderStt(sttRes.value);
  } else {
    err('screen-stt', 'Ошибка загрузки СТТ');
  }

  if (coachRes.status === 'fulfilled') {
    document.getElementById('screen-training').innerHTML = renderCoach(coachRes.value);
  } else {
    err('screen-training', 'Ошибка загрузки ИИ-коуча');
  }

  if (dayRes.status === 'fulfilled') {
    document.getElementById('screen-day').innerHTML = renderDay(dayRes.value);
  } else {
    err('screen-day', 'Ошибка загрузки итога дня');
  }

  const tabParam = new URLSearchParams(window.location.search).get('tab');
  if (tabParam) switchTab(tabParam);

  // Обновляем заголовок первой вкладки
  document.getElementById('topTitle').textContent = 'Улучшить систему';
  const pill = document.getElementById('topPill');
  pill.textContent = formatDate();
  pill.style.display = 'block';
}

main();
</script>
</body>
</html>
