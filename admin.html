<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>СТТ — админ-панель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* admin.html — админ-панель stt-app, этап 1 (23.09.2026).
   Открывается только командой /admin в боте (Telegram Mini App). Все данные —
   через /api/admin/... (admin_api.py), права проверяются на сервере. */
:root{
  --bg:#EDF0EF;--surface:#FFFFFF;--surface-2:#F6F8F7;--ink:#16212B;--ink-2:#4A5763;--ink-3:#7C8792;--line:#D5DBDA;
  --accent:#0F6468;--accent-ink:#0B4C4F;--accent-bg:#DDEEEE;--on-accent:#FFFFFF;
  --ok:#2E7A4E;--ok-bg:#E0F0E6;--warn:#9A6212;--warn-bg:#F7ECD8;--bad:#A8342F;--bad-bg:#F6E0DE;--mute:#6B7680;--mute-bg:#E7EAEA;
  --sans:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10171C;--surface:#172027;--surface-2:#1C262E;--ink:#E6ECEF;--ink-2:#A9B5BE;--ink-3:#7D8A93;--line:#2A3640;
  --accent:#5FB8B8;--accent-ink:#9ED8D6;--accent-bg:#173536;--on-accent:#0B1A1B;
  --ok:#6CC08E;--ok-bg:#173323;--warn:#E0AE5A;--warn-bg:#3A2C14;--bad:#EC8A83;--bad-bg:#3C1D1B;--mute:#95A1AA;--mute-bg:#222C33}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:14px}
button:hover{border-color:var(--ink-3)}
button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
button.danger{color:var(--bad);border-color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;font-size:14px;width:100%}
input:disabled,select:disabled{background:var(--surface-2);color:var(--ink-2)}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:600;font-size:17px;padding:0 8px 14px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--ink-3)}
.navb{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:6px;width:100%}
.navb:hover{background:var(--surface-2)}
.navb.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:500}
.who{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;font-size:13px;color:var(--ink-2)}
.main{padding:22px 26px;min-width:0}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
.sub{color:var(--ink-2);margin:0 0 18px;font-size:14px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.row{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.on{background:var(--accent-bg)}
.nm{font-weight:500}
.meta{font-size:12px;color:var(--ink-3)}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor}
.filters{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:12px;font-weight:500;white-space:nowrap}
.s-test{background:var(--warn-bg);color:var(--warn)}.s-conn{background:var(--accent-bg);color:var(--accent-ink)}
.s-work{background:var(--ok-bg);color:var(--ok)}.s-pause{background:var(--bad-bg);color:var(--bad)}.s-off{background:var(--mute-bg);color:var(--mute)}
.c-test{color:var(--warn)}.c-conn{color:var(--accent)}.c-work{color:var(--ok)}.c-pause{color:var(--bad)}.c-off{color:var(--mute)}
.det{padding:20px 22px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.dhead h2{margin:0;font-size:20px;font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
.tab{border:0;background:transparent;border-radius:0;padding:9px 14px;border-bottom:2px solid transparent;color:var(--ink-2);white-space:nowrap}
.tab.on{border-bottom-color:var(--accent);color:var(--ink);font-weight:500}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.box{background:var(--surface-2);border-radius:8px;padding:12px 14px}
.lbl{font-size:12px;color:var(--ink-3);margin:0 0 3px}
.val{margin:0;font-weight:500}
.sec{margin-top:22px}
.sec h3{font-size:15px;font-weight:600;margin:0 0 10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-left:3px solid var(--accent);padding:10px 12px;margin:12px 0 0}
.note.warn{border-left-color:var(--warn)}.note.bad{border-left-color:var(--bad)}
.small{font-size:13px;color:var(--ink-2);margin:4px 0 0}
.mono{font-family:var(--mono);font-size:13px}
.err{color:var(--bad);font-size:13px;margin:6px 0 0;min-height:1em}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:10px}
.check input{width:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}
.src{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.src:last-child{border-bottom:0}
.back{display:none;margin-bottom:14px}
.center{padding:60px 20px;text-align:center;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:8px;font-size:14px;max-width:min(560px,92vw);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(10,16,20,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal .card{background:var(--surface);border-radius:10px;padding:22px;max-width:440px;width:100%}
.modal h3{margin:0 0 8px;font-size:17px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}.nav{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center}
  .brand{padding:0 8px;width:100%}.navb{width:auto}.who{margin:0;border:0;padding:0 8px;width:100%}
  .split{grid-template-columns:1fr}.main{padding:16px 12px}.grid3{grid-template-columns:1fr 1fr}
  .back{display:inline-block}.split.show-det>.list{display:none}.split:not(.show-det)>.det{display:none}
}
@media (max-width:520px){.grid3,.grid2{grid-template-columns:1fr}.src{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav"></nav>
  <main class="main" id="main"><div class="center">Загрузка…</div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>
<script>
const API = new URLSearchParams(location.search).get('dev') === '1'
  ? 'https://develop-production-0a2d.up.railway.app'
  : 'https://worker-production-1dfb.up.railway.app';
const TG = window.Telegram && window.Telegram.WebApp;
const INIT = TG ? TG.initData : '';

const ROLES = {owner:'Владелец', manager:'Менеджер СТТ', tech:'Техспециалист'};
const STAGES = {test:'Тест (Excel)', conn:'Подключение', work:'Работает', pause:'Приостановлена', off:'Отключена'};
const DAYS = ['пн','вт','ср','чт','пт','сб','вс'];
const TZS = ['Europe/Kiev','Europe/Moscow','Europe/Vienna','Asia/Tashkent','Asia/Almaty','Asia/Dushanbe','Asia/Ashgabat','Asia/Bishkek'];
const MAPF = [['agent_name','Агент'],['tt_code','Код ТТ'],['order_date','Дата заказа'],['category','Категория'],['amount','Сумма'],['client_name','Клиент']];

const S = {me:null, companies:[], free:[], team:[], log:[], clog:[], view:'companies', sel:null, tab:null,
           filter:'all', showDet:false, newOpen:false, addOpen:false, busy:false, health:{}, srcDraft:null, upl:{}, mig:null, bq:{}, bill:{}, bset:null, sales:null, salesPer:'month', salesFrom:'', salesTo:'', payKind:'lic', tasks:null, tScope:'open', tSel:null, tDetail:null, tNew:null, people:[], ctasks:{}, taskCount:0};

const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hh = h => String(h).padStart(2,'0') + ':00';
const fdt = iso => { if(!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('ru-RU') + (iso.length > 10 ? ' ' + d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) : ''); };
const role = () => S.me ? S.me.role : '';
const isOwner = () => role() === 'owner';
const canMgr = () => ['owner','manager'].includes(role());
const canTech = () => ['owner','tech'].includes(role());

function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),3600); }

async function api(path, opts = {}){
  const res = await fetch(API + '/api/admin' + path, {
    method: opts.method || 'GET',
    headers: {'X-Telegram-Init-Data': INIT, 'Content-Type': 'application/json'},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch(e) {}
  if(!res.ok) throw new Error((data && data.detail) || ('Ошибка сервера ' + res.status));
  return data;
}

function fatal(text){
  $('nav').innerHTML = '<div class="brand">СТТ · админ-панель</div>';
  $('main').innerHTML = `<div class="center"><p style="font-weight:500;margin:0 0 6px">${esc(text)}</p><p class="small">Панель открывается по ссылке или командой /admin в Telegram-боте.</p></div>`;
}

async function boot(){
  if(TG){ TG.ready(); TG.expand(); }
  if(!INIT){ fatal('Откройте панель через Telegram'); return; }
  try {
    S.me = await api('/me');
  } catch(e){
    // 08.10.2026: не член «Команды» — возможно, техконтакт клиента
    try { S.client = await api('/client/me'); renderClient(); return; }
    catch(e2){ fatal(e2.message || e.message); return; }
  }
  S.tab = role() === 'tech' ? 'data' : 'overview';
  await loadCompanies();
  if(canMgr()){ try { S.bset = await api('/billing/settings'); } catch(e){} }
  try { S.people = await api('/tasks/people'); } catch(e){}
  await refreshTaskCount();
  render();
}

async function loadCompanies(){
  S.companies = await api('/companies');
  if(role() === 'manager') S.free = await api('/companies/free');
  if(!S.companies.some(c => c.company_id === S.sel)) S.sel = S.companies.length ? S.companies[0].company_id : null;
}

const co = id => S.companies.find(c => c.company_id === id);
const VIEWS = () => isOwner() ? [['companies','Компании'],['tasks','Задачи'],['sales','Продажи'],['team','Команда'],['log','Журнал изменений'],['tariff','Тариф']]
  : role() === 'manager' ? [['companies','Мои компании'],['tasks','Задачи'],['sales','Мои продажи'],['log','Журнал изменений']]
  : [['companies','Компании'],['tasks','Задачи'],['log','Журнал изменений']];
const TABS = () => role() === 'tech' ? [['data','Данные'],['ctasks','Задачи'],['clog','Журнал']]
  : [['overview','Обзор'],['cfg','Настройки'],['data','Данные'],['pay','Оплата'],['ctasks','Задачи'],['clog','Журнал']];

async function go(v){
  S.view = v; S.newOpen = false; S.addOpen = false;
  try {
    if(v === 'team') S.team = await api('/team');
    if(v === 'log') S.log = await api('/log');
    if(v === 'companies') await loadCompanies();
    if(v === 'sales') await loadSales();
    if(v === 'tasks') await loadTasks();
  } catch(e){ toast(e.message); }
  render();
}
async function pick(id){ S.srcDraft = null; S.sel = id; S.tab = TABS()[0][0]; S.showDet = true; render(); window.scrollTo(0,0); }
async function setTab(t){
  S.tab = t; S.srcDraft = null;
  if(t === 'clog'){ try { S.clog = await api('/log?company_id=' + encodeURIComponent(S.sel)); } catch(e){ toast(e.message); } }
  if(t === 'pay'){ S.payKind = 'lic'; await loadBill(S.sel); }
  if(t === 'ctasks'){ await loadCTasks(S.sel); }
  render();
}

function render(){
  $('nav').innerHTML = `<div class="brand">СТТ · админ-панель${API.includes('develop') ? '<small>develop</small>' : ''}</div>
    ${VIEWS().map(([k,n]) => `<button class="navb ${S.view===k?'on':''}" onclick="go('${k}')">${n}${k==='tasks' && S.taskCount ? ` <span class="tag s-pause" style="padding:0 7px">${S.taskCount}</span>` : ''}</button>`).join('')}
    <div class="who">${esc(S.me.name)}<br><span class="meta">${ROLES[role()]}</span>${isOwner() ? `<br><span class="meta" style="font-size:11px">сервер: ${esc(S.me.server_version || 'старая версия')}</span>` : ''}</div>`;
  const m = $('main');
  if(S.view === 'team') m.innerHTML = renderTeam();
  else if(S.view === 'log') m.innerHTML = renderLog();
  else if(S.view === 'sales') m.innerHTML = renderSales();
  else if(S.view === 'tasks') m.innerHTML = renderTasks();
  else if(S.view === 'tariff') m.innerHTML = renderTariff();
  else m.innerHTML = S.newOpen ? renderNew() : renderCompanies();
  if(S.view === 'companies' && S.tab === 'cfg') cfgPreview();
}

/* ---------- Компании ---------- */
function freeBlock(){
  if(role() !== 'manager' || !S.free.length) return '';
  return `<div class="sec"><h3>Свободные компании — без менеджера</h3>
    <p class="small" style="margin:0 0 10px">Видно только название. Закрепите за собой — откроются настройки и журнал компании. Компанию другого менеджера взять нельзя.</p>
    <div class="panel">${S.free.map(c => `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)">
      <span>${esc(c.name || c.company_id)} <span class="tag s-${c.stage}">${esc(c.stage_name)}</span></span>
      <button onclick="claim('${esc(c.company_id)}')">Закрепить за собой</button></div>`).join('')}</div></div>`;
}

function renderCompanies(){
  const ALL = S.companies, DEL = ALL.filter(c => c.deleted_at), V = ALL.filter(c => !c.deleted_at), fl = S.filter;
  const list = fl === 'deleted' ? DEL : V.filter(c => fl === 'all' || (fl === 'nomgr' ? !c.manager_telegram_id : c.stage === fl));
  const cnt = k => V.filter(c => c.stage === k).length;
  const title = role() === 'manager' ? 'Мои компании' : 'Компании';
  const newBtn = canMgr() ? '<button class="pri" onclick="S.newOpen=true;render()">Новая компания</button>' : '';
  if(!V.length) return `<div class="head"><h1>${title}</h1>${newBtn}</div>
    <div class="panel det" style="margin-top:14px"><p class="val">У вас пока нет компаний</p>
    <p class="small">${role()==='manager' ? 'Заведите нового клиента или возьмите себе свободную компанию ниже.' : 'Справочник пуст.'}</p></div>${freeBlock()}`;
  const c = co(S.sel);
  const chips = [['all','Все',V.length], ...(isOwner() ? [['nomgr','Без менеджера',V.filter(x=>!x.manager_telegram_id).length]] : []),
    ...Object.entries(STAGES).map(([k,n]) => [k,n,cnt(k)]).filter(x => x[2]), ...(DEL.length ? [['deleted','Удалённые',DEL.length]] : [])];
  return `<div class="head"><h1>${title}</h1>${newBtn}</div>
  <p class="sub">${V.length} компаний · справочник: ${S.me.registry_source === 'db' ? 'база' : 'Google-таблица'}</p>
  <div class="split ${S.showDet ? 'show-det' : ''}">
    <div class="panel list">
      <div class="filters">${chips.map(([k,n,x]) => `<span class="chip ${fl===k?'on':''}" onclick="S.filter='${k}';render()">${n} ${x}</span>`).join('')}</div>
      ${list.map(x => `<div class="row ${x.company_id===S.sel?'on':''}" onclick="pick('${esc(x.company_id)}')">
        <span class="dot c-${x.stage}"></span>
        <div><div class="nm">${esc(x.name || x.company_id)}</div>
        <div class="meta">${esc(x.manager_name || 'без менеджера')} · ${esc(x.stage_name)}${payHint(x)}</div></div></div>`).join('') || '<div class="row"><span></span><div class="meta">Нет компаний</div></div>'}
    </div>
    <div class="panel det">${c ? renderDetail(c) : '<p class="small">Выберите компанию.</p>'}</div>
  </div>${freeBlock()}`;
}

function renderDetail(c){
  const tabs = TABS(); if(!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
  const body = S.tab === 'overview' ? tabOverview(c) : S.tab === 'cfg' ? tabCfg(c) : S.tab === 'data' ? tabData(c) : S.tab === 'pay' ? tabPay(c) : S.tab === 'ctasks' ? tabCTasks(c) : tabLog();
  return `<button class="back" onclick="S.showDet=false;render()">← Все компании</button>
  <div class="dhead"><div><h2>${esc(c.name || c.company_id)}</h2><div class="meta">${esc(c.company_id)} · ${esc(c.timezone)}</div></div>
  <span class="tag s-${c.stage}">${esc(c.stage_name)}</span></div>
  <div class="tabs">${tabs.map(([k,n]) => `<button class="tab ${S.tab===k?'on':''}" onclick="setTab('${k}')">${n}</button>`).join('')}</div>${body}`;
}

function tabOverview(c){
  const stageOpts = Object.entries(STAGES).filter(([k]) => isOwner() || ['test','conn','work'].includes(k) || k === c.stage);
  const team = S.team.filter(t => t.role === 'manager' && t.active);
  const mgrBlock = isOwner()
    ? `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select id="as_m" style="width:auto"><option value="">не закреплён</option>${team.map(t => `<option value="${esc(t.telegram_id)}" ${t.telegram_id===c.manager_telegram_id?'selected':''}>${esc(t.name)}</option>`).join('')}${c.manager_telegram_id && !team.some(t=>t.telegram_id===c.manager_telegram_id) ? `<option value="${esc(c.manager_telegram_id)}" selected>${esc(c.manager_name)}</option>` : ''}</select><button onclick="assign('${esc(c.company_id)}')">Закрепить</button></div>`
    : `<p class="val">${esc(c.manager_name || 'не закреплён')}${c.manager_telegram_id === S.me.telegram_id ? ' (вы)' : ''}</p>`;
  return `${healthBlock(c)}
  <div class="grid2" style="margin-top:14px">
    <div class="box"><p class="lbl">Менеджер СТТ</p>${mgrBlock}</div>
    <div class="box"><p class="lbl">Этап</p><div style="display:flex;gap:8px;flex-wrap:wrap">
      <select id="st_s" style="width:auto" ${canMgr()?'':'disabled'}>${stageOpts.map(([k,n]) => `<option value="${k}" ${k===c.stage?'selected':''}>${n}</option>`).join('')}</select>
      <input id="st_t" type="date" style="width:auto" value="${esc(c.trial_until || '')}" title="Тест до" ${canMgr()?'':'disabled'}>
      ${canMgr() ? `<button onclick="saveStage('${esc(c.company_id)}')">Сохранить</button>` : ''}</div>
      <p class="small">Дата — окончание бесплатного теста.</p></div></div>
  <div class="grid3" style="margin-top:12px">

/* ---------- Состояние компании ---------- */
const HEALTH_ICON = {ok:['✓','var(--ok)'], warn:['!','var(--warn)'], bad:['✕','var(--bad)'], info:['i','var(--ink-3)']};
const HEALTH_ACTION = {excel:['Загрузить Excel','data'], close_month:['Закрыть период','data'], settings:['Открыть настройки','cfg'], reload:['К данным','data'], payment:['Открыть оплату','pay'], tasks:['К задачам','ctasks']};
async function loadHealth(id, force){
  if(!force && S.health[id]) return;
  S.health[id] = 'loading';
  try { S.health[id] = await api('/companies/' + encodeURIComponent(id) + '/health'); }
  catch(e){ S.health[id] = [{level:'warn', title:'Состояние не проверилось', hint:e.message}]; }
  if(S.sel === id && S.view === 'companies') render();
}
function healthBlock(c){
  const h = S.health[c.company_id];
  if(!h || h === 'loading'){ if(!h) loadHealth(c.company_id); return '<div class="box"><p class="lbl">Состояние компании</p><p class="small">Проверяю…</p></div>'; }
  const order = {bad:0, warn:1, info:2, ok:3};
  const rows = h.slice().sort((a,b) => order[a.level]-order[b.level]).map(i => {
    const [ic, col] = HEALTH_ICON[i.level] || HEALTH_ICON.info;
    const act = i.action && HEALTH_ACTION[i.action] && !(role()==='tech' && i.action==='settings')
      ? `<button style="white-space:nowrap" onclick="setTab('${HEALTH_ACTION[i.action][1]}')">${HEALTH_ACTION[i.action][0]}</button>` : '';
    return `<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)">
      <span style="width:20px;height:20px;border-radius:50%;border:1.5px solid ${col};color:${col};font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px">${ic}</span>
      <div style="flex:1;min-width:0"><div style="font-weight:500">${esc(i.title)}</div>${i.hint ? `<p class="small" style="margin:2px 0 0">${esc(i.hint)}</p>` : ''}</div>${act}</div>`;
  }).join('');
  const problems = h.filter(i => i.level === 'bad' || i.level === 'warn').length;
  return `<div class="panel" style="padding:12px 16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
    <strong style="font-weight:600">Состояние компании</strong>
    <span style="display:flex;gap:8px;align-items:center"><span class="tag ${problems ? 's-test' : 's-work'}">${problems ? 'Требует внимания: ' + problems : 'Всё в порядке'}</span>
    <button onclick="loadHealth('${esc(c.company_id)}', true)" title="Проверить заново">↻</button></span></div>${rows}</div>`;
}

}
function cfgPreview(){
  const el = $('f_prev'); if(!el) return;
  const m = +$('f_m').value, e = +$('f_e').value, tz = $('f_tz').value;
  const off = [...document.querySelectorAll('#f_off .chip.on')].map(x => x.dataset.d);
  const work = DAYS.filter(d => !off.includes(d));
  el.className = 'note' + (e <= m ? ' bad' : '');
  el.textContent = e <= m ? 'Вечерний отчёт должен быть позже утреннего.'
    : `Утренний отчёт в ${hh(m)}, вечерний в ${hh(e)} по времени ${tz}. Рабочие дни: ${work.join(', ') || 'нет'}.`;
}
function collectCfg(c){
  const ch = {};
  const put = (k, v) => { if(JSON.stringify(c[k] ?? '') !== JSON.stringify(v ?? '')) ch[k] = v; };
  put('name', $('f_name').value.trim()); put('timezone', $('f_tz').value);
  put('morning_hour', +$('f_m').value); put('evening_hour', +$('f_e').value);
  put('days_off', [...document.querySelectorAll('#f_off .chip.on')].map(x => x.dataset.d).join(','));
  put('tech_contact_id', $('f_ti').value.trim()); put('launch_report', $('f_lr').checked);
  return ch;
}
async function saveCfg(id){
  const c = co(id), ch = collectCfg(c);
  if(!Object.keys(ch).length){ toast('Изменений нет'); return; }
  if(+$('f_e').value <= +$('f_m').value){ $('f_err').textContent = 'Вечерний отчёт должен быть позже утреннего'; return; }
  $('f_save').disabled = true;
  try {
    const r = await api('/companies/' + encodeURIComponent(id), {method:'PATCH', body: ch});
    Object.assign(c, r.company); delete S.health[id];
    toast(`Сохранено: ${r.changed} изм.` + (('timezone' in ch || 'morning_hour' in ch || 'evening_hour' in ch || 'days_off' in ch) ? ' Бот подхватит расписание в течение 10 минут' : ''));
    render();
  } catch(e){ $('f_err').textContent = e.message; $('f_save').disabled = false; }
}

async function saveStage(id){
  const c = co(id), body = {};
  if($('st_s').value !== c.stage) body.stage = $('st_s').value;
  if(($('st_t').value || null) !== (c.trial_until || null)) body.trial_until = $('st_t').value || null;
  if(!Object.keys(body).length){ toast('Изменений нет'); return; }
  if(body.stage === 'pause' && !confirm('Приостановить компанию? Отчёты перестанут уходить, дашборды закроются. Данные сохраняются.')) return;
  if(body.stage === 'off' && !confirm('Отключить компанию? Бот перестанет её обслуживать: отчёты не уйдут, дашборды не откроются. Данные НЕ удаляются.')) return;
  try { const r = await api('/companies/' + encodeURIComponent(id), {method:'PATCH', body}); Object.assign(c, r.company); toast('Этап сохранён'); render(); }
  catch(e){ toast(e.message); }
}
async function assign(id){
  try { await api('/companies/' + encodeURIComponent(id) + '/assign', {method:'POST', body:{manager_id: $('as_m').value}});
    await loadCompanies(); toast('Менеджер закреплён'); render(); }

      <p class="lbl" style="margin-top:12px">Соответствие полей: наше поле → поле клиента</p>

    : cur === 'api' ? `<div style="margin-top:12px"><p class="lbl">Адрес API</p><input id="f_rest" class="mono" value="${esc(c.rest_base_url)}" placeholder="https://…" ${canSrc?'':'disabled'}></div>` : '';

const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const PERIOD_HINT = {
  closed: 'Пересчитает итоги месяца и все его недели. Обычно делается само, вручную — если заказы догрузили позже. Повтор перезапишет цифры, дублей не будет.',
  current: 'Месяц ещё идёт — итоги месяца закроются сами 1-го числа. Сейчас пересчитаются только закончившиеся недели.',
};
function periodMonths(){ const d = new Date(); return [[d.getMonth()+1, d.getFullYear()], ...lastMonths(12)]; }
function isCurrentPeriod(v){ const d = new Date(); return v === `${d.getMonth()+1}.${d.getFullYear()}`; }
function periodLabel(){
  const cur = isCurrentPeriod($('cm_m').value);
  $('cm_b').textContent = cur ? 'Обновить недели' : 'Закрыть период';
  $('cm_h').textContent = cur ? PERIOD_HINT.current : PERIOD_HINT.closed;
}
function periodResult(r){
  const weeks = (r.weeks || []).map(w => `<div>${esc(w)}</div>`).join('');
  return `<div class="note ${r.ok === false ? 'warn' : ''}">${esc(r.message)}${weeks ? `<div style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px">${weeks}</div>` : ''}</div>`;
}
function lastMonths(n){ const out = []; const d = new Date(); d.setDate(1); for(let i=0;i<n;i++){ d.setMonth(d.getMonth()-1); out.push([d.getMonth()+1, d.getFullYear()]); } return out; }

async function saveSource(id, key){
  const c = co(id), body = {};
  if(key === 'file'){
    try { await api('/companies/' + encodeURIComponent(id) + '/upload-link', {method:'POST', body:{action:'create'}});
      if(c.connection_type && srcKey(c) !== 'file'){ c.file_mode = true; S.srcDraft = null; delete S.upl[id]; toast('Ссылка создана'); render(); return; }
      c.file_mode = true; S.srcDraft = null; delete S.upl[id]; delete S.health[id]; toast('Ссылка создана'); render(); }
    catch(e){ const el = $('src_err'); if(el) el.textContent = e.message; else toast(e.message); }
    return;
  }
  if(c.file_mode){
    try { await api('/companies/' + encodeURIComponent(id) + '/upload-link', {method:'POST', body:{action:'disable'}}); c.file_mode = false; delete S.upl[id]; }
    catch(e){ toast(e.message); return; }
  }
  if(key === 'excel'){
    if(!c.connection_type){ S.srcDraft = null; delete S.health[id]; toast('Источник: Excel. Ссылка выключена'); render(); return; }
    body.connection_type = '';
  }
  if(key === 'bigquery'){
    body.connection_type = 'bigquery'; body.bq_table_ref = $('f_bq').value.trim();
    const map = {}; document.querySelectorAll('[data-mk]').forEach(i => { if(i.value.trim()) map[i.dataset.mk] = i.value.trim(); });
    body.bq_column_map = Object.keys(map).length ? map : null;
  }
  if(key === 'api'){ body.connection_type = 'rest_api'; body.rest_base_url = $('f_rest').value.trim(); }
  try {
    const r = await api('/companies/' + encodeURIComponent(id), {method:'PATCH', body});
    Object.assign(c, r.company); S.srcDraft = null; delete S.health[id];
    toast(r.changed ? 'Источник сохранён' : 'Изменений нет'); render();
  } catch(e){ const el = $('src_err'); if(el) el.textContent = e.message; else toast(e.message); }
}

/* ---------- Мастер «Перевод с Google на базу» ---------- */
function migrateBlock(c){
  if(!canTech()) return '<div class="note">Перевод на базу делает владелец или техспециалист.</div>';
  const m = S.mig && S.mig.id === c.company_id ? S.mig : null;
  let body = `<p class="small" style="margin:0 0 10px">Мастер сам прочитает Структуру, План, Факт и архив «Итоги месяца» из Google-таблицы компании, перенесёт их в базу и переключит компанию. Если архив не перенесётся — остановится до переключения, компания продолжит работать от Google.</p>
    <button class="pri" id="mg_c" onclick="migrateCheck('${esc(c.company_id)}')">1. Проверить данные в Google</button>`;
  if(m && m.check){
    body = `<p class="lbl">Что будет перенесено</p>${m.check.summary.map(x => `<p class="small" style="margin:2px 0">• ${esc(x)}</p>`).join('')}
      <details style="margin-top:8px"><summary style="cursor:pointer">Полный отчёт проверки</summary><pre style="white-space:pre-wrap;font:13px/1.5 var(--sans)">${esc(m.check.report)}</pre></details>
      <div class="note warn">Проверьте, что у сотрудников есть Telegram ID и нет имён-заготовок. Лучше переводить вечером, после отчётов: перевод займёт до пары минут.</div>
      <div class="acts"><button class="pri" id="mg_r" onclick="migrateRun('${esc(c.company_id)}','${esc(m.check.token)}')">2. Перевести на базу</button><button onclick="S.mig=null;render()">Отмена</button></div>`;
  }
  if(m && m.done) body = `<div class="note">${esc(m.done)}</div>`;
  if(m && m.error) body += `<div class="note bad">${esc(m.error)}</div>`;
  return `<div class="panel" style="padding:12px 16px;margin-top:12px"><strong style="font-weight:600">Перевод с Google на базу</strong><div style="margin-top:8px">${body}</div></div>`;
}
async function migrateCheck(id){
  const b = $('mg_c'); if(b){ b.disabled = true; b.textContent = 'Читаю Google-таблицу…'; }

  catch(e){ S.mig = {id, error:e.message}; }

}
async function migrateRun(id, token){
  if(!confirm('Перевести компанию на базу? Архив, Структура, План и Факт перенесутся, компания перестанет читать Google-таблицу.')) return;

  catch(e){ S.mig = {id, check:S.mig && S.mig.check, error:e.message}; }

}
async function rollbackGoogle(id){
  if(!confirm('Вернуть компанию на её Google-таблицу? Бот снова будет читать Структуру и План из Google.')) return;
  try { const r = await api('/companies/' + encodeURIComponent(id) + '/migrate/rollback', {method:'POST'}); await loadCompanies(); delete S.health[id]; toast(r.message); render(); }

}
async function bqCheck(id){
  const btn = $('bq_c'); btn.disabled = true; btn.textContent = 'Читаю BigQuery…';
  try { const r = await api('/companies/' + encodeURIComponent(id) + '/bq-sp/check', {method:'POST'}); S.bq[id].check = r; S.bq[id].error = ''; S.bq[id].blocked = ''; }

async function bqSync(id, force){
  if(force && !confirm('Записать данные из BigQuery, несмотря на предупреждение? Структура и План компании будут заменены.')) return;
  const btn = $('bq_y'); if(btn){ btn.disabled = true; btn.textContent = 'Загружаю…'; }
  try { const r = await api('/companies/' + encodeURIComponent(id) + '/bq-sp/sync', {method:'POST', body:{force:!!force}});
    toast(r.message); delete S.health[id]; await loadBq(id); return; }
  catch(e){
    if(/Похоже на сбой|меньше половины/.test(e.message)){ S.bq[id].blocked = e.message; S.bq[id].error = ''; }

/* ---------- Задачи ---------- */
const T_STATUS = [['new','Новая'],['work','В работе'],['wait','Ждём клиента'],['done','Решена']];
const T_KINDS = [['connect','Подключение'],['data','Данные'],['dashboard','Дашборд'],['payment','Оплата'],['other','Другое']];

async function refreshTaskCount(){ try { const r = await api('/tasks?scope=' + (role()==='owner' ? 'open' : 'open')); S.taskCount = r.length; } catch(e){} }
async function loadTasks(){ try { S.tasks = await api('/tasks?scope=' + S.tScope); } catch(e){ S.tasks = {error:e.message}; } }
async function loadCTasks(id){ try { S.ctasks[id] = await api('/tasks?scope=all&company_id=' + encodeURIComponent(id)); } catch(e){ S.ctasks[id] = {error:e.message}; } }
async function setTScope(sc){ S.tScope = sc; S.tSel = null; S.tDetail = null; await loadTasks(); render(); }

  S.view = 'tasks'; S.tNew = null; S.tSel = id;

function newTask(companyId){ S.view = 'tasks'; S.tSel = null; S.tDetail = null; S.tNew = {company_id: companyId || ''}; if(!S.tasks) loadTasks().then(render); render(); }
const fdt2 = iso => { const d = new Date(iso); return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); };
function peopleOpts(sel){ return `<option value="">не назначен</option>` + S.people.map(p => `<option value="${esc(p.telegram_id)}" ${p.telegram_id===sel?'selected':''}>${esc(p.name)} · ${ROLES[p.role]||p.role}</option>`).join(''); }
function taskRow(t){ return `<div class="row ${S.tSel===t.id?'on':''}" onclick="openTask(${t.id})" style="grid-template-columns:minmax(0,1fr) auto">
  <div><div class="nm">#${t.id} · ${esc(t.company_name)} · ${esc(t.title)}</div><div class="meta">${esc(t.kind_name)} · ${esc(t.assignee_name || 'не назначен')} · обновлена ${fdt2(t.updated_at)}</div></div>

async function createTask(){
  const body = {company_id:$('tn_c').value, kind:$('tn_k').value, title:$('tn_t').value.trim(), text:$('tn_x').value.trim(), assignee_id:$('tn_a').value};

  try { const r = await api('/tasks', {method:'POST', body}); toast('Задача #' + r.id + ' создана'); S.tNew = null; delete S.ctasks[body.company_id]; delete S.health[body.company_id];

function taskDetail(t){

  <div class="sec"><h3>История</h3>${hist}</div>
  <div class="sec"><p class="lbl">Комментарий</p><textarea id="td_c" rows="3" style="width:100%;font:inherit;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--surface);color:var(--ink)"></textarea>
    <div class="acts"><button onclick="commentTask(${t.id})">Добавить комментарий</button></div></div>
  ${done ? '' : `<div class="sec"><p class="lbl">Решение — обязательно для закрытия</p><textarea id="td_r" rows="2" style="width:100%;font:inherit;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--surface);color:var(--ink)" placeholder="Что сделали, чтобы проблема не повторилась"></textarea>
    <p class="err" id="td_err"></p><div class="acts"><button class="pri" onclick="closeTask(${t.id})">Закрыть как решённую</button></div></div>`}

async function afterTaskChange(id){ await loadTasks(); await refreshTaskCount(); if(S.tDetail) delete S.ctasks[S.tDetail.company_id]; await openTask(id); }
async function setTStatus(id, st){ try { await api('/tasks/' + id + '/status', {method:'POST', body:{status:st}}); toast('Статус изменён'); await afterTaskChange(id); } catch(e){ toast(e.message); } }
async function closeTask(id){

async function commentTask(id){

async function assignTask(id){ try { await api('/tasks/' + id + '/assign', {method:'POST', body:{assignee_id:$('td_a').value}}); toast('Ответственный изменён'); await afterTaskChange(id); } catch(e){ toast(e.message); } }
function tabCTasks(c){

/* ---------- Оплата ---------- */
const eur = n => '€' + Math.round(Number(n) || 0).toLocaleString('ru-RU');
const tariffOf = (s, seats) => Math.max(+s.min_price, +s.seat_price * Math.max(+seats || 0, 0));
function daysTo(iso){ if(!iso) return null; const d = new Date(iso.slice(0,10) + 'T00:00:00'), t = new Date(); t.setHours(0,0,0,0); return Math.round((d - t) / 864e5); }
function payHint(x){
  if(!S.bset || x.stage === 'off') return '';
  const end = x.stage === 'test' ? x.trial_until : x.paid_until, left = daysTo(end);
  if(left === null || left > S.bset.remind_days) return '';
  const what = x.stage === 'test' ? 'тест' : 'оплата';
  return left < 0 ? ` · <span style="color:var(--bad)">${what} закончилась</span>` : ` · <span style="color:var(--warn)">${what}: ${left} дн.</span>`;
}
async function loadBill(id){
  try { S.bill[id] = await api('/companies/' + encodeURIComponent(id) + '/billing'); }
  catch(e){ S.bill[id] = {error: e.message}; }
  if(S.sel === id) render();
}
function tabPay(c){
  const b = S.bill[c.company_id];
  if(!b) { loadBill(c.company_id); return '<p class="small">Загружаю…</p>'; }
  if(b.error) return `<div class="note bad">${esc(b.error)}</div>`;
  if(!b.settings) return '<div class="note bad">Сервер не вернул данные об оплате — обновите серверную часть админки.</div>';
  const s = b.settings, left = b.days_left;
  const untilTxt = b.paid_until ? new Date(b.paid_until.slice(0,10) + 'T00:00:00').toLocaleDateString('ru-RU') : '—';
  const leftTxt = b.paid_until ? (left < 0 ? `<span style="color:var(--bad)">закончилась ${-left} дн. назад</span>` : left <= s.remind_days ? `<span style="color:var(--warn)">через ${left} дн.</span>` : `через ${left} дн.`) : (b.stage === 'test' ? 'бесплатный тест' : 'оплат ещё не было');
  const used = b.used_seats === null || b.used_seats === undefined ? 'нет данных' : b.used_seats;
  const mgrs = S.team.filter(t => t.role === 'manager' && t.active);
  const lic = S.payKind === 'lic';

function addMonthsIso(iso, n){ const d = new Date(iso + 'T00:00:00'), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return d; }
function payCalc(){
  const b = S.bill[S.sel]; if(!b || b.error || !$('p_seats') || !$('p_sum')) return;
  const seats = Math.round(+$('p_seats').value), months = Math.round(+$('p_months').value);
  if(!(seats > 0) || !(months > 0)){ $('p_sum').textContent = '—'; $('p_until').textContent = ''; return; }
  $('p_sum').textContent = eur(tariffOf(b.settings, seats) * months);
  const base = b.paid_until && b.days_left >= 0 ? b.paid_until.slice(0,10) : b.today;
  $('p_until').textContent = 'Оплачено до станет: ' + addMonthsIso(base, months).toLocaleDateString('ru-RU');
}
async function savePayment(id){
  const err = t => { $('p_err').textContent = t; };
  const body = {kind: S.payKind, method: $('p_method').value, comment: $('p_comment').value.trim()};
  if(!body.method) return err('Укажите, как пришли деньги');
  if(S.payKind === 'lic'){
    body.seats = Math.round(+$('p_seats').value); body.months = Math.round(+$('p_months').value);
    if(!(body.seats > 0) || !(body.months > 0)) return err('Введите число мест и месяцев больше нуля');
  } else {
    body.work = $('p_work').value.trim(); body.amount = +$('p_amount').value;
    if(!body.work) return err('Опишите, какая работа оплачена');
    if(!(body.amount > 0)) return err('Введите сумму больше нуля');
  }
  if(isOwner() && $('p_mgr')) body.manager_id = $('p_mgr').value;
  $('p_save').disabled = true;
  try { const r = await api('/companies/' + encodeURIComponent(id) + '/payments', {method:'POST', body});
    toast('Оплата сохранена: ' + r.message); delete S.health[id]; await loadCompanies(); await loadBill(id); }
  catch(e){ err(e.message); $('p_save').disabled = false; }
}

/* ---------- Продажи ---------- */
function periodRange(){
  const t = new Date(), y = t.getFullYear(), m = t.getMonth(), iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  switch(S.salesPer){
    case 'prev': return [iso(new Date(y, m-1, 1)), iso(new Date(y, m, 0))];
    case 'q': { const q = Math.floor(m/3)*3; return [iso(new Date(y, q, 1)), iso(new Date(y, q+3, 0))]; }
    case 'year': return [iso(new Date(y, 0, 1)), iso(new Date(y, 11, 31))];
    case 'custom': return [S.salesFrom || iso(new Date(y, m, 1)), S.salesTo || iso(t)];
    default: return [iso(new Date(y, m, 1)), iso(new Date(y, m+1, 0))];
  }
}
async function loadSales(){
  const [a, b] = periodRange();
  try { S.sales = await api(`/sales?date_from=${a}&date_to=${b}`); S.sales.range = [a, b]; }
  catch(e){ S.sales = {error: e.message}; }
}
async function setSalesPer(p){ S.salesPer = p; await loadSales(); render(); }
async function setSalesRange(){
  const f = $('sl_f').value, t = $('sl_t').value;
  if(!f || !t || f > t){ $('sl_err').textContent = 'Дата «с» должна быть не позже даты «по»'; return; }
  S.salesFrom = f; S.salesTo = t; await loadSales(); render();
}

    <div class="chips" style="margin-bottom:12px">${per.map(([k,n]) => `<span class="chip ${S.salesPer===k?'on':''}" onclick="setSalesPer('${k}')">${n}</span>`).join('')}</div>
    ${S.salesPer === 'custom' ? `<div class="grid3" style="max-width:520px;align-items:end"><div><p class="lbl">С</p><input type="date" id="sl_f" value="${a}"></div><div><p class="lbl">По</p><input type="date" id="sl_t" value="${b}"></div><div><button onclick="setSalesRange()">Показать</button></div></div><p class="err" id="sl_err"></p>` : ''}`;

  const list = (d.payments || []).map(p => `<tr><td style="white-space:nowrap">${fmt(p.pay_date)}</td><td>${esc(p.company_name)}</td><td>${p.kind === 'lic' ? `Лицензии: ${p.seats} × ${p.months} мес.` : `Консалтинг: ${esc(p.work)}`}</td><td>${eur(p.amount)}</td><td>${esc(p.method)}</td>${own ? '' : `<td>${esc(p.manager_name)}</td>`}</tr>`).join('');

function excelPick(input, id){
  const f = input.files && input.files[0]; if(!f) return;
  if(!/\.xlsx$/i.test(f.name)){ toast('Нужен файл .xlsx'); return; }
  if(f.size > 10*1024*1024){ toast('Файл больше 10 МБ'); return; }
  const out = $('xl_out'); out.innerHTML = '<div class="note">Проверяю файл…</div>';
  const r = new FileReader();
  r.onload = async () => {
    const b64 = String(r.result).split(',')[1] || '';
    try {
      const res = await api('/companies/' + encodeURIComponent(id) + '/excel/check', {method:'POST', body:{filename:f.name, data:b64}});
      out.innerHTML = `<div class="panel" style="padding:12px 16px;margin-top:14px"><p class="lbl">Проверка файла ${esc(f.name)}</p>
        <pre style="white-space:pre-wrap;font:13px/1.5 var(--sans);margin:0">${esc(res.report)}</pre>
        <div class="acts"><button class="pri" id="xl_w" onclick="excelWrite('${esc(id)}','${esc(res.token)}')">Записать</button><button onclick="$('xl_out').innerHTML=''">Отмена</button></div>
        <p class="small">Запись заменит Структуру и План компании целиком, а Факт — за месяцы, которые есть в файле.</p></div>`;
    } catch(e){ out.innerHTML = `<div class="note bad">${esc(e.message)}</div>`; }
    input.value = '';
  };
  r.onerror = () => { out.innerHTML = '<div class="note bad">Файл не прочитался. Выберите его ещё раз.</div>'; };
  r.readAsDataURL(f);
}

  const b = $('cm_b'), label = b.textContent; b.disabled = true; b.textContent = 'Считаю…';
  $('xl_out').innerHTML = '<div class="note">Считаю… для большой компании это до минуты.</div>';
  try { const r = await api('/companies/' + encodeURIComponent(id) + '/close-period', {method:'POST', body:{month:m, year:y}});
    toast(r.ok === false ? 'Закрыто с ошибкой — см. ниже' : 'Период закрыт'); delete S.health[id]; $('xl_out').innerHTML = periodResult(r); }
  catch(e){ $('xl_out').innerHTML = `<div class="note bad">${esc(e.message)}</div>`; }
  b.disabled = false; b.textContent = label;
}
async function checkPeriod(id){
  const [m, y] = $('cm_m').value.split('.').map(Number);
  $('xl_out').innerHTML = '<div class="note">Сверяю с архивом…</div>';
  try { const r = await api('/companies/' + encodeURIComponent(id) + '/period-check', {method:'POST', body:{month:m, year:y}});
    $('xl_out').innerHTML = `<div class="note">${r.lines.map(l => `<div>${esc(l)}</div>`).join('')}</div>`; }
  catch(e){ $('xl_out').innerHTML = `<div class="note bad">${esc(e.message)}</div>`; }
}
async function reload(id, cacheOnly){
  const b = $('rl'); if(b && !cacheOnly){ b.disabled = true; b.textContent = 'Загружаю…'; }
  try { const r = await api('/companies/' + encodeURIComponent(id) + '/reload', {method:'POST'}); toast(r.message); delete S.health[id]; }
  catch(e){ toast(e.message); }
  if(b && !cacheOnly){ b.disabled = false; b.textContent = 'Загрузить данные сейчас'; }
}

// ============================================================
// Экран техконтакта клиента (08.10.2026): только своя компания,
// «Загрузить данные сейчас» и «Закрыть период» за прошлый и текущий месяц
// ============================================================
function renderClient(){
  const cl = S.client;
  $('nav').innerHTML = `<div class="brand">СТТ · данные компании${API.includes('develop') ? '<small>develop</small>' : ''}</div><div class="who">Техконтакт<br><span class="meta">ID ${esc(cl.telegram_id)}</span></div>`;
  $('main').innerHTML = cl.companies.map(c => {
    const st = c.status || {}, y = st.yesterday ? st.yesterday.slice(8,10) + '.' + st.yesterday.slice(5,7) : '';
    const okY = (st.yesterday_orders || 0) > 0;
    const step1 = c.source === 'file'
      ? `<p class="small" style="margin:0">Данные приходят файлом по секретной ссылке. Отправьте по ней свежую выгрузку (ссылку можно взять у менеджера СТТ), затем закройте период.</p>`
      : `<button class="pri" style="width:100%" id="crl_${esc(c.company_id)}" onclick="clientReload('${esc(c.company_id)}')">Загрузить данные сейчас</button>
         <p class="small">Заберёт из ${c.source === 'bigquery' ? 'BigQuery' : 'API'} все заказы прошлого и текущего месяца. Повтор не задваивает заказы. Число запусков в сутки ограничено.</p>`;
    const opts = c.months.map((p, i) => `<option value="${p.month}.${p.year}" ${i===1?'selected':''}>${MONTHS_RU[p.month-1]} ${p.year}${i===0?' · идёт':''}</option>`).join('');
    return `<div class="panel" style="padding:16px 18px;max-width:560px;margin-bottom:16px">
      <div class="dhead"><h2>${esc(c.name)}</h2><span class="tag ${okY ? 's-work' : 's-test'}">${okY ? 'Данные за ' + y + ' пришли' : 'Нет данных за ' + y}</span></div>
      <p class="small">Заказов за ${esc(y)}: ${st.yesterday_orders || 0}${st.last_date ? ' · последние данные: ' + esc(st.last_date.split('-').reverse().join('.')) : ''}</p>
      <div class="box" style="margin-top:14px"><p class="val" style="margin-bottom:8px">1. Обновить заказы</p>${step1}</div>
      <div class="box" style="margin-top:10px"><p class="val" style="margin-bottom:8px">2. Закрыть период</p>
        <div style="display:flex;gap:8px"><select id="ccm_${esc(c.company_id)}" style="flex:1">${opts}</select>
        <button class="pri" id="ccb_${esc(c.company_id)}" onclick="clientClose('${esc(c.company_id)}')">Закрыть период</button></div>
        <p class="small">Нажмите после обновления заказов — итоги месяца и недели пересчитаются, дашборды покажут новые цифры. Для текущего месяца пересчитаются только закончившиеся недели.</p></div>
      <div id="cout_${esc(c.company_id)}"></div>
      <p class="small" style="margin-top:12px;color:var(--ink-3)">Доступны прошлый и текущий месяц. Менеджер СТТ получает уведомление о каждом действии.</p></div>`;
  }).join('');
}
async function clientReload(id){
  const b = $('crl_' + id); b.disabled = true; b.textContent = 'Загружаю…';
  try { const r = await api('/client/' + encodeURIComponent(id) + '/reload', {method:'POST'});
    $('cout_' + id).innerHTML = `<div class="note">${esc(r.message)}</div>`; }
  catch(e){ $('cout_' + id).innerHTML = `<div class="note bad">${esc(e.message)}</div>`; }
  b.disabled = false; b.textContent = 'Загрузить данные сейчас';
}
async function clientClose(id){
  const [m, y] = $('ccm_' + id).value.split('.').map(Number);
  const b = $('ccb_' + id); b.disabled = true; b.textContent = 'Считаю…';
  $('cout_' + id).innerHTML = '<div class="note">Считаю… это может занять до минуты.</div>';
  try { const r = await api('/client/' + encodeURIComponent(id) + '/close-period', {method:'POST', body:{month:m, year:y}});
    $('cout_' + id).innerHTML = periodResult(r); }
  catch(e){ $('cout_' + id).innerHTML = `<div class="note bad">${esc(e.message)}</div>`; }
  b.disabled = false; b.textContent = 'Закрыть период';
}

function logTable(rows, withCo){
  if(!rows.length) return '<p class="small" style="padding:8px">Изменений пока нет.</p>';
  const names = Object.fromEntries(S.companies.map(c => [c.company_id, c.name]));
  return `<div class="tw"><table><tr><th>Когда</th><th>Кто</th>${withCo?'<th>Компания</th>':''}<th>Действие</th><th>Подробности</th></tr>
  ${rows.map(x => `<tr><td style="white-space:nowrap">${fdt(x.at)}</td><td>${esc(x.actor_name)}</td>${withCo?`<td>${esc(x.company_id ? (names[x.company_id] || x.company_id) : '—')}</td>`:''}<td>${esc(x.action)}</td><td>${esc(x.details)}</td></tr>`).join('')}</table></div>`;
}
function tabLog(){ return logTable(S.clog, false); }
function renderLog(){
  return `<h1>Журнал изменений</h1><p class="sub">Кто, когда и что поменял${role()==='manager' ? ' — по вашим компаниям' : ''}. Записи не редактируются.</p>
  <div class="panel" style="padding:4px 8px">${logTable(S.log, true)}</div>`;
}

/* ---------- Новая компания ---------- */
function renderNew(){
  const hours = Array.from({length:24}, (_, i) => i);
  const o = (a, v, l) => a.map(x => `<option value="${esc(x)}" ${String(x)===String(v)?'selected':''}>${esc(l ? l(x) : x)}</option>`).join('');
  const mgrs = S.team.filter(t => t.role === 'manager' && t.active);
  return `<h1>Новая компания</h1><p class="sub">Начнёт с бесплатного теста на ${S.me.trial_days} дней через Excel.${role()==='manager' ? ' Сразу закрепится за вами.' : ''}</p>
  <div class="panel det" style="max-width:720px">
    <div class="grid2"><div><p class="lbl">Название</p><input id="nn" oninput="nnSlug()"></div>
    <div><p class="lbl">Код компании (латиница, без пробелов)</p><input id="ni" class="mono" oninput="S.slugTouched=true;$('nerr').textContent=''"></div></div>
    <div class="grid3" style="margin-top:12px"><div><p class="lbl">Часовой пояс</p><select id="ntz">${o(TZS,'Asia/Tashkent')}</select></div>
    <div><p class="lbl">Утренний отчёт</p><select id="nm">${o(hours, 8, hh)}</select></div>
    <div><p class="lbl">Вечерний отчёт</p><select id="ne">${o(hours, 19, hh)}</select></div></div>
    <p class="lbl" style="margin-top:12px">Выходные дни</p>
    <div class="chips" id="noff">${DAYS.map(d => `<span class="chip ${d==='вс'?'on':''}" data-d="${d}" onclick="this.classList.toggle('on')">${d}</span>`).join('')}</div>
    <div class="grid2" style="margin-top:12px"><div><p class="lbl">Техконтакт — Telegram ID (можно позже)</p><input id="nt" inputmode="numeric"></div>
    ${isOwner() ? `<div><p class="lbl">Менеджер СТТ</p><select id="nmg"><option value="">не закреплён</option>${mgrs.map(t => `<option value="${esc(t.telegram_id)}">${esc(t.name)}</option>`).join('')}</select></div>` : ''}</div>
    <p class="err" id="nerr"></p>
    <div class="acts"><button onclick="S.newOpen=false;render()">Отмена</button><button class="pri" id="nsave" onclick="saveNew()">Создать компанию</button></div></div>`;
}
function nnSlug(){
  if(S.slugTouched) return;
  const t = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sch',ы:'y',э:'e',ю:'yu',я:'ya'};
  $('ni').value = $('nn').value.trim().split(/\s+/).filter(Boolean).map(w => {
    const x = [...w.toLowerCase()].map(ch => t[ch] !== undefined ? t[ch] : (/[a-z0-9]/.test(ch) ? ch : '')).join('');
    return x.charAt(0).toUpperCase() + x.slice(1);
  }).join('_');
}
async function saveNew(){
  const err = t => { $('nerr').textContent = t; };
  const name = $('nn').value.trim(), id = $('ni').value.trim();
  if(!name) return err('Введите название компании');
  if(!/^[A-Za-z][A-Za-z0-9_]{2,30}$/.test(id)) return err('Код: латиница, цифры и «_», 3–31 знак, начинается с буквы');
  const m = +$('nm').value, e = +$('ne').value;
  if(e <= m) return err('Вечерний отчёт должен быть позже утреннего');
  const off = [...document.querySelectorAll('#noff .chip.on')].map(x => x.dataset.d);
  if(off.length === 7) return err('Хотя бы один день должен быть рабочим');
  const body = {company_id:id, name, timezone:$('ntz').value, morning_hour:m, evening_hour:e, days_off:off.join(','), tech_contact_id:$('nt').value.trim()};
  if(isOwner()) body.manager_telegram_id = $('nmg').value;
  $('nsave').disabled = true;
  try {
    await api('/companies', {method:'POST', body});
    S.newOpen = false; S.slugTouched = false; await loadCompanies(); S.sel = id; S.tab = 'overview'; S.showDet = true;
    toast(name + ' создана. Следующий шаг — загрузить Excel командой /structure ' + id); render();
  } catch(e){ err(e.message); $('nsave').disabled = false; }
}

/* ---------- Команда ---------- */
function renderTeam(){
  return `<h1>Команда</h1><p class="sub">Кто входит в панель через /admin и с какой ролью. Свой Telegram ID человек узнаёт командой /myid в боте.</p>
  <div class="panel det" style="max-width:760px">
    <div class="tw"><table><tr><th>Имя</th><th>Роль</th><th>Telegram ID</th><th>Клиентов</th><th></th></tr>
    ${S.team.map(t => `<tr style="${t.active?'':'color:var(--ink-3)'}"><td>${esc(t.name)}</td><td>${ROLES[t.role]}</td><td class="mono">${esc(t.telegram_id)}</td><td>${t.role==='manager' ? t.companies : '—'}</td>
      <td style="text-align:right">${t.role==='owner' ? '' : t.active ? `<button onclick="askOff('${esc(t.telegram_id)}')">Закрыть доступ</button>` : '<span class="tag s-off">доступ закрыт</span>'}</td></tr>`).join('')}</table></div>
    ${S.addOpen ? `<div class="sec"><h3>Добавить человека</h3>
      <div class="grid3"><div><p class="lbl">Имя и фамилия</p><input id="tn"></div>
      <div><p class="lbl">Роль</p><select id="tr"><option value="manager">Менеджер СТТ</option><option value="tech">Техспециалист</option></select></div>
      <div><p class="lbl">Telegram ID</p><input id="tid" inputmode="numeric"></div></div>
      <p class="err" id="terr"></p><div class="acts"><button onclick="S.addOpen=false;render()">Отмена</button><button class="pri" onclick="teamAdd()">Добавить</button></div></div>`
    : '<div class="acts"><button class="pri" onclick="S.addOpen=true;render()">Добавить человека</button></div>'}
  </div>`;
}
async function teamAdd(){
  const name = $('tn').value.trim(), tid = $('tid').value.trim(), r = $('tr').value;
  if(!name){ $('terr').textContent = 'Введите имя и фамилию'; return; }
  if(!/^\d{5,15}$/.test(tid)){ $('terr').textContent = 'Telegram ID — только цифры, 5–15 знаков'; return; }
  try { await api('/team', {method:'POST', body:{telegram_id:tid, name, role:r}}); S.addOpen = false; S.team = await api('/team');
    toast(name + ' добавлен(а). Теперь /admin откроет ему панель'); render(); }
  catch(e){ $('terr').textContent = e.message; }
}
function askOff(tid){
  const t = S.team.find(x => x.telegram_id === tid);
  $('modal').innerHTML = `<div class="modal" onclick="if(event.target===this)closeM()"><div class="card" role="dialog" aria-modal="true">
    <h3>Закрыть доступ: ${esc(t.name)}?</h3>
    <p class="small">/admin перестанет открываться.${t.companies ? ` Закреплённые за ним компании (${t.companies}) станут «без менеджера» — назначьте нового во вкладке «Обзор».` : ''} История в журнале сохранится.</p>
    <div class="acts"><button onclick="closeM()">Отмена</button><button class="danger" onclick="doOff('${esc(tid)}')">Закрыть доступ</button></div></div></div>`;
}
function closeM(){ $('modal').innerHTML = ''; }
async function doOff(tid){
  try { const r = await api('/team/' + encodeURIComponent(tid) + '/deactivate', {method:'POST'}); closeM(); S.team = await api('/team');
    toast('Доступ закрыт' + (r.released_companies.length ? `. Компаний без менеджера: ${r.released_companies.length}` : '')); render(); }
  catch(e){ closeM(); toast(e.message); }
}

document.addEventListener('keydown', e => { if(e.key === 'Escape') closeM(); });
(async () => { await boot(); if(isOwner()){ try { S.team = await api('/team'); render(); } catch(e){} } })();
</script>
