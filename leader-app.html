<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СТТ — Руководитель</title>
<style>
  summary::marker { display: none; content: ''; }
  summary::-webkit-details-marker { display: none; }
  :root {
    --bg: #F0EADC; --card: #FFFFFF; --ink: #2C2A26; --ink-soft: #8B8578; --line: #ECE6D8;
    --green: #3FAE6A; --green-bg: #E6F4EC; --yellow: #E2A335; --yellow-bg: #FBF1DF;
    --red: #DC5B4E; --red-bg: #FAE7E4; --red-dark: #A93B30; --amber: #D98A3D; --amber-bg: #F8EBDB;
    --blue: #3B7DDB; --blue-bg: #E7EFFB;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); }
  .phone { width: 100%; max-width: 480px; background: var(--bg); height: 100dvh; display: flex; flex-direction: column; }
  .topbar { padding: 22px 20px 14px; display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0; }
  .topbar h1 { font-size: 20px; font-weight: 700; margin: 0; }
  .top-pill { font-size: 13px; color: var(--ink-soft); background: var(--card); border-radius: 100px; padding: 6px 12px; font-weight: 600; }
  .content { padding: 4px 16px 24px; overflow-y: auto; flex: 1; }
  .tabbar { display: flex; background: var(--card); border-top: 1px solid var(--line); padding: 9px 4px 14px; flex-shrink: 0; }
  .tab { flex: 1; text-align: center; font-size: 10px; font-weight: 700; color: var(--ink-soft); background: none; border: none; font-family: inherit; cursor: pointer; padding: 6px 2px 0; }
  .tab.active { color: var(--ink); }
  .tab .icon { width: 26px; height: 26px; margin: 0 auto 4px; border-radius: 8px; background: var(--line); display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .tab.active .icon { background: #D9CFAE; }
  .sub { font-size: 12px; color: var(--ink-soft); font-weight: 600; margin: -4px 0 14px; }

  .day-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  .day-card h3 { font-size: 12px; font-weight: 700; color: var(--ink-soft); margin: 0; text-transform: uppercase; letter-spacing: .02em; }
  .card-note { font-size: 11px; color: var(--ink-soft); margin: 10px 0 0; line-height: 1.45; }
  .collapsible-card summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .collapsible-card > summary::after { content: '▶'; font-size: 11px; color: var(--ink-soft); }
  .collapsible-card[open] > summary::after { content: '▼'; }
  .sum-right { display: flex; align-items: baseline; gap: 8px; margin-left: auto; }
  .sum-val { font-size: 18px; font-weight: 800; }

  .hero { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 10px; border: 1px solid var(--line); }
  .hero-label { font-size: 10px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .02em; }
  .hero-row { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 10px; }
  .hero-pct { font-size: 34px; font-weight: 800; line-height: 1; }
  .goal-track { height: 8px; background: var(--line); border-radius: 4px; position: relative; }
  .goal-fill { height: 100%; border-radius: 4px; }
  .goal-mark { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--ink); border-radius: 1px; }
  .goal-cap { font-size: 9px; color: var(--ink-soft); font-weight: 700; text-align: right; margin-top: 4px; }

  .rating-delta { font-size: 11px; font-weight: 700; white-space: nowrap; }
  .rating-delta.up { color: var(--green); } .rating-delta.down { color: var(--red-dark); } .rating-delta.neutral { color: var(--ink-soft); font-weight: 600; }

  .bar-row { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .bar-row:last-child { border-bottom: none; }
  .bar-row-label { font-size: 13px; font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .bar-row-track-wrap { display: flex; align-items: center; gap: 8px; }
  .bar-row-track { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; position: relative; }
  .bar-row-fill { height: 100%; border-radius: 4px; }
  .bar-row-pct { font-size: 13px; font-weight: 800; width: 40px; text-align: right; flex-shrink: 0; }
  .goal-tick { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(44,42,38,.55); }

  .day-tiles-row { display: flex; gap: 5px; margin-top: 12px; }
  .day-tile { flex: 1; background: var(--bg); border-radius: 10px; padding: 10px 4px; text-align: center; }
  .day-tile .val { font-size: 18px; font-weight: 800; }
  .day-tile .lbl { font-size: 10px; color: var(--ink-soft); font-weight: 600; margin-top: 3px; }

  .alert-card { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  .alert-card h3 { font-size: 12px; font-weight: 700; color: var(--red-dark); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .02em; }
  .alert-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid rgba(169,59,48,.14); font-size: 12px; }
  .alert-row:first-of-type { border-top: none; }
  .alert-row b { color: var(--ink); }
  .alert-row span:last-child { font-weight: 800; color: var(--red-dark); white-space: nowrap; }
  .alert-card .card-note { color: var(--ink-soft); }

  .cat-head { font-size: 12px; font-weight: 800; margin: 12px 0 2px; display: flex; justify-content: space-between; }
  .cat-head:first-of-type { margin-top: 10px; }

  .chart-wrap { margin-top: 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 10.5px; color: var(--ink-soft); font-weight: 600; margin-top: 6px; }
  .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .seg { display: flex; background: var(--line); border-radius: 11px; padding: 3px; margin-bottom: 12px; }
  .seg button { flex: 1; border: none; background: transparent; font-family: inherit; font-size: 12px; font-weight: 700; color: var(--ink-soft); padding: 8px 0; border-radius: 8px; cursor: pointer; }
  .seg button.active { background: var(--card); color: var(--ink); }

  .alert-card summary::after { color: var(--red-dark) !important; }
  .alert-item { padding: 10px 0; border-top: 1px solid rgba(169,59,48,.14); }
  .alert-item:first-of-type { margin-top: 8px; }
  .alert-top { display: flex; justify-content: space-between; font-size: 13px; }
  .alert-top span { font-weight: 800; color: var(--red-dark); }
  .alert-why { font-size: 11px; color: var(--ink-soft); margin-top: 3px; line-height: 1.4; }
  .mini-weeks { display: flex; gap: 4px; margin-top: 7px; }
  .mini-weeks span { flex: 1; text-align: center; font-size: 10px; font-weight: 800; color: #fff; border-radius: 6px; padding: 3px 0; }
  .alert-act, .to-dyn { font-size: 11.5px; font-weight: 700; color: var(--blue); margin-top: 8px; cursor: pointer; }
  .to-dyn { text-align: right; margin-top: 10px; }
  .cat-chips { display: flex; gap: 6px; margin: 12px 0 4px; }
  .cat-sel { flex: 1; border: none; background: var(--bg); border-radius: 10px; padding: 7px 6px; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .cat-sel span { font-size: 10.5px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .cat-sel b { font-size: 13px; }
  .cat-sel.on { background: var(--ink); } .cat-sel.on span { color: #fff; }
  .sum-right .rating-delta { font-size: 10.5px; }

  .alert-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; font-size: 13px; }
  .alert-line:first-of-type { margin-top: 8px; }
  .alert-line > span { font-weight: 800; color: var(--ink); white-space: nowrap; }
  .lvl-bar { flex: 1; height: 8px; border-radius: 4px; overflow: hidden; display: flex; }
  .lvl-bar i { display: block; height: 100%; }

  details.br > summary { list-style: none; cursor: pointer; }
  details.br > summary::-webkit-details-marker { display: none; }
  .br-arrow { color: var(--ink-soft); font-weight: 700; display: inline-block; transition: transform .15s; }
  details.br[open] .br-arrow { transform: rotate(90deg); }
  .how { margin-left: auto; font-size: 11.5px; font-weight: 700; color: var(--blue); }
  .comp { background: var(--bg); border-radius: 12px; padding: 10px; margin: 2px 0 8px; }
  .comp .day-tile { background: var(--card); padding: 8px 2px; }
  .comp .day-tile .val { font-size: 15px; }
  .tile-d .rating-delta { font-size: 9.5px; }
  .formula { text-align: center; font-size: 11.5px; color: var(--ink-soft); font-weight: 600; margin: 8px 0 6px; }
  .formula b { color: var(--ink); }
  .cat-mini { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
  .cat-mini .cat-chip { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
  .kb-line { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; color: var(--ink-soft); margin-top: 10px; }
  .kb-line b { font-size: 11px; white-space: nowrap; }

  .load-line { background: var(--card); border-radius: 10px; padding: 8px 10px; margin-top: 5px; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .load-line b { font-size: 15px; white-space: nowrap; }
  .load-link { cursor: pointer; margin-bottom: 7px; border: 1.5px dashed #D9CFC2; }
  .load-top { border: 1.5px dashed #D9CFC2; border-radius: 10px; padding: 8px 10px; margin-bottom: 7px; }
  .load-top .load-line { background: none; padding: 0; margin: 0; }
  .load-top summary { list-style: none; cursor: pointer; }
  .load-box { background: var(--card); border-radius: 10px; padding: 8px 10px 4px; margin-top: 10px; border-left: 3px solid var(--red); }
  .load-box.hi { border-left-color: var(--green); }
  .load-box-h { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--red); margin-bottom: 2px; }
  .load-box.hi .load-box-h { color: var(--green); }
  .load-ag-sub em { text-align: right; }
  .gap { display: block; font-size: 11.5px; color: var(--ink); }

  .load-ag { display: block; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .load-ag:last-child { border-bottom: none; }
  .load-ag-top { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
  .load-ag-top b { white-space: nowrap; }
  .load-ag-top small { font-size: 10.5px; color: var(--ink-soft); font-weight: 600; }
  .load-ag-sub { display: flex; justify-content: space-between; gap: 8px; margin-top: 2px; font-size: 11.5px; color: var(--ink-soft); }
  .load-ag-sub i { display: block; font-style: normal; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; opacity: .8; }
  .load-ag-sub em { font-style: normal; white-space: nowrap; }
  .load-sub { font-size: 10.5px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; margin: 9px 0 3px; }
  .load-base { font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; }
  .load-base b { color: var(--ink); }
  .load-tab { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .load-tab td { padding: 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .load-tab td + td { text-align: right; font-weight: 800; font-size: 14px; }
  .load-tab td.pm { color: var(--ink-soft); font-weight: 600; font-size: 12.5px; }
  .load-tab th { font-size: 10.5px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; text-align: right; padding: 6px 0 3px 8px; }
  .load-tab th:first-child { text-align: left; padding-left: 0; }
  .load-tab small { display: block; font-size: 10.5px; color: var(--ink-soft); font-weight: 500; }
  .load-note { font-size: 11.5px; color: var(--ink-soft); line-height: 1.45; margin-top: 8px; background: var(--card); border-radius: 8px; padding: 7px 9px; }
  .load-note b { color: var(--ink); }
  .load-legend { font-size: 10.5px; color: var(--ink-soft); text-align: center; margin: 2px 0 4px; }
  .load-cnt { font-size: 12px; font-weight: 600; margin-top: 5px; color: var(--ink); }
  .load-drop { color: var(--red); font-size: 11.5px; font-weight: 700; margin-top: 5px; }
  .fl { color: var(--blue); }
  .rt-sec { font-size: 10.5px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; margin: 12px 0 5px; }
  .rt-box { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .rt-ln { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; font-weight: 600; }
  .rt-ln b { font-size: 18px; }
  .rt-sm { font-size: 12px; margin-top: 4px; color: var(--ink); }
  .rt-sm.soft { color: var(--ink-soft); }
  .rt-row { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .tiles3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
  .kb-text { text-align: center; font-size: 11.5px; color: var(--ink-soft); font-weight: 600; margin: 0 0 8px; }
  .kb-text b { color: var(--ink); }

  .rate-tabs { display: flex; background: var(--bg); border-radius: 11px; padding: 3px; margin: 10px 0 6px; }
  .rate-tabs button { flex: 1; border: none; background: transparent; font-family: inherit; font-size: 11.5px; font-weight: 700; color: var(--ink-soft); padding: 8px 0; border-radius: 8px; cursor: pointer; }
  .rate-tabs button.active { background: var(--card); color: var(--ink); }
  .rate-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .rate-n { width: 22px; height: 22px; border-radius: 7px; background: var(--bg); font-size: 11px; font-weight: 800; color: var(--ink-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rate-n.top { background: var(--green-bg); color: var(--green); }
  .rate-name { flex: 1; min-width: 0; }
  .rate-sub { font-size: 10px; color: var(--ink-soft); font-weight: 600; }
  .rate-pct { font-size: 14px; font-weight: 800; width: 50px; text-align: right; }   /* 15.10.2026: один знак — шире */
  .loader { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 12px; color: var(--ink-soft); }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--amber); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 40px 16px; color: var(--ink-soft); font-size: 14px; }
  .ok-card { background: var(--green-bg); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; font-size: 13px; font-weight: 700; color: var(--green); }
  .more-chip { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--line); color: var(--ink-soft); cursor: pointer; }
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin: -4px 0 14px; }
  .month-nav button { border: none; background: var(--card); border-radius: 100px; width: 32px; height: 32px; font-size: 15px; font-weight: 800; color: var(--ink-soft); cursor: pointer; }
  .month-nav button:disabled { opacity: .35; cursor: default; }
  .month-nav span { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .cat-chips { overflow-x: auto; }
  .cat-sel { min-width: 84px; }

  .alert-sec { font-size: 10px; font-weight: 800; color: var(--red-dark); text-transform: uppercase; letter-spacing: .03em; margin: 14px 0 2px; }
  .alert-ok { font-size: 12px; font-weight: 700; color: var(--green); padding: 6px 0; }
  .ghost-chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 2px; }
  .ghost-chips span { font-size: 10.5px; font-weight: 600; background: var(--bg); color: var(--ink); border-radius: 6px; padding: 2px 7px; }
  .la-tab { width: 100%; border-collapse: collapse; font-size: 11.5px; margin: 6px 0 4px; }
  .la-tab th { text-align: left; font-size: 10px; color: var(--ink-soft); font-weight: 700; padding: 3px 4px; }
  .la-tab td { padding: 4px; border-top: 1px solid var(--line); }
  .la-tab td.grp { font-weight: 800; font-size: 11px; padding-top: 8px; }
  .back-btn { display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--blue); background: var(--card); border-radius: 100px; padding: 7px 14px; margin: -4px 0 12px; cursor: pointer; }
  .how-box { background: var(--blue-bg); border-radius: 10px; padding: 10px 12px; margin: 10px 0 4px; }
  .how-box summary { list-style: none; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--blue); }
  .how-box ol { font-size: 11.5px; line-height: 1.45; padding-left: 18px; margin: 8px 0; color: var(--ink); }
  .how-box .la-tab td { border-top: 1px solid rgba(59,125,219,.15); }
  .small-note { font-size: 11px; color: var(--ink-soft); margin: 4px 0 0; }
  .show-more-btn { display: block; width: 100%; font-size: 13px; font-weight: 700; padding: 11px; border-radius: 12px; border: 1px dashed var(--ink-soft); background: transparent; color: var(--ink-soft); cursor: pointer; font-family: inherit; margin-top: 8px; }
  .t5-team { border-top: 1px solid rgba(59,125,219,.18); }
  .t5-team summary { list-style: none; color: var(--ink); display: flex; justify-content: space-between; align-items: center; padding: 8px 0; cursor: pointer; font-size: 12.5px; }
  .t5-sub { display: block; font-size: 10.5px; color: var(--ink-soft); font-weight: 600; }
  .t-soft { color: var(--ink-soft); font-size: 11px; }
  .al-val { text-align: right; }
  .al-val small { display: block; font-size: 10px; font-weight: 700; color: var(--ink-soft); }
  .dyn-head { font-size: 12px; line-height: 1.5; background: var(--bg); border-radius: 10px; padding: 8px 10px; margin-top: 10px; }
  .period { font-size: 12.5px; line-height: 1.5; background: var(--bg); border-radius: 10px; padding: 8px 10px; margin: 8px 0; color: var(--ink); }
  .howread { background: var(--card); border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; font-size: 12px; line-height: 1.5; }
  .howread summary, .routes summary { list-style: none; cursor: pointer; }
  .howread summary { font-weight: 700; color: var(--blue); }
  .howread[open] summary { margin-bottom: 4px; }
  .routes { background: var(--card); border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; font-size: 12px; line-height: 1.5; border-left: 4px solid var(--blue); }
  .day-card .routes { border: 1px solid var(--line); border-left: 4px solid var(--blue); }
  .rt-h { font-weight: 800; }
  .rt-b { font-weight: 800; font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .03em; margin: 8px 0 2px; }
  .rt-l { margin: 3px 0; } .rt-s { color: var(--ink-soft); font-size: 11px; margin-top: 4px; }
  .explain-in { font-size: 12px; line-height: 1.5; margin-top: 6px; }
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div style="display:flex;flex-direction:column;min-width:0;">
      <h1 id="topTitle" style="margin:0 0 6px;">Загрузка...</h1>
      <div style="display:flex;align-items:center;gap:8px;">
        <div id="roleIcon" style="width:22px;height:22px;border-radius:7px;background:var(--ink-soft);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0;">Р</div>
        <div style="font-size:12px;color:var(--ink-soft);"><span id="roleName">Руководитель</span> <span id="personName" style="font-weight:600;color:var(--ink);"></span></div>
      </div>
    </div>
    <div class="top-pill" id="topPill" style="display:none"></div>
  </div>
  <div class="content" id="mainContent"><div class="loader"><div class="spinner"></div><span>Загрузка данных...</span></div></div>
  <div class="tabbar">
    <button class="tab active" data-s="sum" onclick="go('sum')"><span class="icon">🧭</span>Сводка</button>
    <button class="tab" data-s="dyn" onclick="go('dyn')"><span class="icon">📈</span>Динамика</button>
    <button class="tab" data-s="month" onclick="go('month')"><span class="icon">📊</span>Итоги месяца</button>
    <button class="tab" data-s="routes" onclick="go('routes')"><span class="icon">🗺</span>Маршруты</button>
  </div>
</div>
<script>
// leader-app.html — общий дашборд руководителя (директор, РФ, НТО), 09.10.2026.
// Данные: /api/leader/{id}/summary (недели, текущая неделя, «Требует решения»)
// и /api/leader/{id}/month (закрытый месяц, рейтинги). Проценты уже посчитаны

}
function monthNav(m) {
  const t = new Date(S.sum ? S.sum.today + 'T00:00:00' : Date.now());
  const isLast = (m.year * 12 + m.month) >= (t.getFullYear() * 12 + t.getMonth());
  return `<div class="month-nav"><button onclick="shiftMonth(-1)">‹</button><span>${MONTHS[m.month - 1]} ${m.year}${m.closed ? ' · закрыт' : ''}</span><button onclick="shiftMonth(1)" ${isLast ? 'disabled' : ''}>›</button></div>`;
}
async function shiftMonth(step) {
  let { month, year } = S.month;
  month += step; if (month < 1) { month = 12; year--; } if (month > 12) { month = 1; year++; }
  S.month = null; render();
  await loadMonth(month, year); render();
}

// ---------- Общее ----------
function setPill(t) { const p = document.getElementById('topPill'); p.textContent = t; p.style.display = t ? '' : 'none'; }
function openDyn(card) {
  if (S.screen === 'sum') { S.fromSum = true; S.sumScroll = document.getElementById('mainContent').scrollTop; }
  S.open.dyn = card; go('dyn', true);
}
function backToSum() { S.fromSum = false; go('sum', true); document.getElementById('mainContent').scrollTop = S.sumScroll; }
function render() {
  const c = document.getElementById('mainContent'), y = c.scrollTop;
  if (!S.sum) return;
  c.innerHTML = S.screen === 'sum' ? screenSummary() : S.screen === 'dyn' ? screenDynamics() : S.screen === 'routes' ? screenRoutes() : screenMonth();
  c.scrollTop = y;
}
async function go(s, keepFrom) {
  if (!keepFrom) S.fromSum = false;
  S.screen = s;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.s === s));
  document.getElementById('mainContent').scrollTop = 0;
  render();
  if (s === 'month' && !S.month) { await loadMonth(); render(); }
  if (s === 'routes' && !S.routes) { await loadRoutes(); render(); }
}
// 16.10.2026: «Маршруты» — отдельный запрос, только когда открыли вкладку
async function loadRoutes() {
  try {
    const r = await fetch(`${API}/api/leader/${S.id}/routes`);
    if (!r.ok) throw new Error(r.status);
    S.routes = await r.json();
  } catch (e) { S.routes = { error: true }; }
}
function screenRoutes() {
  setPill('месяц');
  const R = S.routes;
  if (!R) return '<div class="loader"><div class="spinner"></div><span>Загрузка маршрутов...</span></div>';
  if (R.error) return '<div class="empty">⚠️ Не удалось загрузить маршруты. Попробуйте позже.</div>';
  let html = '';
  const r = R.load, pv = r && r.prev;
  // 16.10.2026: сигнал — агентов НИЖЕ нормы стало больше, чем в прошлом месяце (недогруженные маршруты)
  if (r && pv && r.n && pv.n && r.below > pv.below)
    html += `<div class="alert-card" style="margin-bottom:10px"><b>Агентов ниже нормы стало больше</b><div class="alert-why">В прошлом месяце ${num(pv.below)}, сейчас ${num(r.below)} ▲ +${num(r.below - pv.below)} — у них меньше ${r.base_month ? num(Math.round(r.base_month * NORM(r)[0] / 100)) + ' визитов в месяц' : NORM(r)[0] + '% визитов типичного агента'}. Кто именно — ниже, «Меньше всего визитов».</div></div>`;
  if (r && r.min != null) html += loadDetails(r);
  return html || '<div class="empty">По маршрутам пока нет данных.</div>';
}
async function loadMonth(month, year) {
  try {
    const q = month ? `?month=${month}&year=${year}` : '';
    const r = await fetch(`${API}/api/leader/${S.id}/month${q}`);
    if (!r.ok) throw new Error(r.status);
    S.month = await r.json();
  } catch (e) { S.month = { month: month || 1, year: year || 2026, closed: false }; }
}
async function main() {
  S.id = getTelegramId();
  const m = document.getElementById('mainContent');
  if (!S.id) { m.innerHTML = '<div class="empty">Откройте дашборд из бота</div>'; return; }
  try {
    const r = await fetch(`${API}/api/leader/${S.id}/summary`);
    if (r.status === 403) { m.innerHTML = '<div class="empty">Этот экран — для директора, руководителя филиала и руководителя продаж.</div>'; return; }
    if (!r.ok) throw new Error(r.status);
    S.sum = await r.json();
  } catch (e) { m.innerHTML = '<div class="empty">⚠️ Не удалось загрузить данные. Попробуйте позже.</div>'; return; }
  document.getElementById('topTitle').textContent = S.sum.company;
  document.getElementById('roleName').textContent = S.sum.role_name;
  document.getElementById('roleIcon').textContent = S.sum.role_name[0];
  document.getElementById('personName').textContent = S.sum.name;
  render();
}
if (window.Telegram?.WebApp) { try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) {} }
main();
</script>
