<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>СТТ — планировщик команды</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* planner.html — Планировщик команды stt-app (05.10.2026).
   Открывается командой /planner в боте или ссылкой t.me/CTTCMK_bot/planner.
   Все данные — через /api/planner/... (planner_api.py), права и скрытие лишнего — на сервере.
   ?dev=1 — работа с develop-сервисом Railway. */

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--page:#D9DEE3;--bg:#F1F3F5;--sf:#FFFFFF;--ink:#17212B;--mut:#56616C;--line:#D6DCE2;--acc:#1F6FBF;--acc-ink:#fff;--warn-bg:#FDECEC;--warn-bd:#E3A0A0;--red:#B71C1C;--ok-bg:#E6F4EA;--ok-bd:#A9D5B6;
--plan:#E4F0FC;--plan-bd:#9CC4EE;--conf:#FFFFFF;--conf-bd:#C3CCD5;--done:#DDF2E3;--done-bd:#9ED0AE;--pend:#FFF4C7;--pend-bd:#E3C64F;--grey:#E5E8EB;--grey-bd:#C3C9CF;--team:#FFE8D1;--team-bd:#EDB073;--mkt:#EEE7FB;--mkt-bd:#B9A3EA;--chat:#D3E0EA;--kb:#5C7A93}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0E1419;--bg:#151C23;--sf:#1E2730;--ink:#E8EDF2;--mut:#A3AEB9;--line:#33404C;--acc:#4A9BE8;--acc-ink:#0E1419;--warn-bg:#3A2224;--warn-bd:#8A4448;--red:#FF8A80;--ok-bg:#1E3527;--ok-bd:#3F7553;
--plan:#1C3550;--plan-bd:#3D6D9E;--conf:#1E2730;--conf-bd:#4A5865;--done:#1E3A29;--done-bd:#3F7553;--pend:#3D3417;--pend-bd:#8C7A2E;--grey:#2A3138;--grey-bd:#4A535C;--team:#40301D;--team-bd:#9A6A37;--mkt:#2F2745;--mkt-bd:#6E5BA6;--chat:#0F1820;--kb:#3A5468}}
:root[data-theme="dark"]{--page:#0E1419;--bg:#151C23;--sf:#1E2730;--ink:#E8EDF2;--mut:#A3AEB9;--line:#33404C;--acc:#4A9BE8;--acc-ink:#0E1419;--warn-bg:#3A2224;--warn-bd:#8A4448;--red:#FF8A80;--ok-bg:#1E3527;--ok-bd:#3F7553;--plan:#1C3550;--plan-bd:#3D6D9E;--conf:#1E2730;--conf-bd:#4A5865;--done:#1E3A29;--done-bd:#3F7553;--pend:#3D3417;--pend-bd:#8C7A2E;--grey:#2A3138;--grey-bd:#4A535C;--team:#40301D;--team-bd:#9A6A37;--mkt:#2F2745;--mkt-bd:#6E5BA6;--chat:#0F1820;--kb:#3A5468}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);font-size:14px;line-height:1.38}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.phone{max-width:430px;margin:0 auto 24px;background:var(--bg);min-height:760px;border-radius:18px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.hd{background:var(--sf);padding:14px 16px 0;border-bottom:1px solid var(--line)}
.h1{font-size:20px;font-weight:600;margin:0}
.h2{font-size:17px;font-weight:600;margin:0}
.mut{color:var(--mut);font-size:12px}
.tabs{display:flex;margin-top:8px}
.tab{flex:1;min-height:44px;border:0;background:none;font-weight:500;color:var(--mut);border-bottom:2px solid transparent;position:relative}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.badge{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:#D32F2F;color:#fff;font-size:11px;line-height:18px;padding:0 5px;margin-left:4px}
.body{padding:12px 14px 90px;display:flex;flex-direction:column;gap:10px;flex:1}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dbtn{min-height:52px;border:1px solid var(--line);background:var(--sf);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;padding:0}
.dbtn b{font-size:15px}
.dbtn.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.ev{display:flex;gap:8px;align-items:flex-start}
.t{width:44px;flex:none;font-weight:600;font-size:13px;padding-top:11px}
.c{flex:1;border:1px solid;border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;background:var(--sf)}
.plan{background:var(--plan);border-color:var(--plan-bd)}.conf{background:var(--conf);border-color:var(--conf-bd)}.done{background:var(--done);border-color:var(--done-bd)}.pend{background:var(--pend);border-color:var(--pend-bd)}.grey{background:var(--grey);border-color:var(--grey-bd)}.team{background:var(--team);border-color:var(--team-bd)}.mkt{background:var(--mkt);border-color:var(--mkt-bd)}
.clash{border:2px solid var(--red)!important}
.ty{font-size:12px;font-weight:600;color:var(--mut)}
.nm{font-weight:600;font-size:15px}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:rgba(127,140,153,.18)}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--sf);font-weight:500;padding:0 12px}
.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn:disabled{background:var(--grey);border-color:var(--grey-bd);color:var(--mut);cursor:not-allowed}
.red{color:var(--red)}
.lbl{font-size:12px;color:var(--mut);font-weight:500;margin-bottom:4px;display:block}
.inp{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--sf);padding:10px 12px;width:100%}
textarea.inp{min-height:66px;resize:vertical}
.box{background:var(--sf);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.warn{background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:6px}
.ok{background:var(--ok-bg);border:1px solid var(--ok-bd);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.chip{min-height:38px;border-radius:999px;border:1px solid var(--line);background:var(--sf);font-size:13px;padding:0 12px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv{display:flex;justify-content:space-between;gap:8px;align-items:center}
.fab{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:8px}
.fab .btn{flex:1;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.ov{position:fixed;inset:0;background:rgba(10,16,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:430px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:0 0 calc(16px + env(safe-area-inset-bottom,0px))}
.sh-hd{position:sticky;top:0;background:var(--sf);padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:2}
.sh-b{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sug{display:flex;flex-direction:column;margin-top:4px;border:1px solid var(--line);border-radius:10px;background:var(--sf);overflow:hidden}
.sug button{min-height:44px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:0 12px}
.sug button:last-child{border-bottom:0}
.wk{display:grid;grid-template-columns:26px repeat(7,minmax(0,1fr));gap:3px;font-size:10px;line-height:1.15}
.wcol{position:relative;height:450px;background:var(--sf);border-radius:6px}
.wcol.on{outline:2px solid var(--acc)}
.wb{position:absolute;border:1px solid;border-radius:5px;padding:2px 3px;font-size:10px;line-height:1.15;overflow:hidden;text-align:left}
.whd{text-align:center;min-height:36px;border:0;background:none;padding:0;font-size:10px}
.whd.on{color:var(--acc)}
.chat{background:var(--chat);padding:12px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:600px}
.bub{background:var(--sf);border-radius:14px 14px 14px 4px;padding:9px 12px;white-space:pre-line;max-width:340px}
.bub .tm{display:block;text-align:right;font-size:11px;color:var(--mut);margin-top:2px}
.kb{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;max-width:340px}
.kbb{flex:1 1 30%;min-height:40px;border:0;border-radius:10px;background:var(--kb);color:#fff;font-weight:500;padding:0 8px}
.tg{background:var(--sf);padding:10px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;font-weight:600}
.tzb{margin:10px 14px 0;background:var(--pend);border:1px solid var(--pend-bd);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.tog{display:flex;justify-content:space-between;align-items:center;min-height:44px;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:0}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

.phone{border-radius:0;min-height:100vh;margin:0 auto}
@media (min-width:460px){.phone{border-radius:18px;margin:12px auto 24px;min-height:760px}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
var API=new URLSearchParams(location.search).get('dev')==='1'?'https://develop-production-0a2d.up.railway.app':'https://worker-production-1dfb.up.railway.app';
var TG=window.Telegram&&window.Telegram.WebApp;var INIT=TG?TG.initData:'';
var QS=new URLSearchParams(location.search);
var TZN={'Europe/Kiev':'Киев','Europe/Kyiv':'Киев','Europe/Vienna':'Вена','Asia/Tbilisi':'Тбилиси','Europe/Moscow':'Москва','Asia/Bangkok':'Бангкок','Asia/Tashkent':'Ташкент','Asia/Almaty':'Алматы','Europe/Warsaw':'Варшава','Europe/Berlin':'Берлин','Asia/Dubai':'Дубай','Europe/Istanbul':'Стамбул'};
var TZLIST=['Europe/Kiev','Europe/Vienna','Asia/Tbilisi','Europe/Moscow','Asia/Tashkent','Asia/Almaty','Europe/Warsaw','Europe/Berlin','Europe/Istanbul','Asia/Dubai','Asia/Bangkok'];
var TYPES={zoom_client:{label:'Zoom-встреча с клиентом',client:true,zoom:true},session:{label:'Рабочая сессия с клиентом',client:true,zoom:false},one2one:{label:'Встреча с сотрудником',client:false,zoom:false},team:{label:'Собрание команды',client:false,zoom:true},mkt:{label:'Маркетинг коммуникации',client:false,zoom:true},personal:{label:'Личное время'}};
var KINDS=['Личное','Перелёт','Отпуск'],DEPT={lead:'Руководитель',sales:'Продажи',mkt:'Маркетинг'};
var DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],DF=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
var MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var REM=[['1d','За 1 день'],['2h','За 2 часа'],['1h','За 1 час'],['30m','За 30 минут'],['15m','За 15 минут'],['5m','За 5 минут']];
var H=3600000,M=60000,DAY=86400000;
var TIMES=[];for(var hh=6;hh<=22;hh++){TIMES.push(pad(hh)+':00');TIMES.push(pad(hh)+':30')}
var fmts={};
function pad(n){return (n<10?'0':'')+n}
function parts(ts,tz){var f=fmts[tz]||(fmts[tz]=new Intl.DateTimeFormat('en-GB',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}));var o={};f.formatToParts(new Date(ts)).forEach(function(p){o[p.type]=p.value});return {y:+o.year,m:+o.month,d:+o.day,h:+o.hour%24,mi:+o.minute}}
function off(ts,tz){var p=parts(ts,tz);return Date.UTC(p.y,p.m-1,p.d,p.h,p.mi)-Math.floor(ts/M)*M}
function toUtc(y,m,d,h,mi,tz){var g=Date.UTC(y,m-1,d,h,mi);var u=g-off(g,tz);return g-off(u,tz)}
function hm(ts,tz){var p=parts(ts,tz);return pad(p.h)+':'+pad(p.mi)}
function dkey(ts,tz){var p=parts(ts,tz);return p.y+'-'+pad(p.m)+'-'+pad(p.d)}
function kp(k){var a=k.split('-');return {y:+a[0],m:+a[1],d:+a[2]}}
function kadd(k,n){var p=kp(k),d=new Date(Date.UTC(p.y,p.m-1,p.d+n));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function kwd(k){var p=kp(k);return (new Date(Date.UTC(p.y,p.m-1,p.d)).getUTCDay()+6)%7}
function monday(k){return kadd(k,-kwd(k))}
function dstart(k,tz){var p=kp(k);return toUtc(p.y,p.m,p.d,0,0,tz)}
function dend(k,tz){return dstart(kadd(k,1),tz)}
function at(k,t,tz){var p=kp(k),a=t.split(':');return toUtc(p.y,p.m,p.d,+a[0],+a[1],tz)}
function dlab(ts,tz){var p=parts(ts,tz);return p.d+' '+MON[p.m-1]}
function klab(k){var p=kp(k);return p.d+' '+MON[p.m-1]}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function tzn(z){return TZN[z]||z}
function normTz(z){return z==='Europe/Kyiv'?'Europe/Kiev':z}

var S={me:null,users:{},clients:[],wk:{},tab:'today',day:null,week0:null,modal:null,form:null,rf:null,cf:'',tf:null,detail:null,busy:false,device:null,fatal:null};
var app=document.getElementById('app');

function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show')},3600)}
function api(path,opts){opts=opts||{};return fetch(API+'/api/planner'+path,{method:opts.method||'GET',headers:{'X-Telegram-Init-Data':INIT,'Content-Type':'application/json'},body:opts.body?JSON.stringify(opts.body):undefined}).then(function(r){return r.json().catch(function(){return null}).then(function(d){if(!r.ok)throw new Error((d&&d.detail)||('Ошибка сервера '+r.status));return d})})}

/* ---------- люди и события ---------- */
function me(){return S.me.id}
function vtz(){return S.me.tz}
function U(id){return S.users[id]}
function isLead(id){var u=U(id);return !!(u&&u.dept==='lead')}
function isUser(id){return !!(id&&U(id))}
function uname(id){if(!id)return '';if(String(id).indexOf('ext:')===0)return id.slice(4)+' · внешний';var u=U(id);if(!u)return '';return u.dept==='lead'?'Руководитель':u.name}
function actUsers(){return Object.keys(S.users).filter(function(x){return S.users[x].active})}
function evs(){var m={};Object.keys(S.wk).forEach(function(k){(S.wk[k]||[]).forEach(function(e){m[e.id]=e})});return Object.keys(m).map(function(k){return m[k]})}
function ev(id){return evs().filter(function(e){return e.id===+id})[0]}
function active(e){if(e.masked)return true;return e.client!=='CLIENT_CANCELLED'&&e.approval!=='DECLINED'}
function involved(e,u){if(e.masked)return e.people.indexOf(u)>=0;if(e.type==='personal')return e.owner===u;return e.lead===u||e.staff===u||e.parts.indexOf(u)>=0}
function leadsIn(e){return people(e).filter(isLead)}
function people(f){if(f.masked)return f.people.slice();if(f.type==='team')return actUsers();var a=[];if(f.type==='personal'){if(isUser(f.owner))a.push(f.owner);return a}if(isUser(f.lead))a.push(f.lead);if(isUser(f.staff))a.push(f.staff);(f.parts||[]).forEach(function(u){if(isUser(u))a.push(u)});return a.filter(function(x,i){return a.indexOf(x)===i&&U(x).active})}
function overlap(a,b,c,d){return a<d&&c<b}
function conflicts(start,end,ppl,zoom,exId){var r={people:[],zoom:null};evs().forEach(function(e){if(e.id===exId||!active(e)||!overlap(start,end,e.start,e.end))return;ppl.forEach(function(u){if(involved(e,u))r.people.push({u:u,e:e})});if(zoom&&e.zoom&&e.type!=='personal'&&!r.zoom)r.zoom=e});return r}
function freeSlots(k,dur,ppl,zoom,exId,cur){var out=[],tz=vtz();TIMES.forEach(function(t){if(out.length>=5||t<'08:00'||t>'20:00'||t===cur)return;var s=at(k,t,tz),c=conflicts(s,s+dur,ppl,zoom,exId);if(!c.people.length&&!c.zoom)out.push(t)});return out}
function stat(e){if(e.masked)return {cls:'grey',ic:'',ap:'',cs:''};var cls;
if(e.type==='personal'||!active(e))cls='grey';else if(e.client==='DONE')cls='done';else if(e.type==='team')cls='team';else if(e.type==='mkt')cls='mkt';else if(e.approval==='PENDING'||e.approval==='RESCHEDULE_REQUESTED')cls='pend';else if(e.client==='CLIENT_CONFIRMED'||e.type==='one2one')cls='conf';else cls='plan';
var ap={NONE:'',PENDING:'⏳ Ждёт руководителя',APPROVED:'✓ Руководитель согласовал',DECLINED:'❌ Руководитель отказал',RESCHEDULE_REQUESTED:e.clashBusy?'🔄 Нужен перенос: руководитель занят':'🔄 Руководитель предложил другое время'}[e.approval]||'';
if(isLead(e.createdBy)&&e.approval==='APPROVED')ap='';
var cs='';if(TYPES[e.type].client)cs={PLANNING:'○ Клиент не подтвердил',CLIENT_CONFIRMED:'✓ Клиент подтвердил',CLIENT_RESCHEDULED:'🔄 Клиент перенёс',CLIENT_CANCELLED:'❌ Клиент отменил',DONE:'✓✓ Встреча прошла'}[e.client];else if(e.client==='CLIENT_CANCELLED')cs='❌ Отменено';else if(e.client==='DONE')cs='✓✓ Прошло';
var ic=e.client==='DONE'?'✓✓':!active(e)?'❌':e.approval==='PENDING'?'⏳':(e.approval==='RESCHEDULE_REQUESTED'||e.client==='CLIENT_RESCHEDULED')?'🔄':e.client==='CLIENT_CONFIRMED'?'✓':TYPES[e.type].client?'○':'';
return {cls:cls,ic:ic,ap:ap,cs:cs}}
function clash(e){return !e.masked&&e.clashBusy&&e.approval==='RESCHEDULE_REQUESTED'&&active(e)}
function nameOf(e){if(e.masked)return e.label;if(e.type==='personal')return e.title;if(TYPES[e.type].client)return e.clientName+' · '+e.contact;if(e.type==='one2one')return 'Руководитель · '+uname(e.staff);if(e.type==='team')return 'Собрание команды';return e.title}
function shortOf(e){if(e.masked)return e.label.indexOf('Руководитель')===0?'Рук. занят':'Занят';if(e.type==='personal')return e.title;if(TYPES[e.type].client)return e.clientName.split(' ')[0];if(e.type==='one2one')return '1:1';if(e.type==='team')return 'Собрание';return 'Маркетинг'}
function timesFor(e){var u=me(),a=[{l:'Моё время',t:hm(e.start,vtz()),z:tzn(vtz())}];
if(!isLead(u)){var l=leadsIn(e)[0];if(l)a.push({l:'Руководитель',t:hm(e.start,U(l).tz),z:tzn(U(l).tz)})}
else{var o=isUser(e.staff)&&!isLead(e.staff)?e.staff:(isUser(e.lead)&&!isLead(e.lead)?e.lead:null);if(o)a.push({l:uname(o),t:hm(e.start,U(o).tz),z:tzn(U(o).tz)})}
if(e.clientTz)a.push({l:'Клиент',t:hm(e.start,e.clientTz),z:tzn(e.clientTz)});return a}

case 'pkind':S.form.kind=v;break;
case 'pall':S.form.allDay=!S.form.allDay;break;
case 'psave':var r=prange(),pf=S.form,sd=pf.sDay;guard(api('/personal',{method:'POST',body:{title:pf.title.trim(),kind:pf.kind,allDay:pf.allDay,start:r[0],end:r[1]}}),'Сохранено',function(x){S.modal=null;S.form=null;if(x&&x.clashes)toast('Сохранено. Запрос на перенос: '+x.clashes);goDay(sd)});return;
case 'remtog':var rm=(S.me.rem||[]).slice(),j=rm.indexOf(v);if(j>=0)rm.splice(j,1);else rm.push(v);S.me.rem=rm;api('/me/settings',{method:'POST',body:{rem:rm}}).catch(function(e){toast(e.message)});break;
case 'tzUpdate':guard(api('/me/settings',{method:'POST',body:{tz:normTz(S.device)}}),'Часовой пояс обновлён',function(){S.wk={};return loadMe()});return;
case 'tzKeep':S.me.tzKeep=S.device;api('/me/settings',{method:'POST',body:{tzKeep:S.device}}).catch(function(){});break;
case 'tadd':var f=S.tf;guard(api('/team',{method:'POST',body:f}),'Сотрудник добавлен',function(){S.tf=null;return loadMe()});return;
case 'ttoggle':guard(api('/team/'+v,{method:'POST',body:{active:!S.users[v].active}}),S.users[v].active?'Доступ отключён':'Доступ включён',function(){return loadMe()});return;
default:return}
render()});

/* ---------- старт ---------- */
function boot(){if(TG){TG.ready();TG.expand()}if(!INIT){S.fatal='Откройте планировщик через Telegram';render();return}render();
try{S.device=Intl.DateTimeFormat().resolvedOptions().timeZone||null}catch(x){}
loadMe().then(function(){var today=dkey(Date.now(),vtz());S.day=today;S.week0=monday(today);return loadWeek(S.week0)}).then(function(){render();var e=QS.get('e'),d=QS.get('do');if(!e)return;
return api('/events/'+e).then(function(x){goDay(dkey(x.start,vtz()));return loadWeek(monday(dkey(x.start,vtz())))}).then(function(){if(d==='propose'||d==='decline'){S.cf='';S.modal={kind:'comment',id:+e,act:d};render()}else if(d==='resched'){var x=ev(e);if(x){S.rf={day:dkey(x.start,vtz()),time:hm(x.start,vtz())};S.modal={kind:'resched',id:+e,mode:'staff'};render()}}else openEvent(e)}).catch(function(err){toast(err.message)})})
.catch(function(err){S.fatal=err.message;render()})}
boot();
})();
</script>
